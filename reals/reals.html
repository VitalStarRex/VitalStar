<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050914">

    <title>VitalStar Reals</title>

    <style>

        /* =========================================================
           VITALSTAR REALS
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050914;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
        }

        /* =========================================================
           APP
           ========================================================= */

        #realsApp {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #050914;
        }

        /* =========================================================
           TOP BAR
           ========================================================= */

        .reals-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: 64px;

            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 15px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(5, 9, 20, 0.95),
                    rgba(5, 9, 20, 0)
                );
        }

        .header-button {
            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            background: rgba(255, 255, 255, 0.10);

            font-size: 20px;

            cursor: pointer;

            backdrop-filter: blur(10px);
        }

        .header-button:active {
            transform: scale(0.92);
        }

        .reals-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.4px;

            text-shadow:
                0 0 8px rgba(0, 140, 255, 0.8),
                0 0 18px rgba(0, 140, 255, 0.45);
        }

        /* =========================================================
           FOUR REALS BUTTONS
           ========================================================= */

        .reals-tabs {
            position: absolute;

            top: 68px;
            left: 10px;
            right: 10px;

            z-index: 900;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 6px;

            padding: 6px;

            border-radius: 18px;

            background: rgba(5, 9, 20, 0.80);

            border: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(16px);
        }

        .reals-tab {
            min-height: 48px;

            border: 0;
            border-radius: 13px;

            color: rgba(255, 255, 255, 0.65);

            background: transparent;

            cursor: pointer;

            font-size: 10px;
            font-weight: 700;

            transition: 0.2s ease;
        }

        .reals-tab .icon {
            display: block;

            margin-bottom: 2px;

            font-size: 18px;
            line-height: 19px;
        }

        .reals-tab.active {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #075eff,
                    #702cff
                );

            box-shadow:
                0 0 15px rgba(0, 100, 255, 0.45);
        }

        .reals-tab:active {
            transform: scale(0.95);
        }

        /* =========================================================
           CONTENT
           ========================================================= */

        #realsContent {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        /* =========================================================
           VIDEO FEED CONTAINER
           ========================================================= */

        .reals-feed {
            width: 100%;
            height: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            scroll-snap-type: y mandatory;

            scrollbar-width: none;

            background: #050914;
        }

        .reals-feed::-webkit-scrollbar {
            display: none;
        }

        /* =========================================================
           REAL ITEM
           ========================================================= */

        .real-item {
            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;

            scroll-snap-align: start;

            background: #050914;
        }

        .real-item video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            background: #000;
        }

        /* =========================================================
           VIDEO GRADIENT
           ========================================================= */

        .real-gradient {
            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.45),
                    transparent 25%,
                    transparent 60%,
                    rgba(0, 0, 0, 0.78)
                );
        }

        /* =========================================================
           VIDEO INFORMATION
           ========================================================= */

        .real-info {
            position: absolute;

            left: 15px;
            right: 80px;
            bottom: 30px;

            z-index: 5;
        }

        .real-user {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-bottom: 10px;
        }

        .real-avatar {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #ffffff;

            background: #101827;
        }

        .real-name {
            font-size: 15px;
            font-weight: 800;
        }

        .real-username {
            font-size: 12px;

            color: rgba(255, 255, 255, 0.7);
        }

        .real-caption {
            font-size: 14px;

            line-height: 1.4;

            color: #ffffff;
        }

        /* =========================================================
           ACTION BUTTONS
           ========================================================= */

        .real-actions {
            position: absolute;

            right: 12px;
            bottom: 30px;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 17px;
        }

        .real-action {
            border: 0;

            background: transparent;

            color: #ffffff;

            cursor: pointer;

            text-align: center;
        }

        .real-action-icon {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.38);

            backdrop-filter: blur(8px);

            font-size: 22px;
        }

        .real-action-count {
            display: block;

            margin-top: 3px;

            font-size: 10px;

            color: #ffffff;
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .reals-empty {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 10px;

            text-align: center;

            padding: 30px;

            color: rgba(255, 255, 255, 0.65);
        }

        .reals-empty-icon {
            font-size: 45px;
        }

        .reals-empty-title {
            color: #ffffff;

            font-size: 18px;

            font-weight: 800;
        }

        .reals-empty-text {
            font-size: 13px;

            line-height: 1.5;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 700px) {

            .reals-tabs {
                left: 50%;
                right: auto;

                width: 500px;

                transform: translateX(-50%);
            }

            .real-info {
                left: calc(50% - 300px);
            }

            .real-actions {
                right: calc(50% - 300px);
            }

        }

    </style>

</head>


<body>

    <div id="realsApp">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="reals-header">

            <button
                class="header-button"
                id="realsBackBtn"
                aria-label="Back"
            >
                ←
            </button>

            <div class="reals-title">
                VitalStar Reals
            </div>

            <button
                class="header-button"
                id="realsSettingsBtn"
                aria-label="Reals settings"
            >
                ⚙️
            </button>

        </header>


        <!-- =====================================================
             FOUR REALS TABS
             ===================================================== -->

        <nav
            class="reals-tabs"
            id="realsTabs"
            aria-label="Reals sections"
        >

            <button
                class="reals-tab active"
                data-section="general"
                id="generalTab"
            >
                <span class="icon">🌎</span>
                General
            </button>


            <button
                class="reals-tab"
                data-section="groups"
                id="groupsTab"
            >
                <span class="icon">👥</span>
                Groups
            </button>


            <button
                class="reals-tab"
                data-section="posts"
                id="postsTab"
            >
                <span class="icon">📹</span>
                Posts
            </button>


            <button
                class="reals-tab"
                data-section="fourth"
                id="fourthTab"
            >
                <span class="icon">✨</span>
                More
            </button>

        </nav>


        <!-- =====================================================
             REALS CONTENT

             JavaScript files will render their feeds here.

             generalvids.js
             groupvids.js
             postvids.js
             ===================================================== -->

        <main id="realsContent"></main>

    </div>

</body>

</html>
