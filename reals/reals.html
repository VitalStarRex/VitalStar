<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050914">

    <title>VitalStar Reals</title>

    <style>

        /* =========================================================
           VITALSTAR REALS
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050914;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
        }

        button {
            font-family: inherit;
        }

        /* =========================================================
           APP
           ========================================================= */

        #realsApp {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #050914;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .reals-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: 64px;

            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 15px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(5, 9, 20, 0.97),
                    rgba(5, 9, 20, 0)
                );
        }

        .header-button {
            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            background: rgba(255, 255, 255, 0.10);

            font-size: 20px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition: 0.2s ease;
        }

        .header-button:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .header-button:active {
            transform: scale(0.90);
        }

        .reals-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.4px;

            text-shadow:
                0 0 8px rgba(0, 140, 255, 0.8),
                0 0 18px rgba(0, 140, 255, 0.45);
        }

        /* =========================================================
           TABS
           ========================================================= */

        .reals-tabs {
            position: absolute;

            top: 68px;
            left: 10px;
            right: 10px;

            z-index: 900;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 6px;

            padding: 6px;

            border-radius: 18px;

            background: rgba(5, 9, 20, 0.82);

            border: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(16px);
        }

        .reals-tab {
            min-height: 48px;

            border: 0;
            border-radius: 13px;

            color: rgba(255, 255, 255, 0.65);

            background: transparent;

            cursor: pointer;

            font-size: 10px;
            font-weight: 700;

            transition: 0.2s ease;
        }

        .reals-tab .icon {
            display: block;

            margin-bottom: 2px;

            font-size: 18px;
            line-height: 19px;
        }

        .reals-tab.active {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #075eff,
                    #702cff
                );

            box-shadow:
                0 0 15px rgba(0, 100, 255, 0.45);
        }

        .reals-tab:not(.active):hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .reals-tab:active {
            transform: scale(0.95);
        }

        /* =========================================================
           CONTENT
           ========================================================= */

        #realsContent {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        /* =========================================================
           VIDEO FEED
           ========================================================= */

        .reals-feed {
            width: 100%;
            height: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            scroll-snap-type: y mandatory;

            scrollbar-width: none;

            background: #050914;
        }

        .reals-feed::-webkit-scrollbar {
            display: none;
        }

        .real-item {
            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;

            scroll-snap-align: start;

            background: #050914;
        }

        .real-item video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            background: #000;
        }

        /* =========================================================
           VIDEO GRADIENT
           ========================================================= */

        .real-gradient {
            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.45),
                    transparent 25%,
                    transparent 60%,
                    rgba(0, 0, 0, 0.78)
                );
        }

        /* =========================================================
           VIDEO INFORMATION
           ========================================================= */

        .real-info {
            position: absolute;

            left: 15px;
            right: 80px;
            bottom: 30px;

            z-index: 5;
        }

        .real-user {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-bottom: 10px;
        }

        .real-avatar {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #ffffff;

            background: #101827;
        }

        .real-name {
            font-size: 15px;
            font-weight: 800;
        }

        .real-username {
            font-size: 12px;

            color: rgba(255, 255, 255, 0.7);
        }

        .real-caption {
            font-size: 14px;

            line-height: 1.4;

            color: #ffffff;
        }

        /* =========================================================
           ACTION BUTTONS
           ========================================================= */

        .real-actions {
            position: absolute;

            right: 12px;
            bottom: 30px;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 17px;
        }

        .real-action {
            border: 0;

            background: transparent;

            color: #ffffff;

            cursor: pointer;

            text-align: center;
        }

        .real-action-icon {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.38);

            backdrop-filter: blur(8px);

            font-size: 22px;
        }

        .real-action-count {
            display: block;

            margin-top: 3px;

            font-size: 10px;

            color: #ffffff;
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .reals-empty {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 10px;

            text-align: center;

            padding: 30px;

            color: rgba(255, 255, 255, 0.65);
        }

        .reals-empty-icon {
            font-size: 45px;
        }

        .reals-empty-title {
            color: #ffffff;

            font-size: 18px;

            font-weight: 800;
        }

        .reals-empty-text {
            font-size: 13px;

            line-height: 1.5;
        }

        /* =========================================================
           SETTINGS OVERLAY
           ========================================================= */

        #realsSettings {
            position: fixed;

            inset: 0;

            z-index: 3000;

            display: none;

            align-items: flex-end;
            justify-content: center;

            background: rgba(0, 0, 0, 0.62);

            backdrop-filter: blur(5px);
        }

        #realsSettings.show {
            display: flex;
        }

        .settings-panel {
            width: 100%;
            max-width: 600px;

            max-height: 80dvh;

            overflow-y: auto;

            padding: 20px 18px 28px;

            border-radius: 25px 25px 0 0;

            background:
                linear-gradient(
                    145deg,
                    #071226,
                    #050914
                );

            border-top: 1px solid rgba(0, 140, 255, 0.35);

            box-shadow:
                0 -10px 40px rgba(0, 0, 0, 0.5);

            animation: settingsUp 0.22s ease;
        }

        @keyframes settingsUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .settings-handle {
            width: 45px;
            height: 5px;

            margin: 0 auto 18px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.25);
        }

        .settings-title {
            font-size: 21px;
            font-weight: 800;

            margin-bottom: 5px;
        }

        .settings-subtitle {
            font-size: 12px;

            color: rgba(255, 255, 255, 0.55);

            margin-bottom: 20px;
        }

        .settings-row {
            width: 100%;

            min-height: 58px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 12px 0;

            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .settings-label {
            font-size: 14px;
            font-weight: 700;
        }

        .settings-description {
            margin-top: 3px;

            font-size: 11px;

            color: rgba(255, 255, 255, 0.48);
        }

        .settings-close {
            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: 0;

            border-radius: 13px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #075eff,
                    #702cff
                );

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
        }

        /* =========================================================
           TOGGLE
           ========================================================= */

        .toggle {
            position: relative;

            width: 48px;
            height: 27px;

            flex-shrink: 0;

            border: 0;

            border-radius: 30px;

            background: #273247;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .toggle::after {
            content: "";

            position: absolute;

            top: 4px;
            left: 4px;

            width: 19px;
            height: 19px;

            border-radius: 50%;

            background: #ffffff;

            transition: 0.2s ease;
        }

        .toggle.on {
            background: #075eff;

            box-shadow:
                0 0 10px rgba(0, 100, 255, 0.4);
        }

        .toggle.on::after {
            transform: translateX(21px);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 700px) {

            .reals-tabs {
                left: 50%;
                right: auto;

                width: 500px;

                transform: translateX(-50%);
            }

            .real-info {
                left: calc(50% - 300px);
            }

            .real-actions {
                right: calc(50% - 300px);
            }

        }

    </style>

</head>


<body>

    <div id="realsApp">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="reals-header">

            <button
                type="button"
                class="header-button"
                id="realsBackBtn"
                aria-label="Back"
            >
                ←
            </button>

            <div class="reals-title">
                VitalStar Reals
            </div>

            <button
                type="button"
                class="header-button"
                id="realsSettingsBtn"
                aria-label="Reals settings"
            >
                ⚙️
            </button>

        </header>


        <!-- =====================================================
             FOUR REALS TABS
             ===================================================== -->

        <nav
            class="reals-tabs"
            id="realsTabs"
            aria-label="Reals sections"
        >

            <button
                type="button"
                class="reals-tab active"
                data-section="general"
                id="generalTab"
            >
                <span class="icon">🌎</span>
                General
            </button>


            <button
                type="button"
                class="reals-tab"
                data-section="groups"
                id="groupsTab"
            >
                <span class="icon">👥</span>
                Groups
            </button>


            <button
                type="button"
                class="reals-tab"
                data-section="posts"
                id="postsTab"
            >
                <span class="icon">📹</span>
                Posts
            </button>


            <button
                type="button"
                class="reals-tab"
                data-section="fourth"
                id="fourthTab"
            >
                <span class="icon">✨</span>
                More
            </button>

        </nav>


        <!-- =====================================================
             REALS CONTENT
             ===================================================== -->

        <main id="realsContent"></main>


        <!-- =====================================================
             SETTINGS
             ===================================================== -->

        <div
            id="realsSettings"
            aria-hidden="true"
        >

            <section
                class="settings-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="settingsTitle"
            >

                <div class="settings-handle"></div>

                <h2
                    class="settings-title"
                    id="settingsTitle"
                >
                    Reals Settings
                </h2>

                <p class="settings-subtitle">
                    Customize your VitalStar Reals experience.
                </p>


                <div class="settings-row">

                    <div>
                        <div class="settings-label">
                            Autoplay videos
                        </div>

                        <div class="settings-description">
                            Automatically play the visible Real.
                        </div>
                    </div>

                    <button
                        type="button"
                        class="toggle on"
                        data-setting="autoplay"
                        aria-label="Toggle autoplay"
                    ></button>

                </div>


                <div class="settings-row">

                    <div>
                        <div class="settings-label">
                            Start muted
                        </div>

                        <div class="settings-description">
                            Start videos muted when opening Reals.
                        </div>
                    </div>

                    <button
                        type="button"
                        class="toggle on"
                        data-setting="muted"
                        aria-label="Toggle muted"
                    ></button>

                </div>


                <div class="settings-row">

                    <div>
                        <div class="settings-label">
                            Data saver
                        </div>

                        <div class="settings-description">
                            Reduce automatic video loading.
                        </div>
                    </div>

                    <button
                        type="button"
                        class="toggle"
                        data-setting="dataSaver"
                        aria-label="Toggle data saver"
                    ></button>

                </div>


                <button
                    type="button"
                    class="settings-close"
                    id="closeSettings"
                >
                    Done
                </button>

            </section>

        </div>

    </div>


    <script>

        /* =========================================================
           VITALSTAR REALS — PAGE CONTROLLER
           ========================================================= */

        document.addEventListener("DOMContentLoaded", () => {

            const tabs =
                document.querySelectorAll(".reals-tab");

            const settingsButton =
                document.getElementById("realsSettingsBtn");

            const settingsOverlay =
                document.getElementById("realsSettings");

            const closeSettings =
                document.getElementById("closeSettings");

            const backButton =
                document.getElementById("realsBackBtn");


            /* =====================================================
               TAB SWITCHING
               ===================================================== */

            tabs.forEach((tab) => {

                tab.addEventListener("click", () => {

                    tabs.forEach((item) => {
                        item.classList.remove("active");
                    });

                    tab.classList.add("active");

                    const section =
                        tab.dataset.section;

                    /*
                     * These events are what the future JS files
                     * can listen for.
                     *
                     * generalvids.js
                     * groupvids.js
                     * postvids.js
                     */

                    window.dispatchEvent(
                        new CustomEvent(
                            "reals:sectionchange",
                            {
                                detail: {
                                    section: section
                                }
                            }
                        )
                    );

                });

            });


            /* =====================================================
               SETTINGS OPEN
               ===================================================== */

            settingsButton.addEventListener(
                "click",
                () => {

                    settingsOverlay.classList.add("show");

                    settingsOverlay.setAttribute(
                        "aria-hidden",
                        "false"
                    );

                }
            );


            /* =====================================================
               SETTINGS CLOSE
               ===================================================== */

            function hideSettings() {

                settingsOverlay.classList.remove("show");

                settingsOverlay.setAttribute(
                    "aria-hidden",
                    "true"
                );

            }


            closeSettings.addEventListener(
                "click",
                hideSettings
            );


            /* =====================================================
               CLOSE SETTINGS BY TAPPING OUTSIDE
               ===================================================== */

            settingsOverlay.addEventListener(
                "click",
                (event) => {

                    if (
                        event.target === settingsOverlay
                    ) {
                        hideSettings();
                    }

                }
            );


            /* =====================================================
               SETTINGS TOGGLES
               ===================================================== */

            document
                .querySelectorAll(".toggle")
                .forEach((toggle) => {

                    toggle.addEventListener(
                        "click",
                        () => {

                            toggle.classList.toggle("on");

                            const setting =
                                toggle.dataset.setting;

                            const enabled =
                                toggle.classList.contains("on");

                            localStorage.setItem(
                                `vitalstar_reals_${setting}`,
                                enabled ? "true" : "false"
                            );

                            window.dispatchEvent(
                                new CustomEvent(
                                    "reals:settingchange",
                                    {
                                        detail: {
                                            setting: setting,
                                            enabled: enabled
                                        }
                                    }
                                )
                            );

                        }
                    );

                });


            /* =====================================================
               LOAD SAVED SETTINGS
               ===================================================== */

            document
                .querySelectorAll(".toggle")
                .forEach((toggle) => {

                    const setting =
                        toggle.dataset.setting;

                    const saved =
                        localStorage.getItem(
                            `vitalstar_reals_${setting}`
                        );

                    if (saved === "true") {
                        toggle.classList.add("on");
                    }

                    if (saved === "false") {
                        toggle.classList.remove("on");
                    }

                });


            /* =====================================================
               BACK BUTTON
               ===================================================== */

            backButton.addEventListener(
                "click",
                () => {

                    if (window.history.length > 1) {

                        window.history.back();

                    } else {

                        window.location.href =
                            "../home.html";

                    }

                }
            );


            /* =====================================================
               INITIAL SECTION
               ===================================================== */

            window.dispatchEvent(
                new CustomEvent(
                    "reals:sectionchange",
                    {
                        detail: {
                            section: "general"
                        }
                    }
                )
            );

        });

    </script>

</body>

</html>
