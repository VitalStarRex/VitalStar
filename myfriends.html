<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VitalStar — Friends</title>

<link rel="manifest" href="manifest.json">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#070914;
    color:#fff;
    min-height:100vh;
    padding-bottom:30px;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,210,255,.10),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(143,61,255,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,25,168,.07),
            transparent 30%
        );
    z-index:-1;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    height:70px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:rgba(7,9,20,.94);
    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.back-btn{
    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:#151a2d;
    color:#fff;

    font-size:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
}

.header-title{
    flex:1;
    margin-left:12px;
}

.header-title strong{
    font-size:20px;
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #00d9ff,
            #8f4dff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header-title span{
    display:block;

    margin-top:3px;

    color:#7f88a7;

    font-size:10px;
}

/* =========================================================
   PAGE
   ========================================================= */

.container{
    width:100%;
    max-width:800px;

    margin:auto;

    padding:18px 12px 40px;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-box{
    display:flex;
    align-items:center;
    gap:9px;

    background:#12172a;

    border:1px solid rgba(255,255,255,.08);

    border-radius:17px;

    padding:0 14px;

    height:50px;

    margin-bottom:17px;
}

.search-box span{
    font-size:19px;
}

.search-box input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:14px;
}

.search-box input::placeholder{
    color:#737c9c;
}

/* =========================================================
   TABS
   ========================================================= */

.tabs{
    display:flex;
    gap:8px;

    overflow-x:auto;

    scrollbar-width:none;

    margin-bottom:18px;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex:0 0 auto;

    border:1px solid rgba(255,255,255,.08);

    border-radius:20px;

    padding:10px 16px;

    background:#111629;

    color:#929bb9;

    font-size:12px;
    font-weight:800;

    cursor:pointer;
}

.tab.active{
    background:
        linear-gradient(
            135deg,
            #6735ff,
            #008dff
        );

    color:#fff;

    border-color:transparent;

    box-shadow:
        0 0 18px rgba(103,53,255,.25);
}

/* =========================================================
   SECTION
   ========================================================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:5px 2px 10px;
}

.section-title h2{
    font-size:17px;
}

.count{
    color:#7e89aa;
    font-size:11px;
}

/* =========================================================
   USER CARD
   ========================================================= */

.user-card{
    display:flex;
    align-items:center;

    gap:11px;

    padding:12px;

    margin-bottom:9px;

    background:
        linear-gradient(
            145deg,
            rgba(18,23,42,.97),
            rgba(12,16,30,.97)
        );

    border:1px solid rgba(255,255,255,.07);

    border-radius:18px;

    box-shadow:
        0 6px 22px rgba(0,0,0,.20);
}

.avatar-wrap{
    position:relative;
    flex:0 0 auto;
}

.avatar{
    width:52px;
    height:52px;

    border-radius:50%;

    object-fit:cover;

    background:
        linear-gradient(
            135deg,
            #713cff,
            #00cfff
        );

    border:2px solid rgba(120,75,255,.65);
}

.online-dot{
    position:absolute;

    right:0;
    bottom:2px;

    width:13px;
    height:13px;

    border-radius:50%;

    background:#37e66b;

    border:3px solid #111629;
}

.user-details{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:14px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.username{
    margin-top:3px;

    color:#77819f;

    font-size:11px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.action-btn{
    border:0;

    border-radius:12px;

    padding:9px 11px;

    font-size:11px;
    font-weight:900;

    cursor:pointer;

    color:#fff;

    white-space:nowrap;
}

.primary{
    background:
        linear-gradient(
            135deg,
            #713cff,
            #008fff
        );
}

.success{
    background:
        linear-gradient(
            135deg,
            #00b96b,
            #00d98b
        );
}

.danger{
    background:#292033;
    color:#ff6c9c;
}

.neutral{
    background:#20263b;
    color:#c9d0e7;
}

.action-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================================================
   EMPTY / LOADING
   ========================================================= */

.empty{
    text-align:center;

    padding:45px 20px;

    color:#77819f;
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

.empty strong{
    display:block;

    color:#dce2f8;

    font-size:15px;

    margin-bottom:5px;
}

.empty p{
    font-size:12px;
}

.loader{
    width:35px;
    height:35px;

    margin:45px auto;

    border:3px solid rgba(255,255,255,.10);

    border-top-color:#00d9ff;
    border-right-color:#8f4dff;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   TOAST
   ========================================================= */

#toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#171d32;

    border:1px solid rgba(255,255,255,.10);

    color:#fff;

    padding:12px 17px;

    border-radius:14px;

    font-size:12px;
    font-weight:800;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4);

    transition:.25s;

    z-index:5000;
}

#toast.show{
    transform:
        translate(-50%,0);

    opacity:1;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    header{
        height:66px;
        padding:0 9px;
    }

    .container{
        padding:15px 9px 35px;
    }

    .user-card{
        padding:10px;
    }

    .avatar{
        width:48px;
        height:48px;
    }

    .user-actions{
        gap:4px;
    }

    .action-btn{
        padding:8px 9px;
        font-size:10px;
    }

}

</style>

</head>

<body>

<header>

<a
    href="home.html"
    class="back-btn"
    aria-label="Back"
>
    ←
</a>

<div class="header-title">

<strong>Friends</strong>

<span>Connect with people on VitalStar</span>

</div>

</header>


<main class="container">

<div class="search-box">

<span>🔍</span>

<input
    type="search"
    id="searchInput"
    placeholder="Search people..."
    autocomplete="off"
>

</div>


<div class="tabs">

<button
    class="tab active"
    data-tab="friends"
>
    👥 Friends
</button>

<button
    class="tab"
    data-tab="requests"
>
    📩 Requests
</button>

<button
    class="tab"
    data-tab="sent"
>
    📤 Sent
</button>

<button
    class="tab"
    data-tab="discover"
>
    🔎 Discover
</button>

</div>


<section id="friendsSection">

<div class="section-title">

<h2>Your Friends</h2>

<span
    class="count"
    id="friendsCount"
>
    0 friends
</span>

</div>

<div id="friendsList">

<div class="loader"></div>

</div>

</section>


<section
    id="requestsSection"
    style="display:none"
>

<div class="section-title">

<h2>Friend Requests</h2>

<span
    class="count"
    id="requestsCount"
>
    0
</span>

</div>

<div id="requestsList">

<div class="loader"></div>

</div>

</section>


<section
    id="sentSection"
    style="display:none"
>

<div class="section-title">

<h2>Sent Requests</h2>

<span
    class="count"
    id="sentCount"
>
    0
</span>

</div>

<div id="sentList">

<div class="loader"></div>

</div>

</section>


<section
    id="discoverSection"
    style="display:none"
>

<div class="section-title">

<h2>Discover People</h2>

<span
    class="count"
    id="discoverCount"
>
    0
</span>

</div>

<div id="discoverList">

<div class="loader"></div>

</div>

</section>

</main>


<div id="toast"></div>


<script
    type="module"
    src="myfriends.js"
></script>

</body>

</html>
