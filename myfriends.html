<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>VitalStar — Friends</title>

<link rel="manifest" href="manifest.json">

<!-- Applies the saved theme BEFORE first paint (same source as messages page) -->
<script>
(function () {
    var LIGHT = ["light", "white", "bright"];
    var DARK = ["dark", "night"];

    function readTheme() {
        var stored = "";
        var keys = ["vitalstar-theme", "vs-theme", "theme", "themeMode", "vitalstarTheme"];
        for (var i = 0; i < keys.length; i++) {
            try {
                var value = localStorage.getItem(keys[i]);
                if (!value) continue;
                var n = String(value).toLowerCase();
                if (LIGHT.indexOf(n) > -1) stored = "light";
                else if (DARK.indexOf(n) > -1) stored = "dark";
                if (stored) break;
                try {
                    var p = JSON.parse(value);
                    var m = String((p && (p.theme || p.mode || p.value)) || "").toLowerCase();
                    if (LIGHT.indexOf(m) > -1) stored = "light";
                    else if (DARK.indexOf(m) > -1) stored = "dark";
                    if (stored) break;
                } catch (e) {}
            } catch (e) {}
        }
        var root = document.documentElement.getAttribute("data-theme");
        var chosen = String(stored || root || "dark").toLowerCase();
        return LIGHT.indexOf(chosen) > -1 ? "light" : "dark";
    }

    function apply() {
        var theme = readTheme();
        var html = document.documentElement;
        if (html.getAttribute("data-theme") !== theme) html.setAttribute("data-theme", theme);
        html.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f4f7ff" : "#070914");
    }

    apply();

    window.addEventListener("vitalstar-theme-change", apply);
    window.addEventListener("themechange", apply);
    window.addEventListener("storage", function (e) {
        if (!e.key || /theme/i.test(e.key)) apply();
    });
    window.addEventListener("pageshow", apply);
    document.addEventListener("visibilitychange", function () {
        if (!document.hidden) apply();
    });
})();
</script>

<style>

/* =========================================================
   THEME TOKENS
   ========================================================= */

:root,
html[data-theme="dark"]{
    --bg:#070914;
    --bg-glow-1:rgba(0,210,255,.12);
    --bg-glow-2:rgba(143,61,255,.14);
    --bg-glow-3:rgba(255,25,168,.08);

    --surface:#12172a;
    --surface-2:#161c33;
    --card-a:rgba(20,26,48,.96);
    --card-b:rgba(11,15,29,.96);

    --text:#ffffff;
    --text-soft:#dce2f8;
    --muted:#7f88a7;

    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.16);

    --header-bg:rgba(7,9,20,.82);
    --shadow:0 8px 28px rgba(0,0,0,.28);
    --shadow-hover:0 14px 38px rgba(0,0,0,.38);

    --accent-1:#7a3cff;
    --accent-2:#00a2ff;
    --accent-3:#00e0ff;
    --accent-glow:rgba(122,60,255,.38);

    --ok-1:#00b96b;
    --ok-2:#00e08f;
    --danger-bg:rgba(255,92,150,.12);
    --danger-text:#ff7aa5;
    --danger-border:rgba(255,92,150,.22);
    --neutral-bg:rgba(255,255,255,.07);
    --neutral-text:#cfd6ee;

    --dot-ring:#111629;
    --toast-bg:rgba(23,29,50,.96);
    --input-focus:rgba(0,200,255,.45);
}

html[data-theme="light"]{
    --bg:#f4f7ff;
    --bg-glow-1:rgba(0,162,255,.14);
    --bg-glow-2:rgba(122,60,255,.13);
    --bg-glow-3:rgba(255,80,170,.09);

    --surface:#ffffff;
    --surface-2:#f0f3fc;
    --card-a:rgba(255,255,255,.98);
    --card-b:rgba(250,252,255,.98);

    --text:#182238;
    --text-soft:#2a3556;
    --muted:#68718a;

    --border:rgba(40,55,110,.10);
    --border-strong:rgba(40,55,110,.20);

    --header-bg:rgba(255,255,255,.86);
    --shadow:0 6px 22px rgba(50,65,120,.10);
    --shadow-hover:0 14px 34px rgba(50,65,120,.18);

    --accent-1:#6a3cf0;
    --accent-2:#2575fc;
    --accent-3:#00a2e8;
    --accent-glow:rgba(106,60,240,.28);

    --ok-1:#00a85f;
    --ok-2:#12cc84;
    --danger-bg:#fff0f4;
    --danger-text:#e03a67;
    --danger-border:#ffd9e3;
    --neutral-bg:#eef1fa;
    --neutral-text:#4a5578;

    --dot-ring:#ffffff;
    --toast-bg:rgba(255,255,255,.98);
    --input-focus:rgba(37,117,252,.40);
}

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
    color-scheme:dark;
}

html[data-theme="light"]{
    color-scheme:light;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));
    transition:background .3s ease,color .3s ease;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        radial-gradient(circle at 8% 8%,var(--bg-glow-1),transparent 28%),
        radial-gradient(circle at 92% 14%,var(--bg-glow-2),transparent 28%),
        radial-gradient(circle at 50% 105%,var(--bg-glow-3),transparent 34%);
}

::selection{
    background:var(--accent-glow);
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    min-height:calc(70px + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 14px 0;

    display:flex;
    align-items:center;

    background:var(--header-bg);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);

    border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.08);
}

header::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:-1px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--accent-1),var(--accent-3),transparent);
    opacity:.55;
}

.back-btn{
    width:42px;
    height:42px;

    border:1px solid var(--border);
    border-radius:50%;

    background:var(--surface);
    color:var(--text);

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    box-shadow:var(--shadow);
    transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}

.back-btn:hover{
    transform:translateX(-2px);
    border-color:var(--accent-2);
    box-shadow:0 0 0 3px var(--accent-glow);
}

.back-btn:active{
    transform:scale(.92);
}

.header-title{
    flex:1;
    margin-left:13px;
}

.header-title strong{
    font-size:21px;
    font-weight:900;
    letter-spacing:.2px;

    background:linear-gradient(90deg,var(--text),var(--accent-3),var(--accent-1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
}

.header-title span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:10.5px;
    letter-spacing:.2px;
}

/* =========================================================
   PAGE
   ========================================================= */

.container{
    width:100%;
    max-width:800px;
    margin:auto;
    padding:18px 12px 40px;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-box{
    display:flex;
    align-items:center;
    gap:10px;

    height:52px;
    padding:0 16px;
    margin-bottom:16px;

    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;

    box-shadow:var(--shadow);
    transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}

.search-box:focus-within{
    border-color:var(--input-focus);
    box-shadow:0 0 0 4px var(--accent-glow),var(--shadow);
    transform:translateY(-1px);
}

.search-box span{
    font-size:18px;
    opacity:.85;
}

.search-box input{
    width:100%;
    height:100%;

    border:0;
    outline:0;
    background:transparent;

    color:var(--text);
    font-size:14.5px;
}

.search-box input::placeholder{
    color:var(--muted);
}

.search-box input::-webkit-search-cancel-button{
    filter:grayscale(1);
    opacity:.6;
}

/* =========================================================
   TABS
   ========================================================= */

.tabs{
    display:flex;
    gap:8px;

    overflow-x:auto;
    scrollbar-width:none;

    padding:2px 2px 6px;
    margin-bottom:14px;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex:0 0 auto;

    border:1px solid var(--border);
    border-radius:999px;

    padding:10px 17px;

    background:var(--surface);
    color:var(--muted);

    font-size:12.5px;
    font-weight:800;
    letter-spacing:.2px;

    cursor:pointer;

    transition:transform .2s ease,color .2s ease,background .25s ease,box-shadow .25s ease,border-color .2s ease;
}

.tab:hover{
    color:var(--text);
    border-color:var(--border-strong);
}

.tab:active{
    transform:scale(.95);
}

.tab.active{
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    color:#fff;
    border-color:transparent;
    box-shadow:0 6px 20px var(--accent-glow);
}

/* =========================================================
   SECTION
   ========================================================= */

section{
    animation:sectionIn .35s ease both;
}

@keyframes sectionIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:8px 3px 12px;
}

.section-title h2{
    position:relative;
    padding-left:11px;
    font-size:17px;
    font-weight:900;
    color:var(--text);
}

.section-title h2::before{
    content:"";
    position:absolute;
    left:0;
    top:3px;
    bottom:3px;
    width:4px;
    border-radius:4px;
    background:linear-gradient(180deg,var(--accent-3),var(--accent-1));
    box-shadow:0 0 10px var(--accent-glow);
}

.count{
    padding:4px 11px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:11px;
    font-weight:800;
}

/* =========================================================
   USER CARD
   ========================================================= */

.user-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;

    padding:13px;
    margin-bottom:10px;

    background:linear-gradient(145deg,var(--card-a),var(--card-b));
    border:1px solid var(--border);
    border-radius:20px;

    box-shadow:var(--shadow);
    overflow:hidden;

    animation:cardIn .4s ease both;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}

.user-card::before{
    content:"";
    position:absolute;
    left:0;
    top:16%;
    bottom:16%;
    width:3px;
    border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,var(--accent-3),var(--accent-1));
    opacity:0;
    transition:opacity .22s ease;
}

.user-card:hover{
    transform:translateY(-2px);
    border-color:var(--border-strong);
    box-shadow:var(--shadow-hover);
}

.user-card:hover::before{
    opacity:1;
}

.user-card:active{
    transform:scale(.985);
}

.user-card:nth-child(2){animation-delay:.04s;}
.user-card:nth-child(3){animation-delay:.08s;}
.user-card:nth-child(4){animation-delay:.12s;}
.user-card:nth-child(5){animation-delay:.16s;}
.user-card:nth-child(n+6){animation-delay:.2s;}

@keyframes cardIn{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
}

.avatar-wrap{
    position:relative;
    flex:0 0 auto;
}

.avatar{
    width:54px;
    height:54px;

    border-radius:50%;
    object-fit:cover;

    background:linear-gradient(135deg,var(--accent-1),var(--accent-3));

    border:2px solid var(--accent-1);
    box-shadow:0 0 0 3px var(--accent-glow),0 4px 14px rgba(0,0,0,.18);
}

.online-dot{
    position:absolute;
    right:0;
    bottom:2px;

    width:14px;
    height:14px;

    border-radius:50%;
    background:#2fe36a;

    border:3px solid var(--dot-ring);
    box-shadow:0 0 8px rgba(47,227,106,.75);
}

.user-details{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:14.5px;
    font-weight:900;
    color:var(--text);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.username{
    margin-top:4px;
    color:var(--muted);
    font-size:11.5px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.action-btn{
    border:1px solid transparent;
    border-radius:13px;

    padding:9px 13px;

    font-size:11.5px;
    font-weight:900;
    letter-spacing:.2px;

    cursor:pointer;
    color:#fff;
    white-space:nowrap;

    transition:transform .18s ease,box-shadow .2s ease,filter .2s ease,background .2s ease;
}

.action-btn:hover:not(:disabled){
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.action-btn:active:not(:disabled){
    transform:scale(.94);
}

.primary{
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    box-shadow:0 5px 16px var(--accent-glow);
}

.success{
    background:linear-gradient(135deg,var(--ok-1),var(--ok-2));
    box-shadow:0 5px 16px rgba(0,200,120,.30);
}

.danger{
    background:var(--danger-bg);
    color:var(--danger-text);
    border-color:var(--danger-border);
}

.neutral{
    background:var(--neutral-bg);
    color:var(--neutral-text);
    border-color:var(--border);
}

.action-btn:focus-visible,
.tab:focus-visible,
.back-btn:focus-visible{
    outline:2px solid var(--accent-3);
    outline-offset:2px;
}

.action-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none;
}

/* =========================================================
   EMPTY / LOADING
   ========================================================= */

.empty{
    text-align:center;

    padding:46px 22px;
    margin-top:6px;

    color:var(--muted);

    background:linear-gradient(145deg,var(--card-a),var(--card-b));
    border:1px dashed var(--border-strong);
    border-radius:22px;
}

.empty-icon{
    font-size:44px;
    margin-bottom:12px;
    filter:drop-shadow(0 0 14px var(--accent-glow));
}

.empty strong{
    display:block;
    color:var(--text-soft);
    font-size:15.5px;
    margin-bottom:6px;
}

.empty p{
    font-size:12.5px;
    line-height:1.5;
}

.loader{
    width:38px;
    height:38px;

    margin:48px auto;

    border:3px solid var(--border);
    border-top-color:var(--accent-3);
    border-right-color:var(--accent-1);
    border-radius:50%;

    filter:drop-shadow(0 0 6px var(--accent-glow));
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* =========================================================
   TOAST
   ========================================================= */

#toast{
    position:fixed;
    left:50%;
    bottom:calc(25px + env(safe-area-inset-bottom,0px));

    max-width:calc(100% - 32px);

    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;

    background:var(--toast-bg);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);

    border:1px solid var(--border-strong);
    color:var(--text);

    padding:12px 18px;
    border-radius:16px;

    font-size:12.5px;
    font-weight:800;
    text-align:center;

    box-shadow:0 12px 34px rgba(0,0,0,.30),0 0 0 3px var(--accent-glow);

    transition:.28s;
    z-index:5000;
}

#toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* =========================================================
   SCROLLBAR
   ========================================================= */

*{
    scrollbar-width:thin;
    scrollbar-color:var(--border-strong) transparent;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    header{
        min-height:calc(66px + env(safe-area-inset-top,0px));
        padding-left:10px;
        padding-right:10px;
    }

    .container{
        padding:15px 9px 35px;
    }

    .user-card{
        padding:11px;
        gap:10px;
        border-radius:18px;
    }

    .avatar{
        width:49px;
        height:49px;
    }

    .user-actions{
        gap:5px;
    }

    .action-btn{
        padding:8px 10px;
        font-size:10.5px;
    }
}

@media(max-width:360px){
    .user-card{flex-wrap:wrap;}
    .user-actions{width:100%;justify-content:flex-end;}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}

</style>

</head>

<body>

<a
    href="home.html"
    class="back-btn"
    aria-label="Back"
>
    ←
</a>

</div>

</span>

</div>

    id="sentSection"
