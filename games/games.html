<title>VitalStar Games</title><style>

/* =========================================================
   VITALSTAR GAMES — ADVANCED DESIGN
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#030611;
    --panel:rgba(13,19,35,.82);
    --panel2:rgba(18,25,46,.9);
    --border:rgba(124,92,255,.22);
    --purple:#7c5cff;
    --blue:#277cff;
    --cyan:#31d8ff;
    --gold:#ffd84d;
    --text:#fff;
    --muted:#8994aa;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(124,92,255,.22),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(39,124,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 80%,
            rgba(49,216,255,.08),
            transparent 30%
        ),
        #030611;
}

/* Animated background grid */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 90%
    );
}

/* Floating light */

body::after{
    content:"";
    position:fixed;
    width:380px;
    height:380px;
    border-radius:50%;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    z-index:-1;
    pointer-events:none;

    background:radial-gradient(
        circle,
        rgba(124,92,255,.08),
        transparent 70%
    );

    animation:ambient 7s ease-in-out infinite alternate;
}

@keyframes ambient{
    from{
        transform:translate(-52%,-48%) scale(.9);
    }
    to{
        transform:translate(-48%,-52%) scale(1.12);
    }
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    position:sticky;
    top:0;
    z-index:50;

    background:rgba(5,9,20,.82);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(124,92,255,.18);
    padding:12px;
}

.header-inner{
    max-width:1050px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:18px;
    font-weight:900;
    letter-spacing:.3px;
}

.logo span{
    color:var(--purple);
}

.header-right{
    display:flex;
    align-items:center;
    gap:7px;
}

.coins{
    background:rgba(255,216,77,.08);
    border:1px solid rgba(255,216,77,.2);
    padding:7px 10px;
    border-radius:20px;
    color:var(--gold);
    font-weight:bold;
    font-size:12px;
}

.premium-mini{
    background:linear-gradient(
        135deg,
        #7c5cff,
        #a14cff
    );

    color:#fff;
    border:0;

    padding:8px 10px;
    border-radius:9px;

    font-weight:bold;
    font-size:11px;

    box-shadow:
        0 7px 20px rgba(124,92,255,.22);
}

.container{
    max-width:1050px;
    margin:auto;
    padding:15px 12px 50px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(27,35,72,.92),
            rgba(40,19,75,.9)
        );

    border:1px solid rgba(124,92,255,.3);
    border-radius:24px;

    padding:24px 18px;
    margin-bottom:18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.28);
}

.hero::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    right:-70px;
    top:-90px;

    border-radius:50%;

    background:rgba(124,92,255,.2);
    filter:blur(5px);
}

.hero::after{
    content:"✦";
    position:absolute;
    right:28px;
    bottom:18px;

    color:rgba(255,255,255,.15);
    font-size:60px;
}

.hero h1{
    position:relative;
    z-index:1;

    font-size:27px;
    margin-bottom:7px;

    background:linear-gradient(
        90deg,
        #fff,
        #bdb0ff,
        #6edcff
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    position:relative;
    z-index:1;

    color:#b6bed0;
    line-height:1.55;
    font-size:13px;
    max-width:650px;
}

.hero-bottom{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    margin-top:17px;
    flex-wrap:wrap;
}

.premium-button{
    border:0;

    background:linear-gradient(
        135deg,
        #7c5cff,
        #426fff
    );

    color:#fff;

    padding:10px 14px;
    border-radius:11px;

    font-weight:bold;
    font-size:12px;

    box-shadow:
        0 8px 25px rgba(70,85,255,.25);
}


/* =========================================================
   SEARCH
========================================================= */

.search{
    width:100%;
    margin:3px 0 12px;

    padding:13px;

    border-radius:12px;

    border:1px solid rgba(124,92,255,.2);

    background:rgba(10,15,28,.82);

    color:#fff;

    outline:none;

    transition:.2s;
}

.search:focus{
    border-color:#7c5cff;

    box-shadow:
        0 0 0 3px rgba(124,92,255,.08);
}


/* =========================================================
   TABS
========================================================= */

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:16px;

    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex:none;

    padding:8px 13px;

    border-radius:20px;

    border:1px solid rgba(124,92,255,.18);

    background:rgba(13,18,32,.82);

    color:#b7bfd0;

    cursor:pointer;

    font-size:11px;

    transition:.2s;
}

.tab:hover{
    border-color:#6654c9;
}

.tab.active{
    background:linear-gradient(
        135deg,
        #7c5cff,
        #4e7cff
    );

    color:#fff;
    border-color:transparent;

    box-shadow:
        0 6px 20px rgba(90,80,255,.2);
}


/* =========================================================
   SECTIONS
========================================================= */

.section{
    margin-top:22px;
}

.section-title{
    font-size:19px;
    margin-bottom:11px;
}


/* =========================================================
   GAMES
========================================================= */

.games{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.game{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(18,25,46,.94),
            rgba(8,12,23,.94)
        );

    border:1px solid rgba(124,92,255,.16);

    border-radius:17px;

    padding:14px;

    min-height:205px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
}

.game::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-40px;
    top:-40px;

    border-radius:50%;

    background:rgba(124,92,255,.1);
}

.game:hover{
    transform:translateY(-3px);

    border-color:rgba(124,92,255,.55);

    box-shadow:
        0 15px 35px rgba(0,0,0,.3);
}

.game-icon{
    position:relative;
    z-index:1;

    font-size:36px;
    margin-bottom:8px;
}

.game h3{
    position:relative;
    z-index:1;

    font-size:14px;
    margin-bottom:5px;
}

.game p{
    position:relative;
    z-index:1;

    color:#929caf;
    font-size:11px;
    line-height:1.45;
    flex:1;
}

.badges{
    position:relative;
    z-index:1;

    display:flex;
    gap:4px;
    flex-wrap:wrap;
    margin-bottom:7px;
}

.badge{
    font-size:8px;
    font-weight:bold;

    padding:3px 5px;

    border-radius:6px;

    background:#172b23;
    color:#72e5a2;
}

.badge.premium{
    background:#29213f;
    color:#d5c6ff;
}

.play{
    position:relative;
    z-index:1;

    width:100%;

    padding:9px;

    margin-top:10px;

    border:0;
    border-radius:9px;

    background:linear-gradient(
        135deg,
        #2367e8,
        #635bff
    );

    color:#fff;

    font-weight:bold;
    font-size:11px;

    transition:.2s;
}

.play:hover{
    filter:brightness(1.15);
    transform:translateY(-1px);
}

.locked{
    opacity:.78;
}

.lock{
    position:absolute;

    right:8px;
    top:8px;

    font-size:8px;
    font-weight:bold;

    padding:4px 5px;

    border-radius:6px;

    background:#29213f;
    color:#d7caff;
}

.empty,
.loading{
    text-align:center;
    padding:25px;
    color:#8e97aa;
    font-size:13px;
}

.empty{
    display:none;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-card{
    background:
        linear-gradient(
            145deg,
            rgba(17,22,38,.95),
            rgba(9,13,24,.95)
        );

    border:1px solid rgba(124,92,255,.18);
    border-radius:19px;
    padding:16px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.2);
}

.profile-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.game-avatar{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;

    border:2px solid #7c5cff;

    box-shadow:
        0 0 20px rgba(124,92,255,.2);
}

.profile-name{
    font-size:18px;
    font-weight:bold;
}

.profile-username{
    color:#8993a8;
    font-size:12px;
    margin-top:3px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.stat{
    background:rgba(5,9,18,.7);
    border:1px solid #252d40;
    border-radius:10px;
    padding:10px 5px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:16px;
    color:#fff;
}

.stat span{
    color:#7f899e;
    font-size:9px;
    display:block;
    margin-top:3px;
}


/* =========================================================
   LEADERBOARD
========================================================= */

.leaderboard-box{
    background:rgba(17,22,38,.9);
    border:1px solid rgba(124,92,255,.16);
    border-radius:17px;
    overflow:hidden;
}

.leaderboard-player{
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px;
    border-bottom:1px solid #202738;
    cursor:pointer;
}

.leaderboard-player:last-child{
    border-bottom:0;
}

.leaderboard-player:hover{
    background:#171d2a;
}

.leader-rank{
    width:30px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.leader-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

.leader-info{
    flex:1;
    min-width:0;
}

.leader-info strong{
    display:block;
    font-size:12px;
}

.leader-info small{
    color:#7e889c;
    font-size:9px;
}

.leader-stats{
    text-align:right;
}

.leader-stats strong{
    display:block;
    color:#72e5a2;
    font-size:12px;
}

.leader-stats small{
    color:#7e889c;
    font-size:8px;
}

.leader-rating{
    color:#ffd84d;
    font-size:10px;
    min-width:55px;
    text-align:right;
}


/* =========================================================
   PLAYER SEARCH
========================================================= */

.player-search{
    width:100%;

    padding:11px;

    background:#0b0f19;

    border:1px solid #30394e;

    border-radius:10px;

    color:#fff;

    outline:none;

    margin-bottom:8px;
}

#playerSearchResults{
    background:#111622;
    border-radius:12px;
    overflow:hidden;
}


/* =========================================================
   ACHIEVEMENTS
========================================================= */

.achievements{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.achievement{
    display:flex;
    align-items:center;
    gap:9px;

    padding:10px;

    border-radius:11px;

    border:1px solid #252d40;

    background:#111622;
}

.achievement.locked{
    opacity:.4;
}

.achievement-icon{
    font-size:24px;
}

.achievement strong{
    display:block;
    font-size:11px;
}

.achievement small{
    display:block;
    color:#818b9e;
    font-size:9px;
    margin-top:3px;
}


/* =========================================================
   HISTORY
========================================================= */

.history{
    background:#111622;
    border:1px solid #252d40;
    border-radius:15px;
    overflow:hidden;
}

.game-history-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-bottom:1px solid #202738;
}

.game-history-item:last-child{
    border-bottom:0;
}

.history-icon{
    font-size:24px;
}

.history-info{
    flex:1;
}

.history-info strong{
    display:block;
    font-size:12px;
}

.history-info small{
    color:#7f899d;
    font-size:9px;
}

.history-result{
    font-size:10px;
    font-weight:bold;
}

.history-result.win{
    color:#65e69a;
}

.history-result.loss{
    color:#ff7070;
}

.history-result.draw{
    color:#ffd84d;
}


/* =========================================================
   MODALS
========================================================= */

.modal{
    display:none;

    position:fixed;
    inset:0;

    z-index:100;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    align-items:center;
    justify-content:center;

    padding:15px;
}

.modal-box{
    width:100%;
    max-width:390px;
    max-height:90vh;
    overflow:auto;

    background:
        linear-gradient(
            145deg,
            #151c31,
            #0a0e19
        );

    border:1px solid rgba(124,92,255,.35);

    border-radius:20px;

    padding:20px;

    text-align:center;

    box-shadow:
        0 25px 80px rgba(0,0,0,.6);
}

.modal-icon{
    font-size:43px;
    margin-bottom:8px;
}

.modal-box h2{
    margin-bottom:7px;
}

.modal-box p{
    color:#aab2c4;
    font-size:13px;
    line-height:1.5;
    margin-bottom:12px;
}

.modal-box button{
    width:100%;
    padding:11px;
    margin-top:7px;

    border:0;
    border-radius:10px;

    background:linear-gradient(
        135deg,
        #7c5cff,
        #426fff
    );

    color:#fff;
    font-weight:bold;
}

.modal-box .close{
    background:#252d40;
}


/* =========================================================
   PLAYER PROFILE MODAL
========================================================= */

.player-profile-avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    object-fit:cover;

    border:2px solid #7c5cff;
    margin-bottom:8px;
}

.player-profile-username{
    color:#8993a8;
    font-size:11px;
    margin-bottom:15px;
}

.profile-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.profile-stat{
    background:#0b0f19;
    border:1px solid #252d40;
    border-radius:10px;
    padding:10px;
}

.profile-stat strong{
    display:block;
    font-size:16px;
}

.profile-stat small{
    color:#7f899e;
    font-size:9px;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.achievement-notification{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    z-index:300;

    background:#171d2c;

    border:1px solid #7c5cff;

    border-radius:13px;

    padding:12px 15px;

    display:flex;
    align-items:center;
    gap:10px;

    box-shadow:0 10px 30px #000;

    width:calc(100% - 30px);
    max-width:350px;
}


/* =========================================================
   SOUND CONTROL
========================================================= */

.sound-control{
    position:fixed;

    right:14px;
    bottom:14px;

    z-index:200;

    width:43px;
    height:43px;

    border-radius:50%;

    border:1px solid rgba(124,92,255,.4);

    background:rgba(10,15,29,.9);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.4);

    backdrop-filter:blur(12px);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .games{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:430px){

    .container{
        padding-left:9px;
        padding-right:9px;
    }

    .games{
        gap:8px;
    }

    .game{
        padding:11px;
        min-height:190px;
    }

    .game-icon{
        font-size:31px;
    }

    .stats{
        grid-template-columns:repeat(4,1fr);
    }

    .stat strong{
        font-size:14px;
    }

    .achievements{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:22px;
    }

}

    type="module"

/* =========================================================
   VITALSTAR GAMES — BACKGROUND SOUND
========================================================= */

const bgSound =
    document.getElementById("gamesBackgroundSound");

const soundControl =
    document.getElementById("soundControl");

let soundEnabled = false;


/*
   Browsers block automatic audio playback.

   Start sound after the first user interaction.
*/

async function startGamesSound(){

    if(soundEnabled) return;

    try{

        bgSound.volume = 0.18;

        await bgSound.play();

        soundEnabled = true;

        soundControl.textContent = "🔊";

    }catch(error){

        soundEnabled = false;

    }

}


/* First interaction */

document.addEventListener(
    "pointerdown",
    startGamesSound,
    {
        once:true
    }
);


/* Sound button */

soundControl.addEventListener(
    "click",
    async function(){

        if(!soundEnabled){

            try{

                bgSound.volume = 0.18;

                await bgSound.play();

                soundEnabled = true;

                soundControl.textContent = "🔊";

            }catch(error){

                console.log(
                    "Background sound could not start."
                );

            }

        }else{

            bgSound.pause();

            soundEnabled = false;

            soundControl.textContent = "🔇";

        }

    }
);

</script></body></html>
