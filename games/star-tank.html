<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumen Lite</title>
<style>
:root{--bg:#121316;--panel:#1b1d22;--line:#2c3038;--text:#eceef2;--muted:#8f97a6;--accent:#ffb340;--ink:#1b1305;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}
button{font:inherit;color:inherit;background:#252931;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px;cursor:pointer}
button:hover{border-color:#4a515e}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary,button.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar" "stage" "dock";padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#bar{grid-area:bar;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar .sp{flex:1}
.brand{font-weight:800;margin-right:6px}.brand b{color:var(--accent)}
#stage{grid-area:stage;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-width:0;min-height:0;overflow:hidden}
#cv{max-width:100%;max-height:100%;box-shadow:0 8px 30px rgba(0,0,0,.5);background:repeating-conic-gradient(#2a2d34 0 25%,#23262c 0 50%) 0 0/16px 16px}
#empty{position:absolute;inset:14px;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
#empty h2{margin:0;color:var(--text);font-size:20px}
.empty #empty{display:flex}.empty #cv{display:none}
.drag #stage{outline:2px dashed var(--accent);outline-offset:-8px}
#dock{grid-area:dock;min-width:0;background:var(--panel);border-top:1px solid var(--line)}
.empty #dock{opacity:.4;pointer-events:none}
#ctl{display:none;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line)}
#ctl.show{display:flex}
#cName{min-width:84px}
#cRange{flex:1;min-width:0;accent-color:var(--accent)}
#cVal{min-width:36px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
#items[hidden]{display:none}
#items{border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;padding:10px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#3a404b transparent}
.row button{flex:none;white-space:nowrap}
.gi{display:flex;flex:none;gap:6px}.gi[hidden]{display:none}
#sets button{font-weight:600}#sets button.open{border-color:var(--accent);color:var(--accent)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:20px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app" class="empty">
 <header id="bar">
  <span class="brand">Lumen <b>Lite</b></span>
  <button id="bOpen">Open</button>
  <button id="bUndo">Undo</button><button id="bRedo">Redo</button>
  <button id="bBefore" title="Hold to see the original">Before</button>
  <button id="bReset">Reset</button>
  <span class="sp"></span>
  <button id="bPng" class="primary">Save PNG</button><button id="bJpg">Save JPG</button>
 </header>
 <main id="stage">
  <canvas id="cv"></canvas>
  <div id="empty"><h2>Open a photo to start</h2><p>Drop an image here, paste one, or pick a file.</p><div><button class="primary" id="bOpen2">Open photo</button> <button id="bSample">Use a sample</button></div></div>
 </main>
 <footer id="dock">
  <div id="ctl"><b id="cName"></b><input type="range" id="cRange" aria-label="Value"><output id="cVal">0</output><button id="cReset">Reset</button></div>
  <div id="items" class="row" role="toolbar" aria-label="Tools in this set"></div>
  <div id="sets" class="row" role="toolbar" aria-label="Tool sets"></div>
 </footer>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;};
const SL=[['br','Brightness',-100,100],['ct','Contrast',-100,100],['sat','Saturation',-100,100],['warm','Warmth',-100,100],['blur','Blur',0,20],['sepia','Sepia',0,100]];
const zero=()=>({br:0,ct:0,sat:0,warm:0,blur:0,sepia:0});
const PRE={Original:{},Vivid:{ct:15,sat:35},Warm:{warm:35,sat:10},Cool:{warm:-35,sat:5},'Black and white':{sat:-100,ct:15},Sepia:{sepia:80,ct:8},Faded:{ct:-15,br:8,sat:-20},Dramatic:{ct:40,sat:-15,br:-8}};
const CROPS=[['Square 1:1',1],['Photo 4:3',4/3],['Photo 3:2',3/2],['Wide 16:9',16/9],['Story 9:16',9/16],['Portrait 3:4',3/4]];
let st={src:null,adj:zero()},hist=[],fut=[],prev=null,prevOf=null,before=false,raf=0,tt=0;

/* ---- image processing: same function for preview and export ---- */
function process(src,a){
 const w=src.width,h=src.height,o=mk(w,h),c=o.getContext('2d',{willReadFrequently:true});
 if(a.blur>0){const r=a.blur*w/1000;
  if('filter' in c){c.filter='blur('+r+'px)';c.drawImage(src,0,0);c.filter='none';}
  else{const f=Math.max(1,r*1.5),t=mk(w/f,h/f);t.getContext('2d').drawImage(src,0,0,t.width,t.height);c.imageSmoothingQuality='high';c.drawImage(t,0,0,w,h);}
 }else c.drawImage(src,0,0);
 if(a.br||a.ct||a.sat||a.warm||a.sepia){
  const id=c.getImageData(0,0,w,h),d=id.data,b=a.br*1.6-128,f=a.ct>=0?1+a.ct/50:1+a.ct/100,s=1+a.sat/100,wm=a.warm*.5,sp=a.sepia/100;
  for(let i=0;i<d.length;i+=4){
   let r=(d[i]+b)*f+128+wm,g=(d[i+1]+b)*f+128,l=(d[i+2]+b)*f+128-wm;
   const y=.299*r+.587*g+.114*l;r=y+(r-y)*s;g=y+(g-y)*s;l=y+(l-y)*s;
   if(sp){const x1=.393*r+.769*g+.189*l,y1=.349*r+.686*g+.168*l,z1=.272*r+.534*g+.131*l;r+=(x1-r)*sp;g+=(y1-g)*sp;l+=(z1-l)*sp;}
   d[i]=r;d[i+1]=g;d[i+2]=l;
  }
  c.putImageData(id,0,0);
 }
 return o;
}

/* ---- drawing (preview uses a smaller copy so sliders stay smooth) ---- */
function getPrev(){
 if(prevOf!==st.src){const s=st.src,k=Math.min(1,1400/Math.max(s.width,s.height));prev=mk(s.width*k,s.height*k);prev.getContext('2d').drawImage(s,0,0,prev.width,prev.height);prevOf=s;}
 return prev;
}
function render(){if(!raf)raf=requestAnimationFrame(draw);}
function draw(){
 raf=0;if(!st.src)return;
 const p=getPrev(),o=before?p:process(p,st.adj),cv=$('#cv');
 cv.width=o.width;cv.height=o.height;cv.getContext('2d').drawImage(o,0,0);
}

/* ---- history ---- */
const snap=()=>({src:st.src,adj:{...st.adj}});
function push(){hist.push(snap());if(hist.length>50)hist.shift();fut=[];btns();}
function undo(){if(!hist.length)return;fut.push(snap());st=hist.pop();sync();}
function redo(){if(!fut.length)return;hist.push(snap());st=fut.pop();sync();}
function btns(){$('#bUndo').disabled=!hist.length;$('#bRedo').disabled=!fut.length;}
function sync(){syncSliders();btns();render();}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---- tools: one scrolling row; sliders show above it, everything else acts at once ---- */
const strip=$('#items'),sets=$('#sets'),rng=$('#cRange');let cur=null,gest=false;
function tool(label,fn,k,to){const b=document.createElement('button');b.textContent=label;b.onclick=fn;if(k)b.dataset.k=k;(to||strip).append(b);}
const sep=()=>strip.append(document.createElement('i'));
function syncSliders(){if(!cur)return;rng.value=st.adj[cur];$('#cVal').textContent=st.adj[cur];}
function showSlider(k){
 cur=k;const d=SL.find(x=>x[0]===k);$('#cName').textContent=d[1];rng.min=d[2];rng.max=d[3];$('#ctl').classList.add('show');
 strip.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));syncSliders();
}
rng.addEventListener('input',()=>{if(!st.src||!cur)return;if(!gest){push();gest=true;}st.adj[cur]=+rng.value;$('#cVal').textContent=rng.value;render();});
rng.addEventListener('change',()=>{gest=false;});
$('#cReset').onclick=()=>{if(!st.src||!cur)return;push();st.adj[cur]=0;syncSliders();render();};
[strip,sets].forEach(r=>r.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){r.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false}));
function xf(fn){if(!st.src)return;push();st.src=fn(st.src);render();}
const rot=dir=>s=>{const o=mk(s.height,s.width),g=o.getContext('2d');g.translate(o.width/2,o.height/2);g.rotate(dir*Math.PI/2);g.drawImage(s,-s.width/2,-s.height/2);return o;};
const flip=hz=>s=>{const o=mk(s.width,s.height),g=o.getContext('2d');g.translate(hz?s.width:0,hz?0:s.height);g.scale(hz?-1:1,hz?1:-1);g.drawImage(s,0,0);return o;};
const crop=r=>s=>{const w=Math.min(s.width,s.height*r),h=w/r,o=mk(w,h);o.getContext('2d').drawImage(s,(s.width-w)/2,(s.height-h)/2,w,h,0,0,o.width,o.height);return o;};
const groups=[];
function group(name,build,on){
 const t=document.createElement('button'),box=document.createElement('span');box.className='gi';
 const g={open:false,set(o){g.open=o;box.hidden=!o;t.setAttribute('aria-expanded',String(o));t.textContent=name+(o?' \u25BE':' \u25B8');t.classList.toggle('open',o);if(on)on(o);strip.hidden=!groups.some(x=>x.open);}};
 t.onclick=()=>{const o=!g.open;groups.forEach(x=>x.set(false));g.set(o);};
 build(box);sets.append(t);strip.append(box);groups.push(g);g.set(false);return g;
}
const sliderSet=(name,keys)=>group(name,box=>keys.forEach(k=>tool(SL.find(x=>x[0]===k)[1],()=>showSlider(k),k,box)),o=>{if(o)showSlider(keys[0]);else $('#ctl').classList.remove('show');});
sliderSet('Light',['br','ct']);
sliderSet('Color',['sat','warm']);
sliderSet('Effects',['blur','sepia']);
group('Filters',box=>Object.keys(PRE).forEach(n=>tool(n,()=>{if(!st.src)return;push();st.adj=Object.assign(zero(),PRE[n]);syncSliders();render();},null,box)));
group('Rotate and flip',box=>{tool('Rotate left',()=>xf(rot(-1)),null,box);tool('Rotate right',()=>xf(rot(1)),null,box);tool('Flip H',()=>xf(flip(true)),null,box);tool('Flip V',()=>xf(flip(false)),null,box);});
group('Crop',box=>CROPS.forEach(([n,r])=>tool(n,()=>xf(crop(r)),null,box)));
groups[0].set(true);

/* ---- open, save ---- */
function setImg(c){st={src:c,adj:zero()};hist=[];fut=[];prevOf=null;$('#app').classList.remove('empty');syncSliders();btns();render();}
function load(f){
 if(!f||!f.type.startsWith('image/')){toast('Choose an image file');return;}
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const k=Math.min(1,3000/Math.max(im.naturalWidth,im.naturalHeight)),c=mk(im.naturalWidth*k,im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);setImg(c);};
 im.onerror=()=>{URL.revokeObjectURL(u);toast('Could not read that image');};im.src=u;
}
function sample(){
 const w=1400,h=900,c=mk(w,h),g=c.getContext('2d'),s=g.createLinearGradient(0,0,0,h);
 s.addColorStop(0,'#1b2a52');s.addColorStop(.6,'#e5876a');s.addColorStop(1,'#ffd08a');g.fillStyle=s;g.fillRect(0,0,w,h);
 g.fillStyle='#fff3c4';g.beginPath();g.arc(940,470,110,0,7);g.fill();
 g.fillStyle='#3a2450';g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=10)g.lineTo(x,640+Math.sin(x*.006)*70+Math.sin(x*.017)*25);g.lineTo(w,h);g.fill();
 setImg(c);
}
function save(type){
 if(!st.src)return;let c=process(st.src,st.adj);
 if(type==='image/jpeg'){const j=mk(c.width,c.height),g=j.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,j.width,j.height);g.drawImage(c,0,0);c=j;}
 c.toBlob(b=>{
  if(!b){toast('Export failed');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lumen-edit.'+(type==='image/png'?'png':'jpg');
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Saved');
 },type,.92);
}

/* ---- wiring ---- */
const pick=()=>$('#file').click();
$('#bOpen').onclick=pick;$('#bOpen2').onclick=pick;$('#bSample').onclick=sample;
$('#file').onchange=e=>{load(e.target.files[0]);e.target.value='';};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#bReset').onclick=()=>{if(!st.src)return;push();st.adj=zero();syncSliders();render();};
$('#bPng').onclick=()=>save('image/png');$('#bJpg').onclick=()=>save('image/jpeg');
const bb=$('#bBefore');
bb.addEventListener('pointerdown',()=>{before=true;render();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bb.addEventListener(ev,()=>{if(before){before=false;render();}}));
const stage=$('#stage');
['dragenter','dragover'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();$('#app').classList.add('drag');}));
['dragleave','drop'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();$('#app').classList.remove('drag');}));
stage.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
window.addEventListener('paste',e=>{const it=[...(e.clipboardData?e.clipboardData.items:[])].find(i=>i.type.startsWith('image/'));if(it)load(it.getAsFile());});
window.addEventListener('keydown',e=>{
 if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
 if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();}else if(k==='y'){e.preventDefault();redo();}
});
window.addEventListener('resize',render);
btns();
</script>
</body>
</html>
