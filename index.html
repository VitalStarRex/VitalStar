<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VitalStar Preview</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#030019;
    color:white;
    overflow-x:hidden;
}


/* =========================
HERO
========================= */

.hero{
    position:relative;
    width:100%;
    min-height:680px;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 80% 30%,
        #9b299f,
        #351060 40%,
        #08002d 75%,
        #020018
    );
}


/* STARS */

.stars{
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(
        circle,
        white 1px,
        transparent 2px
    ),
    radial-gradient(
        circle,
        #55ddff 1px,
        transparent 2px
    );

    background-size:
    70px 70px,
    120px 120px;

    animation:stars 18s linear infinite;
    opacity:.7;
}

@keyframes stars{

    to{
        background-position:
        150px 300px,
        -150px 250px;
    }
}


/* =========================
CONTENT
========================= */

.content{
    position:relative;
    z-index:20;

    width:92%;
    max-width:1100px;

    margin:auto;
    padding-top:55px;
}

.logo{
    font-size:64px;
    font-weight:900;
    letter-spacing:-4px;

    text-shadow:
    0 0 15px #00d9ff,
    0 0 30px #8e27ff;
}

.logo span{
    color:#ffd000;
}

.tagline{
    width:55%;

    margin-top:10px;

    font-size:42px;
    line-height:1.05;
    font-weight:900;
}

.tagline span{
    background:
    linear-gradient(
        90deg,
        #ff42ca,
        #00dfff,
        #ffd000
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.description{
    width:45%;
    max-width:500px;

    margin-top:18px;

    color:#eee;

    font-size:16px;
    line-height:1.5;
}


/* =========================
BUTTONS
========================= */

.buttons{
    display:flex;
    gap:14px;

    margin-top:25px;
}

.btn{
    padding:14px 25px;

    border-radius:40px;

    font-weight:bold;
    color:white;

    display:inline-block;
}

.register{
    background:
    linear-gradient(
        90deg,
        #ff4e91,
        #a82cff
    );

    box-shadow:
    0 0 20px #ff28c8;
}

.login{
    background:#070321;

    border:2px solid #ffd000;

    box-shadow:
    0 0 15px #ffd000;
}


/* =========================
RAINBOW
========================= */

.rainbow{
    position:absolute;

    right:5%;
    top:25px;

    width:230px;
    height:120px;

    border-radius:
    230px 230px 0 0;

    background:
    radial-gradient(
        ellipse at center bottom,

        transparent 0 42%,

        #ff3030 43% 48%,
        #ff8a00 49% 54%,
        #ffe600 55% 60%,
        #39e75f 61% 66%,
        #20c9ff 67% 72%,
        #635bff 73% 78%,
        #b53cff 79% 84%,

        transparent 85%
    );

    filter:
    drop-shadow(0 0 12px #ff43ca)
    drop-shadow(0 0 20px #00eaff);

    z-index:6;
}


/* =========================
POOL
========================= */

.pool{
    position:absolute;

    right:-3%;
    bottom:0;

    width:56%;
    max-width:700px;
    height:330px;

    border-radius:
    50% 50% 0 0;

    overflow:hidden;

    background:
    radial-gradient(
        ellipse at 50% 20%,
        #70ffff,
        #0794e0 45%,
        #031b69
    );

    box-shadow:
    inset 0 15px 35px
    rgba(255,255,255,.35),

    0 -10px 50px
    #008cff;

    z-index:5;
}


/* WATER WAVES */

.wave{
    position:absolute;

    left:-10%;

    width:120%;
    height:35px;

    border-top:
    3px solid
    rgba(255,255,255,.35);

    border-radius:50%;

    animation:
    wave 4s ease-in-out infinite;
}

.w1{
    top:60px;
}

.w2{
    top:150px;
    animation-delay:1s;
}

.w3{
    top:245px;
    animation-delay:2s;
}

@keyframes wave{

    50%{
        transform:translateX(25px);
    }
}


/* =========================
EMOJI FISH
🐠 🐳 🐟
========================= */

.emoji-fish{
    position:absolute;

    left:-100px;

    font-family:
    "Apple Color Emoji",
    "Segoe UI Emoji",
    "Noto Color Emoji",
    sans-serif;

    font-size:45px;

    white-space:nowrap;

    animation:
    fishSwim 8s linear infinite;

    z-index:15;
}


/* MANY FISH */

.fish1{
    top:25px;
    animation-duration:8s;
}

.fish2{
    top:65px;
    animation-duration:10s;
    animation-delay:1s;
}

.fish3{
    top:105px;
    animation-duration:7s;
    animation-delay:2s;
}

.fish4{
    top:145px;
    animation-duration:11s;
    animation-delay:3s;
}

.fish5{
    top:185px;
    animation-duration:8s;
    animation-delay:4s;
}

.fish6{
    top:225px;
    animation-duration:9s;
    animation-delay:5s;
}

.fish7{
    top:75px;
    animation-duration:12s;
    animation-delay:6s;
}

.fish8{
    top:160px;
    animation-duration:9s;
    animation-delay:7s;
}

@keyframes fishSwim{

    0%{
        left:-110px;
        transform:
        translateY(0)
        scale(.8);
    }

    25%{
        transform:
        translateY(-15px)
        scale(1);
    }

    50%{
        transform:
        translateY(12px)
        scale(1);
    }

    75%{
        transform:
        translateY(-10px)
        scale(1);
    }

    100%{
        left:110%;
        transform:
        translateY(10px)
        scale(.8);
    }
}


/* =========================
BUTTERFLIES
========================= */

.butterfly{
    position:absolute;

    font-size:32px;

    z-index:30;

    animation:
    fly 7s ease-in-out infinite;
}

.b1{
    left:5%;
    top:30%;
}

.b2{
    right:4%;
    top:55%;
    animation-delay:2s;
}

.b3{
    left:8%;
    top:70%;
    animation-delay:4s;
}

@keyframes fly{

    0%,100%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(40px,-40px);
    }

    50%{
        transform:translate(80px,10px);
    }

    75%{
        transform:translate(30px,45px);
    }
}


/* =========================
FLOWERS
========================= */

.flower{
    position:absolute;

    bottom:10px;

    font-size:35px;

    z-index:30;

    animation:
    flower 3s ease-in-out infinite;
}

.flower1{
    left:3%;
}

.flower2{
    left:25%;
    animation-delay:1s;
}

.flower3{
    right:3%;
    animation-delay:2s;
}

@keyframes flower{

    50%{
        transform:
        translateY(-8px)
        rotate(10deg);
    }
}


/* =========================
PREVIEW INFO
========================= */

.preview{
    position:absolute;

    left:30px;
    bottom:25px;

    z-index:25;

    padding:12px 18px;

    border-radius:20px;

    background:
    rgba(0,0,0,.35);

    backdrop-filter:blur(8px);

    font-size:13px;

    border:
    1px solid
    rgba(255,255,255,.2);
}


/* =========================
MOBILE
========================= */

@media(max-width:600px){

    .hero{
        min-height:520px;
        height:145vw;
        max-height:620px;
    }

    .content{
        width:94%;
        padding-top:25px;
    }

    .logo{
        font-size:38px;
        letter-spacing:-2px;
    }

    .tagline{
        width:58%;
        font-size:23px;
    }

    .description{
        width:53%;
        font-size:10px;
        line-height:1.35;
    }

    .buttons{
        gap:6px;
        margin-top:12px;
    }

    .btn{
        padding:8px 12px;
        font-size:10px;
    }

    .rainbow{
        width:105px;
        height:58px;
        right:4%;
        top:25px;
    }

    .pool{
        width:58%;
        height:205px;
        right:-3%;
    }

    .emoji-fish{
        font-size:29px;
    }

    .fish1{top:20px;}
    .fish2{top:45px;}
    .fish3{top:70px;}
    .fish4{top:95px;}
    .fish5{top:120px;}
    .fish6{top:145px;}
    .fish7{top:65px;}
    .fish8{top:170px;}

    .butterfly{
        font-size:20px;
    }

    .flower{
        font-size:22px;
    }

    .preview{
        left:10px;
        bottom:10px;
        font-size:9px;
        padding:7px 10px;
    }
}

</style>
</head>


<body>


<section class="hero">

    <div class="stars"></div>


    <!-- RAINBOW -->

    <!-- CONTENT -->

    <div class="content">

        <div class="buttons">

            <a href="login.html"

    <!-- POOL -->

    <div class="pool">

        <div class="wave w1"></div>

        <div class="emoji-fish fish6">

        </div>

        <div class="emoji-fish fish7">

        </div>

        <div class="emoji-fish fish8">

        </div>

    </div>


    <!-- BUTTERFLIES -->

    <div class="butterfly b1">

    </div>

    <div class="butterfly b2">

    </div>


    <!-- FLOWERS -->

    <div class="flower flower1">

    </div>


    <div class="preview">

    </div>

</section>


</body>
</html>
