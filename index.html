<!DOCTYPE html>
<html>
<head>
<title>VitalStar - Connect & Shine</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#000000,#1877f2,#8a2be2);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:450px;
    background:white;
    padding:40px 30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.logo{
    font-size:45px;
    font-weight:bold;
    color:#1877f2;
    margin-bottom:10px;
}

.logo span{
    color:#ffd700;
}

h2{
    font-size:28px;
    margin-bottom:15px;
    color:#111;
}

p{
    color:#555;
    font-size:16px;
    margin-bottom:30px;
    line-height:1.5;
}

.btn{
    display:block;
    text-decoration:none;
    padding:15px;
    margin:15px 0;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.register{
    background:#1877f2;
    color:white;
}

.login{
    background:black;
    color:#ffd700;
    border:2px solid #ffd700;
}

.btn:hover{
    transform:scale(1.05);
}

.features{
    margin-top:25px;
    color:#333;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Vital<span>Star</span>
</div>

<h2>Welcome to VitalStar</h2>

<p>
Connect with people, share your moments,
and discover a new way to build your social world.
Join VitalStar today and become part of the future.
</p>

<a href="register.html" class="btn register">
Create Account
</a>

<a href="login.html" class="btn login">
Login
</a>

<div class="features">
⭐ Share your stories<br>
⭐ Connect with friends<br>
⭐ Build your community
</div>

</div>

</body>
</html>
