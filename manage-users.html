<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Users</title><style>
body{font-family:Arial;background:#f4f4f8;margin:0}header{background:#6a1b9a;color:#fff;padding:15px;text-align:center}
#users{max-width:900px;margin:15px auto;padding:10px}.user{background:#fff;border-radius:10px;padding:12px;margin:10px 0;display:flex;align-items:center;gap:12px;box-shadow:0 2px 5px rgba(0,0,0,.15)}
img{width:60px;height:60px;border-radius:50%;object-fit:cover}.info{flex:1}.badge{background:#ffd700;padding:2px 8px;border-radius:12px;font-size:12px}.btn{padding:8px 12px;border:none;border-radius:6px;cursor:pointer}
.ban{background:#ff9800;color:#fff}.delete{background:#d32f2f;color:#fff}
</style></head><body><header><h2>Manage Users</h2></header><div id="users"></div><script type="module" src="manage-users.js"></script></body></html>
