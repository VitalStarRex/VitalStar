<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments - VitalStar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2ff;
}

header{
    background:#1877f2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    position:sticky;
    top:0;
}

#commentList{
    padding:15px;
    padding-bottom:230px;
}

.comment{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.comment-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.comment-avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
}

.comment-text{
    margin-top:10px;
    line-height:1.5;
    word-break:break-word;
}

.comment-photo{
    width:100%;
    max-width:450px;
    border-radius:12px;
    margin-top:10px;
    display:block;
}

.comment-box{
    position:fixed;
    bottom:65px;
    left:0;
    width:100%;
    background:white;
    padding:10px;
    box-shadow:0 -2px 10px rgba(0,0,0,.15);
z-index:9999;
}

.comment-box input[type="text"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:20px;
    margin-bottom:10px;
    outline:none;
}

.comment-box input[type="file"]{
    width:100%;
    margin-bottom:10px;
}

.comment-box button{
    width:100%;
    padding:12px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.comment-box button:hover{
    background:#145fd1;
}






.comment-box button:hover{
    background:#145fd1;
}

.comment-actions{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:10px;
}

.comment-actions button{
    background:none;
    border:none;
    color:#1877f2;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    width:auto;
    padding:0;
}

.comment-actions button:hover{
    background:none;
    text-decoration:underline;
}

</style>







</head>

<body>

<header>💬 Comments</header>

<div id="postContainer"></div>

<div id="commentList"></div>

<div class="comment-box">

<input
type="text"
id="commentText"
placeholder="Write a comment...">

<input
type="file"
id="commentImage"
accept="image/*">

<button onclick="sendComment()">
Send
</button>

</div>

<script type="module" src="comments.js"></script>


<script type="module" src="auth-guard.js"></script>

</body>
</html>
