<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2ff;
}

header{
    background:#1877f2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

#commentList{
    padding:15px;
}

.comment{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

.comment-box{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
    background:white;
    padding:10px;
}

.comment-box input{
    flex:1;
    padding:10px;
    border-radius:20px;
    border:1px solid #ccc;
}

.comment-box button{
    margin-left:10px;
    padding:10px 18px;
}
</style>

</head>

<body>

<header>💬 Comments</header>

<div id="commentList"></div>

<div class="comment-box">
    <input id="commentText" placeholder="Write a comment...">
    <button onclick="sendComment()">Send</button>
</div>

<script type="module" src="comments.js"></script>

</body>
</html>
