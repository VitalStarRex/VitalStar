<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Comments - VitalStar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2ff;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    background:#1877f2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:1001;
}

/* =========================================================
   POST
   ========================================================= */

#postContainer{
    padding:15px;
    padding-bottom:5px;
}

/* =========================================================
   COMMENTS
   ========================================================= */

#commentList{
    padding:15px;
    padding-bottom:230px;
}

.comment{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.comment-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.comment-avatar{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    overflow:hidden;
}

.comment-text{
    margin-top:10px;
    line-height:1.5;
    word-break:break-word;
}

.comment-photo{
    width:100%;
    max-width:450px;
    border-radius:12px;
    margin-top:10px;
    display:block;
}

/* =========================================================
   COMMENT ACTIONS
   ========================================================= */

.comment-actions{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:10px;
}

.comment-actions button{
    background:none;
    border:none;
    color:#1877f2;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    width:auto;
    padding:7px 4px;
}

.comment-actions button:hover{
    background:none;
    text-decoration:underline;
}

/* =========================================================
   COMMENTING INDICATOR
   ========================================================= */

#commentingIndicator{
    display:none;
    text-align:center;
    padding:9px 5px;
    color:#1877f2;
    font-size:14px;
    font-weight:500;
    animation:commentPulse 1.2s infinite;
}

@keyframes commentPulse{

    0%{
        opacity:.5;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:.5;
    }

}

/* =========================================================
   COMMENT BOX
   ========================================================= */

.comment-box{
    position:fixed;
    bottom:65px;
    left:0;
    width:100%;
    background:white;
    padding:10px;
    box-shadow:0 -2px 10px rgba(0,0,0,.15);
    z-index:9999;
}

.comment-box input[type="text"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:20px;
    margin-bottom:10px;
    outline:none;
}

.comment-box input[type="text"]:focus{
    border-color:#1877f2;
}

.comment-box input[type="file"]{
    width:100%;
    margin-bottom:10px;
}

.comment-box button{
    width:100%;
    padding:12px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.comment-box button:hover{
    background:#145fd1;
}

.comment-box button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#e5e5e5;
    border-top:1px solid #ccc;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -2px 8px rgba(0,0,0,.1);
    z-index:1000;
}

.bottom-nav a{
    text-decoration:none;
    color:#333;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:22px;
}

.bottom-nav small{
    font-size:12px;
}

.create-post-button{
    width:55px;
    height:55px;
    background:#1877f2;
    color:white !important;
    border-radius:50%;
    display:flex !important;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    font-size:30px !important;
    margin-top:-25px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<header>
    💬 Comments
</header>


<!-- =======================================================
     POST
======================================================== -->

<div id="postContainer"></div>


<!-- =======================================================
     COMMENTS
======================================================== -->

<div id="commentList"></div>


<!-- =======================================================
     COMMENT BOX
======================================================== -->

<div class="comment-box">


    <!-- COMMENTING INDICATOR -->

    <div id="commentingIndicator">
        💬 Posting comment...
    </div>


    <!-- TEXT -->

    <input
        type="text"
        id="commentText"
        placeholder="Write a comment..."
        autocomplete="off"
    >


    <!-- IMAGE -->

    <input
        type="file"
        id="commentImage"
        accept="image/*"
    >


    <!-- SEND -->

    <button
        type="button"
        id="sendCommentBtn"
        onclick="sendComment()"
    >
        Send
    </button>


</div>


<!-- =======================================================
     JAVASCRIPT
======================================================== -->

<script
    type="module"
    src="comments.js"
></script>

<script
    type="module"
    src="auth-guard.js"
></script>


<!-- =======================================================
     BOTTOM NAVIGATION
======================================================== -->

<div class="bottom-nav">


    <a href="home.html">

        <span>🏠</span>

        <small>
            Home
        </small>

    </a>


    <a href="users.html">

        <span>👥</span>

        <small>
            Friends
        </small>

    </a>


    <a
        href="create-post.html"
        class="create-post-button"
    >
        ➕
    </a>


    <a href="general-room.html">

        <span>💬</span>

        <small>
            Chat
        </small>

    </a>


    <a href="profile.html">

        <span>👤</span>

        <small>
            Profile
        </small>

    </a>


</div>


</body>

</html>
