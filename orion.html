<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Orion Pax — VitalStar AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #111827;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
}

.back-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: #f1f3f5;
    font-size: 20px;
    cursor: pointer;
}

.back-btn:active {
    transform: scale(.95);
}

.orion-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #111827;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: bold;
}

.header-info {
    flex: 1;
}

.header-info h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
}

.status {
    margin-top: 3px;
    font-size: 12px;
    color: #6b7280;
}

.status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #22c55e;
    border-radius: 50%;
    margin-right: 4px;
}

/* =========================================================
   MESSAGES
   ========================================================= */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 110px;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 600px;
    margin: 30px auto;
    text-align: center;
    color: #4b5563;
}

.welcome-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #111827;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 30px;
    font-weight: bold;
}

.welcome h2 {
    margin: 0 0 8px;
    color: #111827;
    font-size: 22px;
}

.welcome p {
    margin: 0;
    line-height: 1.5;
    font-size: 14px;
}

/* =========================================================
   MESSAGE ROW
   ========================================================= */

.message-row {
    display: flex;
    margin: 10px 0;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.orion {
    justify-content: flex-start;
}

.message {
    max-width: min(78%, 650px);
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
}

.message.user {
    background: #111827;
    color: #fff;
    border-bottom-right-radius: 5px;
}

.message.orion {
    background: #fff;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 5px;
}

.message.error {
    color: #b91c1c;
}

/* =========================================================
   TYPING INDICATOR
   ========================================================= */

.typing {
    display: none;
    margin: 10px 0;
}

.typing .message-row {
    margin: 0;
}

.typing-bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    border-bottom-left-radius: 5px;
    padding: 12px 15px;
}

.typing-bubble span {
    width: 7px;
    height: 7px;
    background: #6b7280;
    border-radius: 50%;
    animation: orionTyping 1.4s infinite ease-in-out;
}

.typing-bubble span:nth-child(1) {
    animation-delay: 0s;
}

.typing-bubble span:nth-child(2) {
    animation-delay: .2s;
}

.typing-bubble span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes orionTyping {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: .4;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }

}

/* =========================================================
   COMPOSER
   ========================================================= */

.composer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e5e7eb;
    padding: 10px 12px;
    z-index: 20;
}

.composer-inner {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

#messageInput {
    flex: 1;
    min-height: 44px;
    max-height: 130px;
    resize: none;
    border: 1px solid #d1d5db;
    border-radius: 22px;
    outline: none;
    padding: 12px 15px;
    font-family: inherit;
    font-size: 15px;
    background: #f9fafb;
}

#messageInput:focus {
    border-color: #6b7280;
    background: #fff;
}

#sendBtn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: #111827;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
}

#sendBtn:active {
    transform: scale(.95);
}

#sendBtn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.footer-note {
    text-align: center;
    font-size: 10px;
    color: #9ca3af;
    margin-top: 5px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .header {
        height: 60px;
    }

    .messages {
        padding-left: 10px;
        padding-right: 10px;
    }

    .message {
        max-width: 86%;
    }

    .welcome {
        margin-top: 45px;
        padding: 0 20px;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- =======================================================
     HEADER
     ======================================================= -->

<header class="header">

    <button
        class="back-btn"
        onclick="history.back()"
        aria-label="Go back"
    >
        ←
    </button>

    <div class="orion-avatar">
        O
    </div>

    <div class="header-info">

        <h1>Orion Pax</h1>

        <div class="status">

            <span class="status-dot"></span>

            VitalStar AI

        </div>

    </div>

</header>


<!-- =======================================================
     MESSAGES
     ======================================================= -->

<main
    class="messages"
    id="messages"
>

    <div class="welcome">

        <div class="welcome-avatar">
            O
        </div>

        <h2>
            Orion Pax
        </h2>

        <p>
            Text-based VitalStar AI.
            Ask a question to begin.
        </p>

    </div>


    <!-- ===================================================
         TYPING INDICATOR
         NOW INSIDE THE MESSAGE CONTAINER
         =================================================== -->

    <div
        class="typing"
        id="typing"
    >

        <div class="message-row orion">

            <div class="typing-bubble">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    </div>

</main>


<!-- =======================================================
     COMPOSER
     ======================================================= -->

<div class="composer">

    <div class="composer-inner">

        <textarea
            id="messageInput"
            placeholder="Message Orion Pax..."
            rows="1"
            autocomplete="off"
        ></textarea>

        <button
            id="sendBtn"
            type="button"
            aria-label="Send message"
        >
            ➤
        </button>

    </div>

    <div class="footer-note">
        Orion Pax is a text-only VitalStar AI.
    </div>

</div>

</div>


<script>

/* =========================================================
   ORION PAX — SUPABASE EDGE FUNCTION
   ========================================================= */

const ORION_API =
    "https://caolbkawexnilpsgrwyz.supabase.co/functions/v1/orion-pax";


/* =========================================================
   ELEMENTS
   ========================================================= */

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const typing =
    document.getElementById("typing");


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(text, sender, error = false) {

    const welcome =
        document.querySelector(".welcome");

    if (welcome) {
        welcome.remove();
    }

    const row =
        document.createElement("div");

    row.className =
        "message-row " + sender;


    const bubble =
        document.createElement("div");

    bubble.className =
        "message " + sender;


    if (error) {
        bubble.classList.add("error");
    }


    bubble.textContent =
        text;


    row.appendChild(bubble);

    /* Insert messages BEFORE typing indicator */

    messages.insertBefore(
        row,
        typing
    );


    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   TYPING INDICATOR
   ========================================================= */

function showTyping(show) {

    typing.style.display =
        show ? "block" : "none";


    if (show) {

        requestAnimationFrame(function() {

            messages.scrollTop =
                messages.scrollHeight;

        });

    }

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    const text =
        input.value.trim();


    if (
        !text ||
        sendBtn.disabled
    ) {
        return;
    }


    /* SHOW USER MESSAGE */

    addMessage(
        text,
        "user"
    );


    /* CLEAR INPUT */

    input.value = "";

    input.style.height =
        "44px";


    /* DISABLE INPUT */

    sendBtn.disabled =
        true;

    input.disabled =
        true;


    /* SHOW TYPING */

    showTyping(true);


    try {

        /* =================================================
           CALL SUPABASE
           ================================================= */

        const response =
            await fetch(
                ORION_API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );


        /* READ RESPONSE */

        const raw =
            await response.text();


        console.log(
            "Orion raw response:",
            raw
        );


        let data;


        try {

            data =
                JSON.parse(raw);

        } catch (parseError) {

            console.error(
                "Invalid JSON:",
                parseError
            );


            data = {
                error:
                    "Orion Pax returned an invalid response."
            };

        }


        /* HIDE TYPING */

        showTyping(false);


        /* SERVER ERROR */

        if (!response.ok) {

            console.error(
                "Orion Supabase error:",
                response.status,
                data
            );


            addMessage(
                data.error ||
                "Orion Pax could not respond.",
                "orion",
                true
            );


            return;
        }


        /* ORION ANSWER */

        if (
            data &&
            typeof data.answer === "string" &&
            data.answer.trim()
        ) {

            addMessage(
                data.answer.trim(),
                "orion"
            );

        } else {

            console.error(
                "Unexpected Orion response:",
                data
            );


            addMessage(
                "Orion Pax returned an empty response.",
                "orion",
                true
            );

        }


    } catch (error) {

        console.error(
            "Orion network error:",
            error
        );


        showTyping(false);


        addMessage(
            "Unable to connect to Orion Pax. " +
            "Please check your internet connection " +
            "and Supabase Edge Function.",
            "orion",
            true
        );


    } finally {

        /* RE-ENABLE INPUT */

        sendBtn.disabled =
            false;

        input.disabled =
            false;

        input.focus();

    }

}


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER TO SEND
   SHIFT + ENTER = NEW LINE
   ========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   AUTO RESIZE
   ========================================================= */

input.addEventListener(
    "input",
    function() {

        this.style.height =
            "44px";


        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) + "px";

    }
);


/* =========================================================
   INITIAL FOCUS
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        /* Make absolutely sure typing starts hidden */

        showTyping(false);

        input.focus();

    }
);

</script>

</body>
</html>
