<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orion Pax — VitalStar AI</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f5f7;
        color: #111827;
        height: 100vh;
        overflow: hidden;
    }

    .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* HEADER */
    .header {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        flex-shrink: 0;
    }

    .back-btn {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: #f1f3f5;
        font-size: 20px;
        cursor: pointer;
    }

    .orion-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #111827;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        font-weight: bold;
    }

    .header-info {
        flex: 1;
    }

    .header-info h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
    }

    .status {
        margin-top: 3px;
        font-size: 12px;
        color: #6b7280;
    }

    .status-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #22c55e;
        border-radius: 50%;
        margin-right: 4px;
    }

    /* CHAT */
    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 14px 110px;
    }

    .welcome {
        max-width: 600px;
        margin: 30px auto;
        text-align: center;
        color: #4b5563;
    }

    .welcome-avatar {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #111827;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        font-size: 30px;
        font-weight: bold;
    }

    .welcome h2 {
        margin: 0 0 8px;
        color: #111827;
        font-size: 22px;
    }

    .welcome p {
        margin: 0;
        line-height: 1.5;
        font-size: 14px;
    }

    .message-row {
        display: flex;
        margin: 10px 0;
    }

    .message-row.user {
        justify-content: flex-end;
    }

    .message-row.orion {
        justify-content: flex-start;
    }

    .message {
        max-width: min(78%, 650px);
        padding: 11px 14px;
        border-radius: 16px;
        font-size: 15px;
        line-height: 1.5;
        word-wrap: break-word;
        white-space: pre-wrap;
    }

    .message.user {
        background: #111827;
        color: #ffffff;
        border-bottom-right-radius: 5px;
    }

    .message.orion {
        background: #ffffff;
        color: #111827;
        border: 1px solid #e5e7eb;
        border-bottom-left-radius: 5px;
    }

    .typing {
        display: none;
        margin: 10px 0;
    }

    .typing .message {
        color: #6b7280;
    }

    /* INPUT AREA */
    .composer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.97);
        border-top: 1px solid #e5e7eb;
        padding: 10px 12px;
        z-index: 20;
    }

    .composer-inner {
        max-width: 900px;
        margin: auto;
        display: flex;
        gap: 8px;
        align-items: flex-end;
    }

    #messageInput {
        flex: 1;
        min-height: 44px;
        max-height: 130px;
        resize: none;
        border: 1px solid #d1d5db;
        border-radius: 22px;
        outline: none;
        padding: 12px 15px;
        font-family: inherit;
        font-size: 15px;
        background: #f9fafb;
    }

    #messageInput:focus {
        border-color: #6b7280;
        background: #ffffff;
    }

    #sendBtn {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: #111827;
        color: #ffffff;
        font-size: 18px;
        cursor: pointer;
        flex-shrink: 0;
    }

    #sendBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .footer-note {
        text-align: center;
        font-size: 10px;
        color: #9ca3af;
        margin-top: 5px;
    }

    @media (max-width: 600px) {
        .header {
            height: 60px;
        }

        .messages {
            padding-left: 10px;
            padding-right: 10px;
        }

        .message {
            max-width: 86%;
        }

        .welcome {
            margin-top: 45px;
            padding: 0 20px;
        }
    }
</style>

</head><body><div class="app"><!-- HEADER -->
<header class="header">

    <button class="back-btn" onclick="history.back()" aria-label="Go back">
        ←
    </button>

    <div class="orion-avatar">
        O
    </div>

    <div class="header-info">
        <h1>Orion Pax</h1>

        <div class="status">
            <span class="status-dot"></span>
            VitalStar AI
        </div>
    </div>

</header>


<!-- CHAT -->
<main class="messages" id="messages">

    <div class="welcome">

        <div class="welcome-avatar">
            O
        </div>

        <h2>Orion Pax</h2>

        <p>
            Text-based VitalStar AI.
            Ask a question to begin.
        </p>

    </div>

</main>


<!-- TYPING INDICATOR -->
<div class="typing" id="typing">

    <div class="message-row orion">

        <div class="message orion">
            Orion Pax is thinking...
        </div>

    </div>

</div>


<!-- COMPOSER -->
<div class="composer">

    <div class="composer-inner">

        <textarea
            id="messageInput"
            placeholder="Message Orion Pax..."
            rows="1"
            autocomplete="off"
        ></textarea>

        <button
            id="sendBtn"
            type="button"
            aria-label="Send message"
        >
            ➤
        </button>

    </div>

    <div class="footer-note">
        Orion Pax is a text-only VitalStar AI.
    </div>

</div>

</div><script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const typing = document.getElementById("typing");

    function addMessage(text, sender) {

        const welcome = document.querySelector(".welcome");

        if (welcome) {
            welcome.remove();
        }

        const row = document.createElement("div");
        row.className = "message-row " + sender;

        const bubble = document.createElement("div");
        bubble.className = "message " + sender;

        bubble.textContent = text;

        row.appendChild(bubble);
        messages.appendChild(row);

        messages.scrollTop = messages.scrollHeight;
    }


    function showTyping(show) {
        typing.style.display = show ? "block" : "none";

        if (show) {
            messages.scrollTop = messages.scrollHeight;
        }
    }


    function sendMessage() {

        const text = input.value.trim();

        if (!text) {
            return;
        }

        addMessage(text, "user");

        input.value = "";
        input.style.height = "44px";

        showTyping(true);

        /*
         * TEMPORARY RESPONSE
         *
         * The real AI will be connected here through
         * a secure backend/Cloudflare Worker.
         */

        setTimeout(() => {

            showTyping(false);

            addMessage(
                "I am Orion Pax. My AI connection has not been configured yet.",
                "orion"
            );

        }, 800);
    }


    sendBtn.addEventListener("click", sendMessage);


    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            sendMessage();
        }

    });


    input.addEventListener("input", function() {

        this.style.height = "44px";

        this.style.height =
            Math.min(this.scrollHeight, 130) + "px";

    });
</script></body>
</html>
