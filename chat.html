<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
    display:flex;
    flex-direction:column;
    height:100vh;
}

.header{
    background:#1877f2;
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    padding:12px 16px;
    border-radius:18px;
    margin:10px 0;
    max-width:75%;
    word-wrap:break-word;
}

.sent{
    background:#1877f2;
    color:white;
    margin-left:auto;
}

.received{
    background:white;
    border:1px solid #ddd;
}

.input-area{
    display:flex;
    align-items:center;
    padding:10px;
    background:white;
    border-top:1px solid #ddd;
}

.attach-btn{
    font-size:28px;
    cursor:pointer;
    margin-right:10px;
}

input[type=text]{
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    border-radius:25px;
    outline:none;
}

button{
    margin-left:10px;
    padding:12px 18px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

img{
    max-width:220px;
    border-radius:10px;
}

video{
    max-width:220px;
    border-radius:10px;
}

audio{
    width:220px;
}
</style>

</head>
<body>

<div class="header">
💬 VitalStar Chat
</div>

<div id="messages" class="messages">

<div class="message received">
Welcome to VitalStar Chat 👋
</div>

</div>

<div class="input-area">

<label for="fileInput" class="attach-btn">📎</label>

<input
type="file"
id="fileInput"
accept="image/*,video/*,audio/*"
hidden>

<input
type="text"
id="messageInput"
placeholder="Type a message...">

<button onclick="sendMessage()">
Send
</button>

</div>

<script type="module" src="chat.js"></script>

</body>
</html>
