<div class="input-area">
    <label for="fileInput" class="attach-btn">📎</label>

    <input
        type="file"
        id="fileInput"
        accept="image/*,video/*,audio/*"
        hidden
    >

    <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
    >

    <button onclick="sendMessage()">Send</button>
</div><script src="js/chat.js"></script>
