<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#6a1b9a;
    color:white;
    padding:15px;
    text-align:center;
}

#reports{
    padding:15px;
}

.report{
    background:white;
    margin-bottom:15px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

button{
    border:none;
    padding:10px 15px;
    margin:5px;
    border-radius:6px;
    cursor:pointer;
}

.resolve{
    background:green;
    color:white;
}

.delete{

    color:white;
}
