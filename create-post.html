<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - VitalStar</title>

    <!-- theme.js first: applies the theme saved from Edit Profile before paint -->
    <script src="theme.js"></script>
    <style>
/* =========================================================
   VITALSTAR — CREATE POST (neon)
   Colors follow data-theme set by theme.js
   (chosen in Edit Profile → Theme)
========================================================= */
:root{
    --bg-1:#17163f; --bg-2:#080817; --bg-3:#03030b;
    --card:rgba(13,13,38,.92);
    --text:#f3f5ff;
    --muted:#9ea4cc;
    --field:#07071a;
    --field-border:#2f3166;
    --neon-blue:#2f7bff;
    --neon-purple:#a23bff;
    --neon-pink:#ff3ec9;
    --neon-cyan:#2ff3ff;
    --grad:linear-gradient(135deg,#2f7bff,#a23bff 55%,#ff3ec9);
    --glow:rgba(80,120,255,.55);
    --glow-soft:rgba(110,80,255,.25);
    --nav-bg:rgba(7,7,20,.96);
    --nav-text:#aeb3d6;
    --nav-hover:#fff;
    --danger:#ff6b81;
    color-scheme:dark;
}
:root[data-theme="light"]{
    --bg-1:#e6ecff; --bg-2:#f2f5fc; --bg-3:#f8f9ff;
    --card:rgba(255,255,255,.96);
    --text:#14183a;
    --muted:#5d6488;
    --field:#f3f6ff;
    --field-border:#cdd5f3;
    --glow:rgba(70,100,240,.35);
    --glow-soft:rgba(120,80,240,.15);
    --nav-bg:rgba(255,255,255,.97);
    --nav-text:#6b7298;
    --nav-hover:#14183a;
    --danger:#d6304f;
    color-scheme:light;
}

.vs-theming,.vs-theming *{
    transition:background-color .3s,color .3s,border-color .3s,box-shadow .3s !important;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

html,body{min-height:100%}

body{
    background:radial-gradient(circle at top,var(--bg-1) 0%,var(--bg-2) 45%,var(--bg-3) 100%);
    background-attachment:fixed;
    color:var(--text);
    padding-bottom:100px;
}

/* ---------- HEADER ---------- */
.header{
    position:sticky;top:0;z-index:500;
    padding:16px;
    text-align:center;
    background:var(--nav-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--neon-blue);
    box-shadow:0 2px 18px var(--glow-soft);
}
.header h2{
    font-size:22px;
    color:var(--text);
    text-shadow:0 0 10px var(--glow),0 0 24px rgba(162,59,255,.45);
}
:root[data-theme="light"] .header h2{text-shadow:none}

/* thin posting progress line (not full screen) */
.progress-line{
    position:absolute;left:0;bottom:-1px;
    height:3px;width:100%;
    overflow:hidden;
    opacity:0;transition:opacity .2s;
}
.progress-line::after{
    content:"";
    position:absolute;top:0;left:-40%;
    width:40%;height:100%;
    background:var(--grad);
    box-shadow:0 0 12px var(--neon-pink);
    animation:slide 1s ease-in-out infinite;
}
body.posting .progress-line{opacity:1}
@keyframes slide{to{left:100%}}

/* ---------- CARD ---------- */
.container{max-width:520px;margin:20px auto;padding:0 14px}

.post-card{
    position:relative;
    padding:20px;
    background:var(--card);
    border-radius:20px;
    border:1px solid transparent;
    background-clip:padding-box;
    box-shadow:0 0 0 1px var(--neon-blue),0 0 22px var(--glow-soft),0 12px 35px rgba(0,0,0,.35);
}
:root[data-theme="light"] .post-card{
    box-shadow:0 0 0 1px rgba(80,110,230,.35),0 8px 28px rgba(60,80,180,.12);
}

/* ---------- TEXT ---------- */
#postText{
    display:block;
    width:100%;
    min-height:140px;
    resize:vertical;
    padding:14px;
    font-size:16px;
    line-height:1.5;
    color:var(--text);
    background:var(--field);
    border:1px solid var(--field-border);
    border-radius:14px;
    outline:none;
    transition:border-color .2s,box-shadow .2s;
}
#postText::placeholder{color:var(--muted)}
#postText:focus{
    border-color:var(--neon-blue);
    box-shadow:0 0 0 3px var(--glow-soft),0 0 18px var(--glow);
}

.char-count{margin-top:6px;text-align:right;font-size:12px;color:var(--muted)}

/* ---------- PREVIEW ---------- */
.preview-box{margin-top:14px;text-align:center}
.preview{
    display:block;
    width:100%;max-height:340px;
    object-fit:cover;
    margin:0 auto;
    border-radius:14px;
    border:1px solid var(--neon-purple);
    box-shadow:0 0 18px rgba(162,59,255,.35);
}

/* ---------- UPLOAD BUTTONS ---------- */
.upload-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:16px;
}
.upload-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:12px;
    font-size:15px;font-weight:bold;
    color:var(--text);
    background:var(--field);
    border-radius:12px;
    cursor:pointer;
    transition:transform .2s,box-shadow .2s;
}
.image-btn{
    border:1px solid var(--neon-cyan);
    box-shadow:0 0 12px rgba(47,243,255,.28);
}
.video-btn{
    border:1px solid var(--neon-pink);
    box-shadow:0 0 12px rgba(255,62,201,.28);
}
.image-btn:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(47,243,255,.6)}
.video-btn:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(255,62,201,.6)}
:root[data-theme="light"] .image-btn,
:root[data-theme="light"] .video-btn{box-shadow:none}

/* ---------- POST BUTTON ---------- */
.post-btn{
    min-width:190px;
    padding:14px 28px;
    border:none;
    border-radius:999px;
    font-size:17px;font-weight:bold;
    color:#fff;
    background:var(--grad);
    cursor:pointer;
    box-shadow:0 0 18px var(--glow),0 0 40px rgba(255,62,201,.25);
    transition:transform .2s,box-shadow .2s,opacity .2s;
}
.post-btn:hover{transform:translateY(-2px);box-shadow:0 0 28px var(--glow),0 0 55px rgba(255,62,201,.4)}
.post-btn:disabled{opacity:.8;cursor:not-allowed;transform:none;filter:saturate(.75)}

.spinner{
    display:inline-block;
    width:16px;height:16px;
    margin-right:8px;
    vertical-align:-3px;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
    position:fixed;bottom:0;left:0;
    width:100%;height:65px;
    display:flex;justify-content:space-around;align-items:center;
    background:var(--nav-bg);
    border-top:1px solid var(--neon-blue);
    box-shadow:0 -5px 20px rgba(0,0,0,.25),0 0 20px var(--glow-soft);
    backdrop-filter:blur(12px);
    z-index:1000;
}
.bottom-nav a{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:50px;
    font-size:22px;
    text-decoration:none;
    color:var(--nav-text);
    transition:.2s;
}
.bottom-nav a:hover{color:var(--nav-hover);transform:translateY(-2px)}
.bottom-nav small{font-size:11px;margin-top:2px}
.bottom-nav .create-button{
    width:55px;height:55px;
    margin-top:-25px;
    border-radius:50%;
    font-size:28px;
    color:#fff;
    background:var(--grad);
    border:2px solid rgba(255,255,255,.25);
    box-shadow:0 0 20px var(--glow),0 0 36px rgba(255,62,201,.3);
}

@media(max-width:520px){
    .container{margin:14px auto}
    .post-card{padding:16px;border-radius:16px}
}
@media(prefers-reduced-motion:reduce){
    .spinner,.progress-line::after{animation-duration:2s}
}

</style>
</head>
<body>

<header class="header">
    <h2>✨ Create Post</h2>
    <div class="progress-line"></div>
</header>

<div class="container">

    <div class="post-card">

        <textarea id="postText" placeholder="What's on your mind?"></textarea>
        <div class="char-count" id="charCount">0 characters</div>

        <div class="preview-box">
            <img id="imagePreview" class="preview" style="display:none;">
            <video id="videoPreview" class="preview" controls style="display:none;"></video>
        </div>

        <div class="upload-buttons">

            <label for="postImage" class="upload-btn image-btn">📷 Image</label>
            <input type="file" id="postImage" accept="image/*" hidden>

            <label for="postVideo" class="upload-btn video-btn">🎥 Video</label>
            <input type="file" id="postVideo" accept="video/*" hidden>

        </div>

        <br/><br/>
        <center>
            <button id="postButton" class="post-btn" onclick="createPost()">🚀 Post</button>
        </center>

    </div>

</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <a href="home.html"><span>🏠</span><small>Home</small></a>
    <a href="users.html"><span>👥</span><small>Friends</small></a>
    <a href="create-post.html" class="create-button">➕</a>
    <a href="general-room.html"><span>💬</span><small>Chat</small></a>
    <a href="profile.html"><span>👤</span><small>Profile</small></a>
</div>

<script type="module" src="create-post.js"></script>
<script type="module" src="auth-guard.js"></script>

<!-- Post indicator: wraps your existing createPost() without changing it -->
<script>
(function(){
    var btn  = document.getElementById("postButton");
    var text = document.getElementById("postText");
    var count = document.getElementById("charCount");

    if(text && count){
        text.addEventListener("input", function(){
            var n = text.value.length;
            count.textContent = n + (n === 1 ? " character" : " characters");
        });
    }

    function setBusy(busy){
        document.body.classList.toggle("posting", busy);
        btn.disabled = busy;
        btn.innerHTML = busy
            ? '<span class="spinner"></span>Posting...'
            : "🚀 Post";
    }

    window.addEventListener("load", function(){
        var original = window.createPost;
        if(typeof original !== "function"){ return; }

        window.createPost = async function(){
            if(btn.disabled){ return; }
            setBusy(true);
            try{
                return await original.apply(this, arguments);
            }finally{
                setBusy(false);
            }
        };
    });
})();
</script>

</body>
</html>
