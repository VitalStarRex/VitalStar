<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Post - VitalStar</title>

    <!-- SHARED THEME (switch is controlled from home.html) -->
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>

    <style>
/* =========================================================
   VITALSTAR — CREATE POST
   Theme is controlled by home.html (theme.css + theme.js).
   Dark = neon navy blue. Light uses the shared light variables.
   ========================================================= */

/* ---------- Neon navy dark theme (same as home.html) ---------- */
:root[data-theme="dark"]{
    --vs-bg:#050b1f;
    --vs-text:#ffffff;
    --vs-text-soft:#dbe6ff;
    --vs-muted:#a9bbe6;
    --vs-dim:#8396c4;

    --vs-card:linear-gradient(160deg,rgba(14,30,78,.88),rgba(6,14,42,.94));
    --vs-card-solid:#0a1634;
    --vs-card-border:rgba(70,120,255,.42);
    --vs-card-glow:0 0 0 1px rgba(0,190,255,.08),0 0 22px rgba(30,90,255,.22);

    --vs-line:rgba(90,130,255,.20);
    --vs-hover:rgba(60,110,255,.12);
    --vs-chip:rgba(14,30,78,.85);
    --vs-chip-hover:rgba(40,80,200,.45);
    --vs-input:rgba(10,22,60,.9);
    --vs-input-hover:rgba(20,40,100,.95);

    --vs-header-bg:rgba(5,11,31,.90);
    --vs-nav-bg:rgba(7,16,46,.93);
    --vs-shadow:0 12px 40px rgba(0,0,0,.55);

    --vs-glow-1:rgba(0,120,255,.22);
    --vs-glow-2:rgba(0,200,255,.14);
    --vs-glow-3:rgba(40,70,255,.22);

    --vs-cyan:#19c8ff;
    --vs-purple:#4d8dff;
    --vs-pink:#ff3b6b;
    --vs-green:#32df72;
    --vs-danger:#ff2d55;

    --vs-heading:linear-gradient(90deg,#ffffff,#19c8ff);
    --vs-brand-grad:linear-gradient(135deg,#6a3cff,#19c8ff);
    --vs-plus-grad:linear-gradient(135deg,#1a5dff,#7a3cff);
    --vs-plus-shadow:0 0 22px rgba(40,110,255,.75);
    --vs-ring-gap:#050b1f;
}

/* ---------- Base ---------- */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{ scroll-behavior:smooth; }

body{
    background:var(--vs-bg);
    color:var(--vs-text);
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        radial-gradient(circle at 15% 10%,var(--vs-glow-1),transparent 28%),
        radial-gradient(circle at 90% 20%,var(--vs-glow-2),transparent 28%),
        radial-gradient(circle at 50% 100%,var(--vs-glow-3),transparent 32%);
}

/* ---------- Header ---------- */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:68px;
    padding:0 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--vs-header-bg);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--vs-line);
    z-index:1000;
}

.header h2{
    font-size:20px;
    font-weight:900;
    letter-spacing:-.3px;
    background:var(--vs-heading);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

/* ---------- Layout ---------- */
.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
    padding:86px 12px 20px;
}

.post-card{
    position:relative;
    padding:16px;

    background:var(--vs-card);
    border:1px solid var(--vs-card-border);
    border-radius:22px;
    box-shadow:var(--vs-card-glow);
    overflow:hidden;
}

.post-card::before{
    content:"";
    position:absolute;
    top:0;
    left:15%;
    width:70%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,217,255,.6),rgba(77,141,255,.7),transparent);
}

/* ---------- Text area ---------- */
#postText{
    display:block;
    width:100%;
    min-height:150px;
    padding:14px 16px;

    background:var(--vs-input);
    color:var(--vs-text);
    border:1px solid var(--vs-line);
    border-radius:16px;
    outline:none;
    resize:vertical;

    font-size:16px;
    line-height:1.55;
    transition:border-color .2s,box-shadow .2s,background .2s;
}

#postText::placeholder{ color:var(--vs-dim); }

#postText:focus{
    background:var(--vs-input-hover);
    border-color:var(--vs-cyan);
    box-shadow:0 0 0 3px rgba(25,200,255,.15),0 0 18px rgba(30,110,255,.25);
}

/* ---------- Preview ---------- */
.preview-box{ margin-top:12px; }

.preview{
    display:block;
    width:100%;
    max-height:420px;
    margin-top:10px;

    object-fit:cover;
    background:#000;
    border:1px solid var(--vs-card-border);
    border-radius:16px;
    box-shadow:0 0 16px rgba(30,110,255,.2);
}

/* ---------- Upload buttons ---------- */
.upload-buttons{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:14px;
}

.upload-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:46px;
    padding:10px 8px;

    background:var(--vs-chip);
    border:1px solid var(--vs-card-border);
    border-radius:14px;
    color:var(--vs-text-soft);

    font-size:14px;
    font-weight:850;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:transform .15s,background .2s,box-shadow .2s;
}

.upload-btn:hover{
    background:var(--vs-chip-hover);
    transform:translateY(-1px);
}

.upload-btn:active{ transform:scale(.96); }

.image-btn{ color:var(--vs-purple); box-shadow:0 0 12px rgba(77,141,255,.18); }
.video-btn{ color:var(--vs-cyan);   box-shadow:0 0 12px rgba(25,200,255,.18); }

/* ---------- Post button ---------- */
.post-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:190px;
    min-height:52px;
    padding:0 30px;

    border:0;
    border-radius:26px;
    background:var(--vs-brand-grad);
    color:#fff;

    font-size:16px;
    font-weight:900;
    letter-spacing:.2px;
    cursor:pointer;

    box-shadow:0 0 22px rgba(60,120,255,.5);
    transition:transform .15s,filter .2s,box-shadow .2s;
}

.post-btn:hover{
    filter:brightness(1.1);
    box-shadow:0 0 28px rgba(60,140,255,.7);
}

.post-btn:active{ transform:scale(.95); }

.post-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
    box-shadow:none;
    filter:grayscale(.3);
}

/* ---------- Bottom navigation (same as home.html) ---------- */
.bottom-nav{
    position:fixed;
    left:50%;
    bottom:calc(10px + env(safe-area-inset-bottom));
    transform:translateX(-50%);

    width:min(96%,620px);
    height:68px;
    padding:5px 8px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:var(--vs-nav-bg);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid var(--vs-card-border);
    border-radius:24px;
    box-shadow:var(--vs-shadow);

    z-index:1000;
}

:root[data-theme="dark"] .bottom-nav{
    border-color:rgba(70,130,255,.55);
    box-shadow:0 0 18px rgba(30,100,255,.3),0 12px 40px rgba(0,0,0,.55);
}

.bottom-nav a{
    position:relative;
    flex:1;
    min-width:0;
    padding:5px 2px;

    color:var(--vs-dim);
    text-decoration:none;
    text-align:center;
    font-size:22px;
    transition:.2s;
}

.bottom-nav a:hover{ color:var(--vs-text); }

.bottom-nav small{
    display:block;
    margin-top:3px;
    font-size:10px;
    font-weight:800;
}

.bottom-nav a.create-btn{
    flex:0 0 62px;
    width:62px;
    height:62px;
    margin-top:-30px;
    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    border:4px solid var(--vs-ring-gap);
    background:var(--vs-plus-grad);
    box-shadow:var(--vs-plus-shadow);
    color:#fff;
    font-size:34px;
    font-weight:300;
}

.bottom-nav a.create-btn:active{ transform:scale(.92); }

/* ---------- Small phones ---------- */
@media(max-width:600px){
    .header{ height:62px; }
    .container{ padding:78px 8px 18px; }
    .post-card{ padding:13px; border-radius:19px; }
    #postText{ min-height:130px; font-size:15px; }
    .post-btn{ width:100%; min-width:0; }
    .bottom-nav{ height:64px; border-radius:21px; }
    .bottom-nav a.create-btn{
        flex-basis:56px;
        width:56px;
        height:56px;
        margin-top:-28px;
        font-size:30px;
    }
}

/* Footer: coin icon + active underline (same as home.html) */
.bottom-nav .coin-link .vs-coin{ display:block; margin:0 auto; }
.bottom-nav a.active{ color:var(--vs-purple); }

    </style>
</head>
<body>

<header class="header">
    <h2>✨ Create Post</h2>
</header>

<div class="container">

    <div class="post-card">

        <textarea
            id="postText"
            placeholder="What's on your mind?"
        ></textarea>

        <div class="preview-box">

            <img
                id="imagePreview"
                class="preview"
                style="display:none;"
            >

            <video
                id="videoPreview"
                class="preview"
                controls
                style="display:none;"
            ></video>

        </div>

        <div class="upload-buttons">

            <label for="postImage" class="upload-btn image-btn">
                📷 Image
            </label>

            <input
                type="file"
                id="postImage"
                accept="image/*"
                hidden
            >

            <label for="postVideo" class="upload-btn video-btn">
                🎥 Video
            </label>

            <input
                type="file"
                id="postVideo"
                accept="video/*"
                hidden
            >

        </div>
          <br/><br/><center>
        <button
            id="postButton"
            class="post-btn"
            onclick="createPost()">
            🚀 Post
        </button></center>

    </div>

</div>


<!-- Bottom Navigation (same as home.html) -->
<nav class="bottom-nav">

    <a href="home.html">
        🏠
        <small>Home</small>
    </a>

    <a href="users.html">
        🔎
        <small>Explore</small>
    </a>

    <a href="create-post.html" class="create-btn" aria-label="Create Post">+</a>

    <a href="wallet.html" class="coin-link">
        <i class="vs-coin big"></i>
        <small>Coins</small>
    </a>

    <a href="profile.html">
        👤
        <small>Profile</small>
    </a>

</nav>


<script type="module" src="create-post.js"></script>
<script type="module" src="auth-guard.js"></script>

</body>
</html>
