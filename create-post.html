<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - VitalStar</title>

    <link rel="stylesheet" href="create-post.css">
</head>
<body>

<header class="header">
    <h2>✨ Create Post</h2>
</header>

<div class="container">

    <div class="post-card">

        <textarea
            id="postText"
            placeholder="What's on your mind?"
        ></textarea>

        <div class="preview-box">

            <img
                id="imagePreview"
                class="preview"
                style="display:none;"
            >

            <video
                id="videoPreview"
                class="preview"
                controls
                style="display:none;"
            ></video>

        </div>

        <div class="upload-buttons">

            <label for="postImage" class="upload-btn image-btn">
                📷 Image
            </label>

            <input
                type="file"
                id="postImage"
                accept="image/*"
                hidden
            >

            <label for="postVideo" class="upload-btn video-btn">
                🎥 Video
            </label>

            <input
                type="file"
                id="postVideo"
                accept="video/*"
                hidden
            >

        </div>

        <button
            id="postButton"
            class="post-btn"
            onclick="createPost()">
            🚀 Post
        </button>

    </div>

</div>

<script type="module" src="create-post.js"></script>
<script type="module" src="auth-guard.js"></script>

</body>
</html>
