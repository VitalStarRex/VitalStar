<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group - VitalStar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
}

.cover{
    position:relative;
    width:100%;
    height:220px;
    background:#ddd;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.group-info{
    background:white;
    margin-top:-5px;
    padding:20px;
    text-align:center;
}

.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    margin-top:-80px;
    background:#eee;
}

.group-name{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

.group-desc{
    color:#666;
    margin-top:10px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
    flex-wrap:wrap;
}

.stat{
    background:#f5f5f5;
    padding:10px 15px;
    border-radius:10px;
}

.buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:20px;
    flex-wrap:wrap;
}

.buttons button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

#joinBtn{
    background:#1877f2;
    color:white;
}

#subscribeBtn{
    background:#ff9800;
    color:white;
}

.tabs{
    display:flex;
    overflow-x:auto;
    background:white;
    margin-top:10px;
}

.tab{
    padding:15px;
    white-space:nowrap;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    color:#1877f2;
    border-bottom:3px solid #1877f2;
}

.content{
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="cover">
    <img id="coverPhoto" src="">
</div>

<div class="group-info">

<img id="profilePhoto"
class="profile"
src="">

<div id="groupName"
class="group-name">
Loading...
</div>

<div id="groupDescription"
class="group-desc">
</div>

<div class="stats">

<div class="stat">
👥
<br>
<span id="memberCount">0</span>
</div>

<div class="stat">
📝
<br>
<span id="postCount">0</span>
</div>

<div class="stat">
📂
<br>
<span id="category">-</span>
</div>

</div>

<div class="buttons">

<button id="joinBtn">
Join Group
</button>

<button id="subscribeBtn" style="display:none;">
💎 Subscribe
</button>

</div>

</div>

<div class="tabs">

<div class="tab active">
🏠 Home
</div>

<div class="tab">
📝 Posts
</div>

<div class="tab">
👥 Members
</div>

<div class="tab">
📷 Media
</div>

<div class="tab">
📜 Rules
</div>

<div class="tab">
⚙️ About
</div>

</div>

<div class="content">

<div id="postsContainer">

<div class="card">
Loading group...
</div>

</div>

</div>

<script type="module" src="group.js"></script>

</body>
</html>
