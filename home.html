<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070914">

<title>VitalStar</title>

<link rel="manifest" href="manifest.json">

<style>

/* =========================================================
   VITALSTAR — DEEP-SPACE SOCIAL HOME

   COLOUR TOKENS (change a colour once, it changes everywhere)
   midnight  = page background
   electric  = electric blue
   violet    = violet
   gold      = gold (wallet, create button, highlights)
   ========================================================= */

:root{
    --midnight:#070914;
    --navy:#0d1226;
    --card:#111729;
    --card-2:#0c1020;
    --electric:#00cfff;
    --violet:#8f4dff;
    --gold:#ffd24a;
    --pink:#ff3d9a;
    --text:#f3f5ff;
    --muted:#8d96b6;
    --line:rgba(255,255,255,.08);
    --brand-gradient:linear-gradient(90deg,#fff,#00d9ff,#8f4dff);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--midnight);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:96px;
}

/* Keyboard focus ring (accessibility) */
:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
}

/* Text for screen readers only */
.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
}

/* =========================================================
   BACKGROUND — nebula glow + slow drifting stars
   ========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;

    background:
        radial-gradient(circle at 12% 8%, rgba(0,207,255,.14), transparent 28%),
        radial-gradient(circle at 92% 18%, rgba(143,77,255,.16), transparent 28%),
        radial-gradient(circle at 50% 105%, rgba(255,61,154,.08), transparent 32%);
}

/* Tiny stars made only with CSS (no images, no extra scripts) */
body::after{
    content:"";
    position:fixed;
    inset:-100px 0 0 0;
    pointer-events:none;
    z-index:-1;
    opacity:.55;

    background-image:
        radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 90px 120px, #9fe9ff, transparent),
        radial-gradient(1.5px 1.5px at 160px 60px, #ffe48a, transparent),
        radial-gradient(1px 1px at 230px 170px, #fff, transparent),
        radial-gradient(1px 1px at 300px 90px, #c9a8ff, transparent);
    background-size:320px 220px;

    animation:starsDrift 120s linear infinite;
}

@keyframes starsDrift{
    from{ transform:translateY(0); }
    to{ transform:translateY(220px); }
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:rgba(7,9,20,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid var(--line);

    z-index:1000;
}

/* Thin electric-to-violet line under the header */
header::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-1px;
    width:100%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,207,255,.7),
        rgba(143,77,255,.7),
        transparent
    );
}

.menu{
    width:42px;
    height:42px;

    border:1px solid var(--line);
    border-radius:50%;

    background:#151a2d;
    color:#fff;

    font-size:21px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:9px;
    transition:.2s;
}

.menu:hover{
    background:#202743;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
}

/* Star with a slowly pulsing glow and a faint orbit ring */
.logo-star{
    position:relative;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    color:#fff;

    text-shadow:
        0 0 7px var(--electric),
        0 0 16px var(--violet),
        0 0 28px var(--pink);

    animation:starGlow 4s ease-in-out infinite;
}

.logo-star::after{
    content:"";
    position:absolute;
    inset:2px -2px;

    border:1px solid rgba(0,207,255,.35);
    border-radius:50%;

    transform:rotate(-24deg);
}

@keyframes starGlow{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.35); }
}

.logo-text{
    line-height:1;
    min-width:0;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:-.8px;

    background:var(--brand-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.logo-sub{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.3px;
    white-space:nowrap;
}

.icons{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-circle{
    width:42px;
    height:42px;

    border:1px solid var(--line);
    border-radius:50%;

    background:#151a2d;
    color:#dce4ff;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    font-size:20px;

    position:relative;
    transition:.2s;
}

.header-circle:hover{
    background:#202743;
    transform:translateY(-1px);
}

.search-trigger{
    font-size:21px;
}

.wallet-trigger{
    height:42px;

    border:1px solid rgba(255,210,74,.5);
    border-radius:22px;

    padding:0 12px;

    background:linear-gradient(
        135deg,
        rgba(255,210,74,.2),
        rgba(255,120,0,.14)
    );

    color:var(--gold);

    display:flex;
    align-items:center;
    gap:4px;

    font-size:12px;
    font-weight:900;

    cursor:pointer;

    box-shadow:0 0 16px rgba(255,190,0,.12);
    transition:.2s;
}

.wallet-trigger:hover{
    box-shadow:0 0 22px rgba(255,190,0,.28);
}

#walletBalance{
    white-space:nowrap;
}

/* =========================================================
   BADGES (hidden automatically when the count is 0)
   ========================================================= */

.badge{
    position:absolute;

    top:-4px;
    right:-3px;

    min-width:18px;
    height:18px;

    padding:0 5px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#ff326d,#ff3d9a);
    color:#fff;

    font-size:10px;
    font-weight:900;

    border:2px solid var(--midnight);

    box-shadow:0 0 10px rgba(255,50,109,.5);
}

.badge.is-empty{
    display:none;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;

    top:0;
    left:-285px;

    width:275px;
    height:100vh;

    padding:25px 12px;

    background:rgba(10,13,27,.98);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-right:1px solid var(--line);
    box-shadow:10px 0 40px rgba(0,0,0,.45);

    transition:.3s;

    z-index:1500;

    overflow-y:auto;
}

.sidebar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
    padding:0 4px;
}

.sidebar-header strong{
    font-size:20px;

    background:var(--brand-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.sidebar-close{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#181d32;
    color:#fff;

    font-size:18px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.sidebar-close:hover{
    background:#ff326d;
    transform:rotate(90deg);
}

.sidebar a,
#logoutBtn{
    display:flex;
    align-items:center;

    width:100%;

    margin:5px 0;
    padding:14px;

    border:0;
    border-radius:14px;

    background:transparent;
    color:#d9def4;

    text-decoration:none;
    text-align:left;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
    transition:.2s;
}

.sidebar a:hover,
#logoutBtn:hover{
    background:linear-gradient(
        90deg,
        rgba(0,190,255,.12),
        rgba(140,55,255,.16)
    );

    color:#fff;
    transform:translateX(3px);
}

.sidebar a#friendsMenuLink{
    position:relative;
}

.sidebar-badge{
    margin-left:auto;

    min-width:21px;
    height:21px;

    padding:0 6px;

    display:none;

    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#ff326d;
    color:#fff;

    font-size:11px;
    font-weight:900;

    border:2px solid #0a0d1b;

    box-shadow:0 0 10px rgba(255,50,109,.45);
}

.sidebar-badge.show{
    display:flex;
}

/* Dark overlay behind the open sidebar */
.sidebar-overlay{
    position:fixed;
    inset:0;

    background:rgba(3,4,10,.6);

    opacity:0;
    pointer-events:none;

    transition:opacity .3s;

    z-index:1400;
}

.sidebar-overlay.show{
    opacity:1;
    pointer-events:auto;
}

/* =========================================================
   MAIN
   ========================================================= */

.container{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:86px 10px 20px;
}

/* =========================================================
   STORIES
   ========================================================= */

.stories-section{
    margin-bottom:12px;
}

.stories{
    display:flex;

    gap:13px;

    overflow-x:auto;

    padding:5px 3px 13px;

    scrollbar-width:none;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story-wrap{
    flex:0 0 70px;
    width:70px;
    text-align:center;
}

.story-link{
    display:block;

    width:68px;
    height:68px;

    text-decoration:none;
    color:inherit;
    border-radius:50%;
}

.story{
    position:relative;

    width:68px;
    height:68px;

    border-radius:50%;
    cursor:pointer;
}

/* Rotating gold → blue → violet → pink ring */
.story::before{
    content:"";

    position:absolute;
    inset:0;

    border-radius:50%;

    background:conic-gradient(
        #ffd400,
        #00e5ff,
        #7c35ff,
        #ff239e,
        #ffd400
    );

    animation:storyRingSpin 3s linear infinite;

    box-shadow:
        0 0 8px rgba(255,212,0,.4),
        0 0 16px rgba(0,229,255,.25);
}

@keyframes storyRingSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

.story-inner{
    position:absolute;

    inset:4px;

    z-index:2;

    border-radius:50%;
    overflow:hidden;

    background:#14182b;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    border:2px solid var(--midnight);

    transition:.2s;
}

.story:hover .story-inner{
    transform:scale(.94);
}

.story-inner img{
    width:100%;
    height:100%;

    object-fit:cover;
    display:block;
}

.story-placeholder{
    font-size:27px;
}

.story-add{
    position:absolute;

    right:-2px;
    bottom:0;

    z-index:5;

    width:23px;
    height:23px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,var(--gold),var(--electric));

    border:2px solid #090b17;

    color:#080914;

    font-size:17px;
    font-weight:900;

    cursor:pointer;

    box-shadow:0 0 10px rgba(255,212,0,.45);
}

.story-name{
    display:block;

    margin-top:7px;

    color:#cbd1e8;

    font-size:10px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   CREATE POST (composer)
   ========================================================= */

#createPost{
    width:100%;
    margin:0 0 17px;
}

.composer{
    position:relative;

    background:linear-gradient(
        145deg,
        rgba(22,28,52,.96),
        rgba(12,15,29,.96)
    );

    border:1px solid var(--line);
    border-radius:22px;

    padding:13px;

    box-shadow:0 8px 30px rgba(0,0,0,.25);

    overflow:hidden;
}

/* Gold-to-blue accent line on top of the composer */
.composer::before{
    content:"";
    position:absolute;
    top:0;
    left:18px;
    right:18px;
    height:2px;

    background:linear-gradient(90deg,var(--gold),var(--electric),var(--violet));
    opacity:.8;
}

.composer-top{
    display:flex;
    align-items:center;
    gap:10px;
}

.composer-avatar{
    width:44px;
    height:44px;

    border-radius:50%;
    object-fit:cover;

    background:linear-gradient(135deg,#7c3cff,#00d5ff);

    border:2px solid #713cff;
}

.composer-input{
    flex:1;

    height:44px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;

    background:#171c31;
    color:#dce2f8;

    padding:0 17px;

    display:flex;
    align-items:center;

    font-size:14px;
    cursor:pointer;

    transition:.2s;
}

.composer-input:hover{
    background:#1d233b;
    border-color:rgba(0,207,255,.35);
}

.composer-actions{
    display:flex;

    margin-top:12px;
    padding-top:10px;

    border-top:1px solid rgba(255,255,255,.06);
}

.composer-action{
    flex:1;

    border:0;
    background:none;

    color:#bbc4e2;

    font-size:12px;
    font-weight:800;

    padding:8px 7px;

    cursor:pointer;
    border-radius:10px;

    transition:.2s;
}

.composer-action:hover{
    background:rgba(255,255,255,.06);
}

.photo-action{ color:#c348ff; }
.video-action{ color:var(--electric); }
.live-action{ color:#ff39c7; }
.feeling-action{ color:var(--gold); }

/* =========================================================
   HIDDEN COMPATIBILITY
   ========================================================= */

.compatibility-text{
    display:none;
}

/* =========================================================
   FEED
   ========================================================= */

#feed{
    width:100%;
}

.post-card{
    position:relative;

    background:linear-gradient(145deg,var(--card),var(--card-2));

    color:var(--text);

    border:1px solid var(--line);
    border-radius:21px;
    overflow:hidden;

    margin-top:15px;

    box-shadow:0 9px 28px rgba(0,0,0,.3);

    transition:border-color .25s, box-shadow .25s;
}

.post-card:hover{
    border-color:rgba(0,207,255,.22);
    box-shadow:
        0 9px 28px rgba(0,0,0,.3),
        0 0 22px rgba(143,77,255,.1);
}

.user-info{
    display:flex;
    align-items:center;

    padding:14px 14px 9px;
}

.avatar{
    width:45px;
    height:45px;

    min-width:45px;

    border-radius:50%;
    margin-right:10px;

    object-fit:cover;

    background:linear-gradient(135deg,#7b2cff,#00cfff);

    border:2px solid rgba(143,77,255,.75);
}

.post-card p{
    padding:5px 14px 13px;

    color:#edf0ff;

    font-size:15px;
    line-height:1.5;

    overflow-wrap:anywhere;
}

.post-photo{
    display:block;

    width:calc(100% - 18px);
    margin:0 9px;

    max-height:600px;

    border-radius:15px;

    object-fit:cover;
    background:#080b16;
}

.post-buttons{
    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:8px 6px;

    border-top:1px solid rgba(255,255,255,.07);
}

.post-buttons button{
    flex:1;

    border:none;
    background:none;

    color:#aeb7d5;

    font-size:13px;
    font-weight:800;

    padding:10px 4px;

    cursor:pointer;
    border-radius:10px;

    transition:.2s;
}

.post-buttons button:hover{
    background:rgba(0,207,255,.08);
    color:#fff;
}

.post-buttons button:active{
    transform:scale(.94);
}

.post-card img{
    max-width:100%;
}

.post-card video{
    width:100%;
    max-height:600px;

    object-fit:cover;
}

/* =========================================================
   FOOTER
   ========================================================= */

.vital-footer{
    display:none;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:min(96%,620px);
    height:68px;

    padding:5px 8px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:rgba(11,14,28,.92);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.1);
    border-radius:23px;

    box-shadow:0 12px 40px rgba(0,0,0,.55);

    z-index:1000;
}

.bottom-nav a{
    position:relative;

    min-width:54px;

    color:#8e96b4;

    text-decoration:none;
    text-align:center;

    font-size:21px;
    padding:5px;
    border-radius:14px;

    transition:.2s;
}

.bottom-nav a:hover{
    color:#fff;
}

.bottom-nav small{
    display:block;

    margin-top:3px;

    font-size:10px;
    font-weight:800;
}

/* Current page (Home) is highlighted */
.bottom-nav a[aria-current="page"]{
    color:var(--violet);
}

.bottom-nav a[aria-current="page"]::after{
    content:"";

    position:absolute;

    bottom:-5px;
    left:50%;

    transform:translateX(-50%);

    width:28px;
    height:3px;

    border-radius:10px;

    background:linear-gradient(90deg,var(--violet),var(--electric));

    box-shadow:0 0 8px var(--violet);
}

/* Centre "+" button: gold ring, blue-violet core */
.create-btn{
    width:57px !important;
    height:57px;

    min-width:57px !important;

    margin-top:-25px;

    border-radius:50% !important;

    display:flex !important;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#7639ff,var(--electric));

    color:#fff !important;

    font-size:30px !important;

    border:4px solid var(--midnight);

    box-shadow:
        0 0 0 2px rgba(255,210,74,.7),
        0 0 22px rgba(106,54,255,.6);

    text-shadow:0 2px 5px rgba(0,0,0,.3);

    transition:transform .2s, box-shadow .2s;
}

.create-btn:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:
        0 0 0 2px var(--gold),
        0 0 28px rgba(0,207,255,.55);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    header{
        height:68px;
        padding:0 9px;
    }

    .menu{
        width:38px;
        height:38px;
        font-size:19px;
        margin-right:4px;
    }

    .logo-star{
        width:34px;
        height:34px;
        font-size:28px;
    }

    .logo{
        font-size:20px;
    }

    .logo-sub{
        font-size:9px;
    }

    .icons{
        gap:5px;
    }

    .header-circle{
        width:38px;
        height:38px;
        font-size:18px;
    }

    .wallet-trigger{
        height:38px;
        padding:0 8px;
        font-size:11px;
    }

    .container{
        padding:79px 8px 18px;
    }

    .stories{
        gap:11px;
    }

    .story-wrap{
        flex-basis:65px;
        width:65px;
    }

    .story-link,
    .story{
        width:63px;
        height:63px;
    }

    .story-name{
        font-size:9px;
    }

    .composer{
        border-radius:19px;
    }

    .composer-action{
        font-size:10px;
    }

    .post-card{
        border-radius:18px;
    }

    .post-card p{
        font-size:14px;
    }

    .post-buttons button{
        font-size:12px;
    }

    .bottom-nav{
        bottom:7px;
        height:64px;
        border-radius:21px;
    }

    .create-btn{
        width:53px !important;
        height:53px;
        min-width:53px !important;
        font-size:27px !important;
    }

}

/* Very small phones: hide the tagline so icons never get squeezed */
@media(max-width:380px){
    .logo-sub{
        display:none;
    }
}

/* =========================================================
   REDUCED MOTION — respects people who turn animations off
   ========================================================= */

@media (prefers-reduced-motion: reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
    }

}

</style>

</head>

<body>

<header>

<button
    class="menu"
    id="menuButton"
    onclick="openMenu()"
    aria-label="Open menu"
    aria-controls="sidebar"
    aria-expanded="false"
>
    ☰
</button>

<div class="logo-area">

<div class="logo-star" aria-hidden="true">
    ☆
</div>

<div class="logo-text">

<div class="logo">
    VitalStar
</div>

<div class="logo-sub">
    Connect • Share • Grow
</div>

</div>

</div>

<div class="icons">

<a
    href="users.html"
    class="header-circle search-trigger"
    aria-label="Search people"
>
    <span aria-hidden="true">🔍</span>
</a>

<button
    class="wallet-trigger"
    id="walletButton"
    type="button"

<!-- HIDE BADGES WHEN THE COUNT IS 0 -->

<script>

(function(){

    function syncBadge(badge){

        const text =
            badge.textContent.trim();

        badge.classList.toggle(
            "is-empty",
            text === "" || text === "0"
        );

    }

    ["notificationBadge","messageBadge"].forEach(function(id){

        const badge =
            document.getElementById(id);

        if(!badge){
            return;
        }

        syncBadge(badge);

        new MutationObserver(function(){
            syncBadge(badge);
        }).observe(badge,{
            childList:true,
            characterData:true,
            subtree:true
        });

    });

})();

</script>

<!-- FRIEND REQUEST SIDEBAR COUNT -->

<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const friendRequestBadge =
    document.getElementById("friendRequestBadge");


function updateFriendRequestBadge(count){

    if(!friendRequestBadge){
        return;
    }

    if(count > 0){

        friendRequestBadge.textContent =
            count > 99 ? "99+" : count;

        friendRequestBadge.classList.add("show");

    }else{

        friendRequestBadge.textContent = "0";

        friendRequestBadge.classList.remove("show");

    }

}


auth.onAuthStateChanged(user => {

    if(!user){

        updateFriendRequestBadge(0);

        return;
    }


    const requestsQuery =
        query(
            collection(db, "friendRequests"),
            where("to", "==", user.uid)
        );


    onSnapshot(

        requestsQuery,

        snapshot => {

            let count = 0;

            snapshot.forEach(requestDoc => {

                const request = requestDoc.data();

                if(request.status === "pending"){
                    count++;
                }

            });

            updateFriendRequestBadge(count);

        },

        error => {

            console.error(
                "Friend request badge error:",
                error
            );

            updateFriendRequestBadge(0);

        }

    );

});

</script>

<!-- DYNAMIC STORIES LOADER -->

<script type="module">

import {
    auth,
    db,
    rtdb
} from "./firebase.js";

import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const storiesContainer =
    document.getElementById("stories");


/* DEFAULT PROFILE IMAGE */

const DEFAULT_AVATAR =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="200" height="200" viewBox="0 0 200 200">
            <rect width="200" height="200" rx="100" fill="#151a2d"/>
            <circle cx="100" cy="78" r="38" fill="#7c35ff"/>
            <path d="M35 180 C42 130 70 112 100 112 C130 112 158 130 165 180Z"
                  fill="#00cfff"/>
        </svg>
    `);


/* LOAD PROFILE — FULL NAME */

async function loadProfile(uid){

    try{

        const snapshot =
            await getDoc(doc(db, "users", uid));

        if(!snapshot.exists()){

            return {
                uid: uid,
                name: "",
                profilePicture: ""
            };

        }

        const data = snapshot.data();

        return {
            uid: uid,
            name: data.fullName || "",
            profilePicture:
                data.profilePicture ||
                data.photoURL ||
                ""
        };

    }catch(error){

        console.error(
            "Could not load profile:",
            uid,
            error
        );

        return {
            uid: uid,
            name: "",
            profilePicture: ""
        };

    }

}


/* LAST ACTIVE */

async function getLastActive(uid){

    try{

        const snapshot =
            await get(ref(rtdb, `status/${uid}`));

        if(snapshot.exists()){

            const status = snapshot.val();

            if(status){

                if(
                    status.lastSeen !== undefined &&
                    status.lastSeen !== null
                ){
                    return Number(status.lastSeen);
                }

                if(
                    status.lastActive !== undefined &&
                    status.lastActive !== null
                ){
                    return Number(status.lastActive);
                }

            }

        }

    }catch(error){

        console.warn("Presence unavailable:", uid);

    }

    return 0;

}


/* GET ACCEPTED FRIENDS */

async function getAcceptedFriends(uid){

    const friendIds = new Set();

    try{

        const sentQuery =
            query(
                collection(db, "friendRequests"),
                where("from", "==", uid),
                where("status", "==", "accepted")
            );

        const sentSnapshot =
            await getDocs(sentQuery);

        sentSnapshot.forEach(requestDoc => {

            const data = requestDoc.data();

            if(data.to){
                friendIds.add(data.to);
            }

        });

    }catch(error){

        console.warn("Sent friends query failed:", error);

    }

    try{

        const receivedQuery =
            query(
                collection(db, "friendRequests"),
                where("to", "==", uid),
                where("status", "==", "accepted")
            );

        const receivedSnapshot =
            await getDocs(receivedQuery);

        receivedSnapshot.forEach(requestDoc => {

            const data = requestDoc.data();

            if(data.from){
                friendIds.add(data.from);
            }

        });

    }catch(error){

        console.warn("Received friends query failed:", error);

    }

    return [...friendIds];

}


/* CREATE STORY */

function createStory(profile, ownStory = false){

    const wrap = document.createElement("div");
    wrap.className = "story-wrap";

    const link = document.createElement("a");
    link.className = "story-link";

    link.href =
        `profile.html?uid=${encodeURIComponent(profile.uid)}`;

    link.title =
        profile.name
            ? `View ${profile.name}'s profile`
            : "View profile";

    link.setAttribute(
        "aria-label",
        profile.name
            ? `View ${profile.name}'s profile`
            : "View profile"
    );

    const story = document.createElement("div");
    story.className = "story";

    const inner = document.createElement("div");
    inner.className = "story-inner";

    const image = document.createElement("img");

    image.src =
        profile.profilePicture || DEFAULT_AVATAR;

    image.alt =
        profile.name || "Profile";

    image.onerror = function(){

        this.onerror = null;
        this.src = DEFAULT_AVATAR;

    };

    inner.appendChild(image);
    story.appendChild(inner);
    link.appendChild(story);


    /* PLUS BUTTON FOR CURRENT USER */

    if(ownStory){

        const add = document.createElement("button");

        add.type = "button";
        add.className = "story-add";
        add.textContent = "+";
        add.title = "Create a story";
        add.setAttribute("aria-label", "Create a story");

        add.addEventListener("click", function(event){

            event.preventDefault();
            event.stopPropagation();

            if(
                window.VitalStarStory &&
                typeof window.VitalStarStory.open === "function"
            ){

                window.VitalStarStory.open();
                return;

            }

            if(
                window.VitalStarPost &&
                typeof window.VitalStarPost.open === "function"
            ){

                window.VitalStarPost.open();

            }

        });

        story.appendChild(add);

    }

    const name = document.createElement("span");
    name.className = "story-name";
    name.textContent = profile.name;

    wrap.appendChild(link);
    wrap.appendChild(name);

    return wrap;

}


/* RENDER STORIES */

async function loadStories(user){

    if(!storiesContainer){
        return;
    }

    storiesContainer.innerHTML = "";

    /* CURRENT USER FIRST */

    const currentProfile =
        await loadProfile(user.uid);

    storiesContainer.appendChild(
        createStory(currentProfile, true)
    );

    /* GET ACCEPTED FRIENDS */

    const friendIds =
        await getAcceptedFriends(user.uid);

    if(!friendIds.length){
        return;
    }

    /* LOAD FRIEND PROFILES + LAST ACTIVE */

    const friends =
        await Promise.all(

            friendIds.map(async friendUid => {

                const profile =
                    await loadProfile(friendUid);

                const lastActive =
                    await getLastActive(friendUid);

                return {
                    ...profile,
                    lastActive
                };

            })

        );

    /* MOST RECENTLY ACTIVE FIRST */

    friends.sort((a, b) => b.lastActive - a.lastActive);

    /* MAXIMUM 5 FRIENDS */

    friends.slice(0, 5).forEach(friend => {

        storiesContainer.appendChild(
            createStory(friend, false)
        );

    });

}


/* AUTH */

auth.onAuthStateChanged(async user => {

    if(!user){

        if(storiesContainer){
            storiesContainer.innerHTML = "";
        }

        return;

    }

    try{

        await loadStories(user);

    }catch(error){

        console.error("Stories error:", error);

    }

});

</script>
