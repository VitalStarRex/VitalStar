Yu<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2ff;
}

/* Header */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:linear-gradient(135deg,#1877f2,#7b2ff7);
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu{
    font-size:28px;
    cursor:pointer;
}

.icons{
    display:flex;
    gap:15px;
    font-size:22px;
}

/* Side Menu */
.sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:250px;
    height:100%;
    background:white;
    transition:.3s;
    box-shadow:2px 0 10px rgba(0,0,0,.2);
    padding-top:70px;
    z-index:999;
}

.sidebar a{
    display:block;
    padding:15px 20px;
    color:#333;
    text-decoration:none;
    font-weight:bold;
}

.sidebar a:hover{
    background:#1877f2;
    color:white;
}

/* Content */
.container{
    margin-top:80px;
    padding:15px;
}

/* Create Post */
.post-box{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.post-box input{
    width:100%;
    padding:12px;
    border:none;
    background:#f2f2f2;
    border-radius:25px;
    font-size:16px;
    outline:none;
}

/* Stories */
.stories{
    display:flex;
    overflow-x:auto;
    gap:10px;
    margin:20px 0;
}

.story{
    min-width:90px;
    height:150px;
    border-radius:15px;
    background:linear-gradient(135deg,#1877f2,#7b2ff7);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<header>
<div class="menu"> <a href="menu.html">☰</a></div>

<div class="logo">⭐ VitalStar</div>

<div class="icons">
<span><a href="notifications.html">🔔</a></span>
<span><a href="message.html">💬</a></span>
</div>
</header>

<div class="sidebar" id="sidebar">
<a href="#">🏠 Home</a>
<a href="#">👤 Profile</a>
<a href="#">👥 Friends</a>
<a href="#">💬 Messages</a>
<a href="#">📸 Photos</a>
<a href="#">⚙️ Settings</a>
<a href="#">🚪 Logout</a>
</div>

<div class="container">

<div class="post-box">
<input type="text" placeholder="What's happening on VitalStar?">
</div>

<div class="stories">
<div class="story">Story</div>
<div class="story">Story</div>
<div class="story">Story</div>
<div class="story">Story</div>
<div class="story">Story</div>
</div>

</div>

<script>
function openMenu(){
    const menu=document.getElementById("sidebar");

    if(menu.style.left=="0px"){
        menu.style.left="-260px";
    }else{
        menu.style.left="0";
    }
}
</script>
