<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>VitalStar</title>

<link rel="manifest" href="manifest.json">

<style>

/* =========================================================
   VITALSTAR — MODERN SOCIAL HOME
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#070914;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:88px;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,183,255,.10),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(168,59,255,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,0,153,.07),
            transparent 30%
        );

    z-index:-1;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:72px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:rgba(7,9,20,.92);

    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.08);

    z-index:1000;
}

.menu{
    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:#151a2d;

    color:#fff;

    font-size:21px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:9px;
}

.logo-area{
    display:flex;
    align-items:center;

    gap:9px;

    flex:1;
}

.logo-star{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:35px;

    color:#fff;

    text-shadow:
        0 0 7px #00cfff,
        0 0 16px #7b2cff,
        0 0 28px #ff19a8;
}

.logo-text{
    line-height:1;
}

.logo{
    font-size:23px;
    font-weight:900;

    letter-spacing:-.8px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #00d9ff,
            #8f4dff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.logo-sub{
    margin-top:4px;

    color:#8991ae;

    font-size:11px;

    letter-spacing:.3px;
}

.icons{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-circle{
    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:#151a2d;

    color:#dce4ff;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    font-size:20px;

    position:relative;

    transition:.2s;
}

.header-circle:hover{
    background:#202743;
    transform:translateY(-1px);
}

.search-trigger{
    font-size:23px;
}

.wallet-trigger{
    height:42px;

    border:1px solid rgba(255,204,0,.45);

    border-radius:22px;

    padding:0 11px;

    background:
        linear-gradient(
            135deg,
            rgba(255,211,0,.18),
            rgba(255,120,0,.14)
        );

    color:#ffd84a;

    display:flex;
    align-items:center;
    gap:4px;

    font-size:12px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(255,180,0,.10);
}

#walletBalance{
    white-space:nowrap;
}

/* =========================================================
   BADGES
   ========================================================= */

.badge{
    position:absolute;

    top:-4px;
    right:-3px;

    min-width:18px;
    height:18px;

    padding:0 5px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ff326d;

    color:#fff;

    font-size:10px;
    font-weight:900;

    border:2px solid #080a15;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;

    top:0;
    left:-285px;

    width:275px;
    height:100vh;

    padding:25px 12px 25px;

    background:rgba(10,13,27,.98);

    backdrop-filter:blur(20px);

    border-right:1px solid rgba(255,255,255,.08);

    box-shadow:10px 0 40px rgba(0,0,0,.4);

    transition:.3s;

    z-index:1500;

    overflow-y:auto;
}

/* =========================================================
   SIDEBAR HEADER
   ========================================================= */

.sidebar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;

    padding:0 4px;
}

.sidebar-header strong{
    font-size:20px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #00d9ff,
            #8f4dff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.sidebar-close{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#181d32;

    color:#fff;

    font-size:18px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.sidebar-close:hover{
    background:#ff326d;
    transform:rotate(90deg);
}

/* =========================================================
   SIDEBAR LINKS
   ========================================================= */

.sidebar a,
#logoutBtn{
    display:flex;
    align-items:center;

    width:100%;

    margin:5px 0;

    padding:14px;

    border:0;
    border-radius:14px;

    background:transparent;

    color:#d9def4;

    text-decoration:none;

    text-align:left;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.sidebar a:hover,
#logoutBtn:hover{
    background:
        linear-gradient(
            90deg,
            rgba(0,190,255,.12),
            rgba(140,55,255,.14)
        );

    color:#fff;

    transform:translateX(3px);
}

/* =========================================================
   FRIEND REQUEST SIDEBAR BADGE
   ========================================================= */

.sidebar a#friendsMenuLink{
    position:relative;
}

.sidebar-badge{
    margin-left:auto;

    min-width:21px;
    height:21px;

    padding:0 6px;

    display:none;

    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#ff326d;

    color:#fff;

    font-size:11px;
    font-weight:900;

    border:2px solid #0a0d1b;

    box-shadow:
        0 0 10px rgba(255,50,109,.45);
}

.sidebar-badge.show{
    display:flex;
}

/* =========================================================
   MAIN
   ========================================================= */

.container{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:86px 10px 20px;
}

/* =========================================================
   STORIES
   ========================================================= */

.stories-section{
    margin-bottom:12px;
}

.stories{
    display:flex;

    gap:13px;

    overflow-x:auto;

    padding:5px 3px 13px;

    scrollbar-width:none;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story-wrap{
    flex:0 0 70px;

    width:70px;

    text-align:center;
}

.story{
    position:relative;

    width:68px;
    height:68px;

    padding:3px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #00e5ff,
            #8a35ff,
            #ff239e
        );

    box-shadow:
        0 0 13px rgba(119,52,255,.35);

    cursor:pointer;
}

.story-inner{
    width:100%;
    height:100%;

    border-radius:50%;

    overflow:hidden;

    background:#14182b;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
}

.story-inner img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.story-placeholder{
    font-size:27px;
}

.story-add{
    position:absolute;

    right:-2px;
    bottom:0;

    width:23px;
    height:23px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#08bfff;

    border:2px solid #090b17;

    color:white;

    font-size:17px;
    font-weight:900;
}

.story-name{
    display:block;

    margin-top:7px;

    color:#cbd1e8;

    font-size:10px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   CREATE POST
   ========================================================= */

#createPost{
    width:100%;
    margin:0 0 17px;
}

/* =========================================================
   COMPOSER
   ========================================================= */

.composer{
    background:
        linear-gradient(
            145deg,
            rgba(20,25,45,.96),
            rgba(12,15,29,.96)
        );

    border:1px solid rgba(255,255,255,.08);

    border-radius:22px;

    padding:13px;

    box-shadow:0 8px 30px rgba(0,0,0,.2);

    margin-bottom:0;
}

.composer-top{
    display:flex;
    align-items:center;
    gap:10px;
}

.composer-avatar{
    width:44px;
    height:44px;

    border-radius:50%;

    object-fit:cover;

    background:
        linear-gradient(
            135deg,
            #7c3cff,
            #00d5ff
        );

    border:2px solid #713cff;
}

.composer-input{
    flex:1;

    height:44px;

    border:1px solid rgba(255,255,255,.09);

    border-radius:24px;

    background:#171c31;

    color:#dce2f8;

    padding:0 17px;

    display:flex;
    align-items:center;

    font-size:14px;

    cursor:pointer;
}

.composer-input:hover{
    background:#1d233b;
}

.composer-actions{
    display:flex;

    margin-top:12px;

    padding-top:10px;

    border-top:1px solid rgba(255,255,255,.06);
}

.composer-action{
    flex:1;

    border:0;
    background:none;

    color:#bbc4e2;

    font-size:12px;
    font-weight:800;

    padding:7px;

    cursor:pointer;

    border-radius:10px;
}

.composer-action:hover{
    background:rgba(255,255,255,.05);
}

.photo-action{
    color:#c348ff;
}

.video-action{
    color:#00caff;
}

.live-action{
    color:#ff39c7;
}

.feeling-action{
    color:#00e6d0;
}

/* =========================================================
   HIDDEN COMPATIBILITY
   ========================================================= */

.compatibility-text{
    display:none;
}

/* =========================================================
   FEED
   ========================================================= */

#feed{
    width:100%;
}

.post-card{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #111627,
            #0d1120
        );

    color:#f3f5ff;

    border:1px solid rgba(255,255,255,.075);

    border-radius:21px;

    overflow:hidden;

    margin-top:15px;

    box-shadow:0 9px 28px rgba(0,0,0,.28);
}

.user-info{
    display:flex;
    align-items:center;

    padding:14px 14px 9px;
}

.avatar{
    width:45px;
    height:45px;

    min-width:45px;

    border-radius:50%;

    margin-right:10px;

    object-fit:cover;

    background:
        linear-gradient(
            135deg,
            #7b2cff,
            #00cfff
        );

    border:2px solid rgba(120,75,255,.7);
}

.post-card p{
    padding:5px 14px 13px;

    color:#edf0ff;

    font-size:15px;

    line-height:1.48;
}

.post-photo{
    display:block;

    width:calc(100% - 18px);

    margin:0 9px;

    max-height:600px;

    border-radius:15px;

    object-fit:cover;

    background:#080b16;
}

.post-buttons{
    display:flex;
    align-items:center;

    justify-content:space-around;

    padding:10px 6px;

    border-top:1px solid rgba(255,255,255,.07);
}

.post-buttons button{
    flex:1;

    border:none;

    background:none;

    color:#aeb7d5;

    font-size:13px;
    font-weight:800;

    padding:8px 4px;

    cursor:pointer;

    border-radius:10px;

    transition:.2s;
}

.post-buttons button:hover{
    background:rgba(255,255,255,.05);
    color:#fff;
}

.post-card img{
    max-width:100%;
}

.post-card video{
    width:100%;
    max-height:600px;

    object-fit:cover;
}

/* =========================================================
   FOOTER
   ========================================================= */

.vital-footer{
    display:none;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:min(96%,620px);

    height:68px;

    padding:5px 8px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:rgba(11,14,28,.94);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.10);

    border-radius:23px;

    box-shadow:0 12px 40px rgba(0,0,0,.55);

    z-index:1000;
}

.bottom-nav a{
    position:relative;

    min-width:54px;

    color:#8e96b4;

    text-decoration:none;

    text-align:center;

    font-size:21px;

    padding:5px;

    transition:.2s;
}

.bottom-nav a:hover{
    color:#fff;
}

.bottom-nav small{
    display:block;

    margin-top:3px;

    font-size:9px;

    font-weight:800;
}

.bottom-nav a:first-child{
    color:#8f56ff;
}

.bottom-nav a:first-child::after{
    content:"";

    position:absolute;

    bottom:-5px;
    left:50%;

    transform:translateX(-50%);

    width:28px;
    height:3px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #8b42ff,
            #00d9ff
        );

    box-shadow:0 0 8px #713cff;
}

.create-btn{
    width:57px !important;
    height:57px;

    min-width:57px !important;

    margin-top:-25px;

    border-radius:50% !important;

    display:flex !important;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #7639ff,
            #00cfff,
            #ff28a8
        );

    color:#fff !important;

    font-size:30px !important;

    border:4px solid #080b16;

    box-shadow:0 0 20px rgba(106,54,255,.55);

    text-shadow:0 2px 5px rgba(0,0,0,.3);
}

.create-btn small{
    display:none;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    header{
        height:68px;
        padding:0 9px;
    }

    .menu{
        width:38px;
        height:38px;

        font-size:19px;

        margin-right:4px;
    }

    .logo-star{
        width:34px;
        height:34px;

        font-size:29px;
    }

    .logo{
        font-size:20px;
    }

    .logo-sub{
        font-size:9px;
    }

    .icons{
        gap:5px;
    }

    .header-circle{
        width:38px;
        height:38px;

        font-size:18px;
    }

    .wallet-trigger{
        height:38px;

        padding:0 8px;

        font-size:11px;
    }

    .container{
        padding:79px 8px 18px;
    }

    .stories{
        gap:11px;
    }

    .story-wrap{
        flex-basis:65px;
        width:65px;
    }

    .story{
        width:63px;
        height:63px;
    }

    .story-name{
        font-size:9px;
    }

    .composer{
        border-radius:19px;
    }

    .composer-action{
        font-size:10px;
    }

    .post-card{
        border-radius:18px;
    }

    .post-card p{
        font-size:14px;
    }

    .post-buttons button{
        font-size:12px;
    }

    .bottom-nav{
        bottom:7px;
        height:64px;
        border-radius:21px;
    }

    .create-btn{
        width:53px !important;
        height:53px;

        min-width:53px !important;

        font-size:27px !important;
    }

}

</style>

</head>

<!-- =========================================================
     FRIEND REQUEST SIDEBAR COUNT
     ========================================================= -->

<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const friendRequestBadge =
    document.getElementById(
        "friendRequestBadge"
    );


function updateFriendRequestBadge(
    count
){

    if(!friendRequestBadge){
        return;
    }


    if(count > 0){

        friendRequestBadge.textContent =
            count > 99
                ? "99+"
                : count;

        friendRequestBadge.classList.add(
            "show"
        );

    }else{

        friendRequestBadge.textContent =
            "0";

        friendRequestBadge.classList.remove(
            "show"
        );

    }

}


auth.onAuthStateChanged(
    user => {

        if(!user){

            updateFriendRequestBadge(
                0
            );

            return;
        }


        const requestsQuery =
            query(

                collection(
                    db,
                    "notifications"
                ),

                where(
                    "receiverId",
                    "==",
                    user.uid
                ),

                where(
                    "type",
                    "==",
                    "friend_request"
                )

            );


        onSnapshot(

            requestsQuery,

            snapshot => {

                let count = 0;


                snapshot.forEach(
                    notificationDoc => {

                        const notification =
                            notificationDoc.data();


                        /*
                         * Count pending requests.
                         *
                         * New requests normally have
                         * no requestStatus yet.
                         */

                        if(
                            !notification.requestStatus ||
                            notification.requestStatus ===
                                "pending"
                        ){

                            count++;

                        }

                    }
                );


                updateFriendRequestBadge(
                    count
                );

            },

            error => {

                console.error(
                    "Friend request badge error:",
                    error
                );

                updateFriendRequestBadge(
                    0
                );

            }

        );

    }
);

</script>
