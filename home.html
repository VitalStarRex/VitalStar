<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VitalStar</title>












<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2ff;
}


/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;

    background:linear-gradient(135deg,#1877f2,#7b2ff7);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    color:white;

    z-index:1000;

    box-shadow:0 3px 10px rgba(0,0,0,.2);
}


.logo{
    font-size:24px;
    font-weight:bold;
}


.menu{
    border:none;
    background:none;
    color:white;

    font-size:28px;
    cursor:pointer;
}


.icons{
    display:flex;
    gap:15px;
    font-size:22px;
}


.icons a{
    text-decoration:none;
}


/* SIDEBAR */

.sidebar{

    position:fixed;

    top:0;
    left:-260px;

    width:250px;
    height:100%;

    background:white;

    padding-top:70px;

    transition:.3s;

    box-shadow:2px 0 10px rgba(0,0,0,.2);

    z-index:999;

}



.sidebar a{

    display:block;

    padding:15px 20px;

    text-decoration:none;

    color:#333;

    font-weight:bold;

}


.sidebar a:hover{

    background:#1877f2;

    color:white;

}



/* CONTENT */

.container{

    padding:80px 15px 90px;

}









/* Notification & Message Icons */

.icon{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-link{
    text-decoration: none;
    font-size: 24px;
    color: white;
}

.badge{
    position: absolute;
    top: -6px;
    right: -8px;

    min-width: 18px;
    height: 18px;
    padding: 0 5px;

    background: red;
    color: white;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 11px;
    font-weight: bold;

    border: 2px solid white;
}









</style>

</head>

function openMenu(){

const sidebar=document.getElementById("sidebar");


if(sidebar.style.left==="0px"){

sidebar.style.left="-260px";

}

}

</script>
