<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar - Home</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f2f5;
}

header{
background:#667eea;
color:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{
font-size:28px;
font-weight:bold;
}

.search{
padding:10px;
border:none;
border-radius:20px;
width:40%;
}

.profile{
background:white;
margin:15px;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
background:#667eea;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
color:white;
}

.name{
font-size:24px;
font-weight:bold;
margin-top:10px;
}

.post-box{
background:white;
margin:15px;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

textarea{
width:100%;
height:100px;
padding:10px;
border-radius:10px;
border:1px solid #ccc;
resize:none;
}

button{
margin-top:10px;
padding:12px 20px;
background:#667eea;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.feed{
margin:15px;
}

.post{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.post h3{
color:#667eea;
margin-bottom:10px;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom a{
text-decoration:none;
font-size:24px;
}
</style>
</head>

<body>

<header>
<div class="logo">⭐ VitalStar</div>
<input class="search" placeholder="Search users...">
</header>

<div class="profile">
<div class="avatar">👤</div>
<div class="name">Welcome Back!</div>
<p>Share your thoughts with the world.</p>
</div>

<div class="post-box">
<h3>Create Post</h3>
<textarea placeholder="What's on your mind?"></textarea>
<button>Post</button>
</div>

<div class="feed">

<div class="post">
<h3>VitalStar</h3>
<p>🎉 Welcome to VitalStar! Your new social media platform is now live.</p>
</div>

<div class="post">
<h3>News</h3>
<p>✨ Connect with friends, upload photos and share your amazing moments.</p>
</div>

</div>

<div class="bottom">
<a href="#">🏠</a>
<a href="#">🔍</a>
<a href="#">➕</a>
<a href="#">💬</a>
<a href="#">👤</a>
</div>

</body>
</html>
