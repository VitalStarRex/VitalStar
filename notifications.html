<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Notifications</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2ff;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:linear-gradient(135deg,#1877f2,#7b2ff7);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    z-index:1000;
}

.back{
    position:absolute;
    left:15px;
    color:white;
    text-decoration:none;
    font-size:28px;
}

.container{
    margin-top:75px;
    padding:10px;
}

#notifications{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.loading{
    text-align:center;
    color:#666;
    margin-top:40px;
}
</style>

</head>

<body>

<header>
    <a href="home.html" class="back">←</a>
    🔔 Notifications
</header>

<div class="container">

    <div id="notifications">

        <div class="loading">
            Loading notifications...
        </div>

    </div>

</div>

<script type="module" src="notifications-page.js"></script>

<script type="module" src="auth-guard.js"></script>

</body>
</html>
