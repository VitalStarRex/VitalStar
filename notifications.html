<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Notifications</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(123,47,247,.12),transparent 35%),
    radial-gradient(circle at 90% 30%,rgba(24,119,242,.12),transparent 35%),
    #eef2ff;
  color:#172033;
  padding-bottom:90px;
  min-height:100vh;
}

/* HEADER */
header{
  position:fixed;top:0;left:0;width:100%;height:60px;
  background:linear-gradient(135deg,#1877f2,#7b2ff7);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;z-index:1000;
  box-shadow:0 4px 18px rgba(31,41,55,.22);
  letter-spacing:.3px;
}
.back{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;text-decoration:none;font-size:22px;
  transition:background .2s ease;
}
.back:hover{background:rgba(255,255,255,.15)}

/* CONTAINER */
.container{
  margin-top:60px;
  padding:14px 10px 95px;
  max-width:760px;
  margin-inline:auto;
}
#notifications{display:flex;flex-direction:column;gap:12px}

/* LOADING */
.loading{
  margin:50px auto;
  padding:22px;
  max-width:420px;
  text-align:center;
  color:#687386;
  background:rgba(255,255,255,.75);
  border-radius:18px;
  backdrop-filter:blur(12px);
  font-size:14px;
}

/* CARDS */
.notification,
.notification-card{
  background:rgba(255,255,255,.92);
  border-radius:18px;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 7px 24px rgba(31,41,55,.08);
  transition:transform .2s ease, box-shadow .2s ease;
}
.notification:hover,
.notification-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(31,41,55,.12);
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;height:66px;
  background:rgba(255,255,255,.92);
  display:flex;justify-content:space-around;align-items:center;
  border-top:1px solid rgba(180,190,210,.4);
  backdrop-filter:blur(18px);
}
.bottom-nav a{
  text-decoration:none;color:#596579;
  display:flex;flex-direction:column;align-items:center;
  font-size:20px;gap:2px;
  transition:color .2s ease;
}
.bottom-nav a:hover{color:#1877f2}
.bottom-nav small{font-size:10px}

/* CREATE */
.create{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#1877f2,#7b2ff7);
  color:#fff;display:flex;align-items:center;justify-content:center;
  margin-top:-26px;font-size:26px;
  border:4px solid #eef2ff;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

/* MOBILE */
@media(max-width:480px){
  header{height:58px;font-size:17px}
  .container{margin-top:58px}
  .bottom-nav{height:64px}
}

/* REDUCED MOTION */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>

<body>

<header>
  <a href="home.html" class="back">←</a>
  Notifications
</header>

<div class="container">
  <div id="notifications">
    <div class="loading">Loading notifications...</div>
  </div>
</div>

<div class="bottom-nav">
  <a href="home.html">🏠<small>Home</small></a>
  <a href="users.html">👥<small>Friends</small></a>
  <a href="create-post.html" class="create">➕</a>
  <a href="general-room.html">💬<small>Chat</small></a>
  <a href="profile.html">👤<small>Profile</small></a>
</div>

<script type="module" src="notifications-page.js"></script>
<script type="module" src="auth-guard.js"></script>

</body>
</html>
