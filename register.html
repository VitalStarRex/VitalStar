<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#1877f2;
}

.register-box{
  width:340px;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,.2);
}

.register-box h2{
  text-align:center;
  margin-bottom:20px;
  color:#1877f2;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  background:#1877f2;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#145dbf;
}

p{
  text-align:center;
  margin-top:15px;
}

a{
  color:#1877f2;
  text-decoration:none;
}
</style>

</head>
<body>

<div class="register-box">
  <h2>Create Account</h2>

  <form>
    <input type="text" placeholder="Full Name" required>

    <input type="text" placeholder="Username" required> <input type="email" placeholder="Email" required>

    <input type="password" placeholder="Password" required>

    <input type="password" placeholder="Confirm Password" required>

    <button type="submit">Register</button>
  </form>

  <p>Already have an account?
    <a href="login.html">Login</a>
  </p>
</div>

</body
