
<h1 class="vitalstar-title">VitalStar Register</h1>

<style>
.vitalstar-title {
    font-weight: bold;
    color: yellow;
    background-color: black;
    padding: 10px 20px;
    text-align: center;
    border-radius: 8px;
    font-size: 32px;
}
</style><br/><br/>


<center> <form id="registerForm">  
<br/><br/>
  <input type="text" id="fullname" placeholder="Full Name" required"><br/> <br/>

  <input type="text" id="username" placeholder="Username" required> <input type="text" id="birthday" placeholder="birthday DD/MM/YY" required">

<br/><br/>

<input type="text" id="county" placeholder="County" required">

<br/><br/>
  <input type="email" id="email" placeholder="Email" required><br/><br/>

  <input type="password" id="password" placeholder="Password" required><br/><br/>

  <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
<br/><br/>
  <br/><button type="submit">Register</button>
</form><center/></center><script type="module">
import { auth, db } from "./firebase.js";

import {
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const form = document.getElementById("registerForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match!");
    return;
  }

  try {

  const fullname = document.getElementById("fullname").value;
  const username = document.getElementById("username").value;

  const userCredential = await createUserWithEmailAndPassword(auth, email, password);

  await setDoc(doc(db, "users", userCredential.user.uid), {
    fullname: fullname,
    username: username,
    email: email
  });

  alert("Registration successful!");
  window.location.href = "login.html";

} catch (error) {
  alert(error.message);
}
});
         </script>
