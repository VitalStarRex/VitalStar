<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#080020,#19004d,#00334d,#51004d);background-size:300% 300%;animation:neonBackground 12s ease infinite}
@keyframes neonBackground{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{width:100%;max-width:390px;padding:27px 25px;border:1px solid #00f0ff;border-radius:18px;background:rgba(8,5,30,.92);box-shadow:0 0 14px #00eaff,0 0 34px rgba(180,0,255,.65)}
h1{text-align:center;margin:0 0 20px;color:#00f0ff;text-shadow:0 0 12px #00eaff}
.field{margin-bottom:13px}
input:not([type=checkbox]){width:100%;padding:13px 14px;border:1px solid #a64dff;border-radius:9px;background:#10082b;color:#fff;font-size:15px;outline:none}
input::placeholder{color:#bdb2d4}
input:focus{border-color:#00f0ff;box-shadow:0 0 10px #00cfff}
.hint{display:block;margin:5px 2px 0;color:#9fefff;font-size:11px}
.password-wrap{position:relative}
.password-wrap input{padding-right:75px!important}
.toggle{position:absolute;right:8px;top:7px;width:auto;padding:6px 9px;border:1px solid #00f0ff;border-radius:7px;background:transparent;color:#00f0ff;font-size:12px;cursor:pointer}
.terms{display:flex;align-items:flex-start;gap:9px;margin:7px 0 17px;color:#e8e0f8;font-size:13px;line-height:1.5}
.terms input{width:17px;height:17px;margin:2px 0 0;flex-shrink:0;accent-color:#00dfff}
.terms a{color:#00f0ff;font-weight:bold;text-decoration:none}
.main-btn{width:100%;padding:13px;border:0;border-radius:9px;background:linear-gradient(90deg,#00dfff,#9b28ff,#ff20b8);color:white;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 0 14px #00bfff}
.main-btn:hover{filter:brightness(1.12)}
.main-btn:disabled{opacity:.65;cursor:wait}
.footer{text-align:center;margin:18px 0 0;color:#e4d9ff;font-size:14px}
.footer a{color:#00f0ff;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="container">
  <h1>✦ VitalStar Register ✦</h1>
  <form id="registerForm">
    <div class="field">
      <input type="text" id="fullName" placeholder="Nick Name / Full Name" maxlength="20" autocomplete="name" required>
      <small class="hint">Maximum 20 characters</small>
    </div>
    <div class="field">
      <input type="text" id="username" placeholder="Username" maxlength="15" autocomplete="username" required>
      <small class="hint">Maximum 15 characters</small>
    </div>
    <div class="field">
      <input type="email" id="email" placeholder="Email" autocomplete="email" required>
    </div>
    <div class="field password-wrap">
      <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
      <button class="toggle" type="button" data-target="password">Show</button>
    </div>
    <div class="field password-wrap">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>
      <button class="toggle" type="button" data-target="confirmPassword">Show</button>
    </div>
    <div class="terms">
      <input type="checkbox" id="agreeTerms" required>
      <label for="agreeTerms">I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</label>
    </div>
    <button type="submit" id="registerBtn" class="main-btn">Register</button>
  </form>
  <p class="footer">Already have an account? <a href="login.html">Login</a></p>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("registerForm");
const registerBtn = document.getElementById("registerBtn");
const agreeTerms = document.getElementById("agreeTerms");

document.querySelectorAll(".toggle").forEach((button) => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.target);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    button.textContent = show ? "Hide" : "Show";
  });
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value.trim();
  const username = document.getElementById("username").value.trim().toLowerCase();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (fullName.length > 20) {
    alert("Nickname / Full Name must not exceed 20 characters.");
    return;
  }
  if (username.length > 15) {
    alert("Username must not exceed 15 characters.");
    return;
  }
  if (!agreeTerms.checked) {
    alert("Please agree to the Terms of Service and Privacy Policy.");
    return;
  }
  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  // Prevent double taps from triggering multiple signups.
  registerBtn.disabled = true;
  registerBtn.textContent = "Registering...";

  try {
    const q = query(collection(db, "users"), where("username", "==", username));
    const snap = await getDocs(q);

    if (!snap.empty) {
      alert("Username already exists.");
      return;
    }

    const cred = await createUserWithEmailAndPassword(auth, email, password);

    // Keep the existing Firestore user fields and signup flow.
    await setDoc(doc(db, "users", cred.user.uid), {
      uid: cred.user.uid,
      fullName: fullName,
      username: username,
      email: email,
      profilePic: "default.png",
      bio: "",
      online: true,
      lastSeen: serverTimestamp(),
      createdAt: serverTimestamp(),
      agreedToTerms: true,
      termsAgreedAt: serverTimestamp()
    });

    alert("Registration successful!");
    window.location.href = "edit-profile.html";
  } catch (error) {
    alert(error.message);
  } finally {
    registerBtn.disabled = false;
    registerBtn.textContent = "Register";
  }
});
</script>
</body>
</html>
