<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - VitalStar</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
}

.header{
    background:#1877f2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.chat-list{
    padding:10px;
}

.chat{
    display:flex;
    align-items:center;
    background:#fff;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.chat:hover{
    background:#f7f7f7;
}

.avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    margin-right:12px;
}

.info{
    flex:1;
}

.name{
    font-weight:bold;
    font-size:18px;
}

.last{
    color:gray;
    font-size:14px;
}

.time{
    font-size:12px;
    color:gray;
}
</style>

</head>
<body>

<div class="header">
💬 Messages
</div>

<div class="chat-list">

<div class="chat" onclick="location.href='chat.html'">
<div class="avatar">A</div>

<div class="info">
<div class="name">Alex</div>
<div class="last">Hello! How are you?</div>
</div>

<div class="time">2m</div>
</div>

<div class="chat">
<div class="avatar">J</div>

<div class="info">
<div class="name">John</div>
<div class="last">See you tomorrow.</div>
</div>

<div class="time">1h</div>
</div>

<div class="chat">
<div class="avatar">M</div>

<div class="info">
<div class="name">Mary</div>
<div class="last">Thanks 😊</div>
</div>

<div class="time">Yesterday</div>

<script type="module" src="auth-guard.js"></script>


</div>

</div>

</body>
</html>
