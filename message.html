<!DOCTYPE html>
<html>
<head>
    <title>Messages - VitalStar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: purple;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: 900;
        }

        .message-list {
            padding: 10px;
        }

        .message-card {
            background: white;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .message-card:hover {
            background: #eee;
            transform: scale(1.02);
        }

        .profile-picture {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
            border: 3px solid purple;
        }

        .message-info {
            flex: 1;
        }

        .name {
            font-size: 20px;
            font-weight: 900;
            color: purple;
        }

        .last-message {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .time {
            font-size: 14px;
            font-weight: bold;
            color: purple;
            margin-top: 5px;
        }

    </style>

</head>

<body>

<div class="header">
    Messages
</div>


<div id="messageList" class="message-list">
    Loading messages...
</div>


<script type="module" src="message.js"></script>



<script type="module" src="presence.js"></script>














</body>
</html>
