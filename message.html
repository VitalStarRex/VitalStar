<!DOCTYPE html>
<html>
<head>
    <title>Messages - VitalStar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: purple;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .message-list {
            padding: 10px;
        }

        .message-card {
            background: white;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
        }

        .message-card:hover {
            background: #eee;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
            color: purple;
        }

        .last-message {
            color: #555;
            margin-top: 5px;
        }

        .time {
            font-size: 12px;
            color: gray;
            float: right;
        }
    </style>
</head>

<body>

<div class="header">
    Messages
</div>

<div id="messageList" class="message-list">
    Loading messages...
</div>


<script type="module" src="message.js"></script>

</body>
</html>
