<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Users</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
}

.header{
    background:#1877f2;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

#usersList{
    padding:10px;
}

.user{
    display:flex;
    align-items:center;
    background:white;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
    margin-right:12px;
}

.info{
    flex:1;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.status{
    color:gray;
    font-size:14px;
}
</style>

</head>
<body>

<div class="header">
👥 VitalStar Users
</div>

<div id="usersList"></div>

<script type="module" src="users.js"></script>
   

<script type="module" src="auth-guard.js"></script>
</body>
</html>
