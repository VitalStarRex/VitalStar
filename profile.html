<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VitalStar Profile</title>

<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>

<style>
:root[data-theme="dark"]{
    --vs-bg:#050b1f;
    --vs-text:#ffffff;
    --vs-text-soft:#dbe6ff;
    --vs-muted:#a9bbe6;
    --vs-dim:#8396c4;

    --vs-card:linear-gradient(160deg,rgba(14,30,78,.88),rgba(6,14,42,.94));
    --vs-card-solid:#0a1634;
    --vs-card-border:rgba(70,120,255,.42);
    --vs-card-glow:0 0 0 1px rgba(0,190,255,.08),0 0 22px rgba(30,90,255,.22);

    --vs-line:rgba(90,130,255,.20);
    --vs-hover:rgba(60,110,255,.12);
    --vs-chip:rgba(14,30,78,.85);
    --vs-chip-hover:rgba(40,80,200,.45);
    --vs-input:rgba(10,22,60,.9);

    --vs-nav-bg:rgba(7,16,46,.93);
    --vs-shadow:0 12px 40px rgba(0,0,0,.55);

    --vs-glow-1:rgba(0,120,255,.22);
    --vs-glow-2:rgba(0,200,255,.14);
    --vs-glow-3:rgba(40,70,255,.22);

    --vs-cyan:#19c8ff;
    --vs-purple:#4d8dff;
    --vs-green:#32df72;
    --vs-gold:#ffc83a;
    --vs-danger:#ff2d55;

    --vs-heading:linear-gradient(90deg,#ffffff,#19c8ff);
    --vs-brand-grad:linear-gradient(135deg,#6a3cff,#19c8ff);
    --vs-plus-grad:linear-gradient(135deg,#1a5dff,#7a3cff);
    --vs-plus-shadow:0 0 22px rgba(40,110,255,.75);
    --vs-ring-gap:#050b1f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{ scroll-behavior:smooth; }

body{
    background:var(--vs-bg);
    color:var(--vs-text);
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        radial-gradient(circle at 15% 10%,var(--vs-glow-1),transparent 28%),
        radial-gradient(circle at 90% 20%,var(--vs-glow-2),transparent 28%),
        radial-gradient(circle at 50% 100%,var(--vs-glow-3),transparent 32%);
}

.profile-page{
    width:100%;
    max-width:900px;
    margin:0 auto;
}

/* COVER + PROFILE PICTURE */
.cover-container{
    position:relative;
    width:85%;
    margin:0 auto;
    background:var(--vs-card-solid,#0a1634);
    border-bottom:1px solid var(--vs-card-border);
}

.cover-photo{
    display:block;
    width:100%;
    height:190px;
    object-fit:cover;
    background:var(--vs-input);
}

.profile-image-box{
    position:absolute;
    left:50%;
    bottom:-75px;
    transform:translateX(-50%);
    width:150px;
    height:150px;
    padding:5px;
    border-radius:50%;
    background:linear-gradient(135deg,#0066ff,#19c8ff,#7a3cff);
    box-shadow:0 0 15px rgba(0,102,255,.8),0 0 35px rgba(25,200,255,.35);
}

.profile-picture{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    background:var(--vs-input);
    border:4px solid var(--vs-ring-gap,#050b1f);
}

/* PROFILE INFORMATION */
.profile-info{
    max-width:850px;
    margin:88px auto 0;
    padding:20px 14px;
    text-align:center;
}

#fullName{
    font-size:28px;
    font-weight:900;
    color:var(--vs-text);
    overflow-wrap:anywhere;
}

:root[data-theme="dark"] #fullName{
    text-shadow:0 0 10px rgba(25,140,255,.6);
}

.username{
    margin:8px 0 18px;
    color:var(--vs-dim);
    font-weight:700;
}

.details{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin:15px 0;
}

.details p{
    padding:9px 13px;
    border-radius:20px;
    background:var(--vs-chip);
    border:1px solid var(--vs-line);
    color:var(--vs-text-soft);
    font-size:14px;
}

.bio{
    max-width:650px;
    margin:20px auto;
    color:var(--vs-text-soft);
    line-height:1.6;
    overflow-wrap:anywhere;
}

/* LOADING INDICATOR */
.vs-loader-slot:empty{ display:none; }

.vs-mini-loader{
    display:flex;
    justify-content:center;
    padding:6px 0 12px;
}

.vs-mini-pill{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:8px 16px 8px 9px;
    border-radius:999px;
    background:var(--vs-card);
    border:1px solid var(--vs-card-border);
    box-shadow:0 0 16px rgba(30,110,255,.25);
}

.vs-mini-ring{
    position:relative;
    width:30px;
    height:30px;
    flex:0 0 30px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.vs-mini-ring::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2.5px solid rgba(120,160,255,.18);
    border-top-color:var(--vs-cyan);
    border-right-color:var(--vs-purple);
    animation:vsMiniSpin .8s linear infinite;
}

.vs-mini-ring span{
    font-size:9.5px;
    font-weight:900;
    color:var(--vs-text);
    animation:vsMiniPulse 1.3s ease-in-out infinite;
}

.vs-mini-text{
    color:var(--vs-text-soft);
    font-size:12.5px;
    font-weight:800;
    white-space:nowrap;
}

.vs-mini-text i{
    font-style:normal;
    animation:vsMiniDots 1.2s ease-in-out infinite;
}

.vs-mini-text i:nth-child(2){ animation-delay:.2s; }
.vs-mini-text i:nth-child(3){ animation-delay:.4s; }

@keyframes vsMiniSpin{ to{ transform:rotate(360deg); } }
@keyframes vsMiniPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes vsMiniDots{ 0%,20%{ opacity:.2; } 50%{ opacity:1; } 80%,100%{ opacity:.2; } }

/* STATS */
.stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
    margin:25px auto;
}

.stats > div{
    min-width:100px;
    padding:14px;
    border-radius:16px;
    background:var(--vs-card);
    border:1px solid var(--vs-card-border);
    box-shadow:var(--vs-card-glow);
}

.stats h2{
    color:var(--vs-text);
    font-size:23px;
}

.stats span{
    color:var(--vs-dim);
    font-size:13px;
    font-weight:700;
}

/* PROFILE BUTTONS — ALWAYS CENTERED */
.buttons{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    max-width:420px;
    margin:25px auto;
}

.buttons button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:calc(50% - 5px);
    max-width:200px;
    min-width:0;
    min-height:52px;
    padding:10px 4px;
    border:1px solid transparent;
    border-radius:14px;
    cursor:pointer;
    color:#fff;
    font-size:clamp(10px,3vw,14px);
    font-weight:800;
    white-space:nowrap;
    background:linear-gradient(135deg,#005eff,#19c8ff);
    box-shadow:0 0 12px rgba(0,102,255,.35),0 4px 12px rgba(0,0,0,.3);
    transition:transform .2s,box-shadow .2s,opacity .2s;
}

.buttons button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 18px rgba(0,140,255,.6),0 5px 18px rgba(0,0,0,.4);
}

.buttons button:active{ transform:scale(.96); }
.buttons button:disabled{ opacity:.6; cursor:default; transform:none; }

#followBtn{ background:linear-gradient(135deg,#3d6bff,#7a3cff); }
#messageBtn{ background:linear-gradient(135deg,#008cff,#00c6ff); }
#editProfileBtn{ background:linear-gradient(135deg,#ffb300,#ff5e00); }

/* FRIEND BUTTON STATES */
#friendBtn.friend-add{
    background:linear-gradient(135deg,#071a38,#102f66);
    border-color:#168cff;
}

#friendBtn.friend-remove{
    background:linear-gradient(135deg,#3b0b19,#66152b);
    border-color:#ff4d6d;
}

#friendBtn.friend-pending{
    background:linear-gradient(135deg,#3d2a00,#664800);
    border-color:#ffc107;
}

#friendBtn.friend-accept{
    background:linear-gradient(135deg,#063d25,#087044);
    border-color:#00ff88;
}

/* POSTS */
.posts-section{
    max-width:850px;
    margin:10px auto;
    padding:20px 12px;
}

.posts-section h2{
    margin-bottom:18px;
    text-align:center;
    color:var(--vs-text);
}

#gallery{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.post-card{
    position:relative;
    width:100%;
    padding:16px;
    border-radius:20px;
    overflow:hidden;
    background:var(--vs-card);
    border:1px solid var(--vs-card-border);
    box-shadow:var(--vs-card-glow);
    color:var(--vs-text);
}

.post-card::before{
    content:"";
    position:absolute;
    top:0;
    left:15%;
    width:70%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,217,255,.6),rgba(77,141,255,.7),transparent);
}

.post-card .post-text{
    line-height:1.6;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
}

.post-card img,
.post-card video{
    display:block;
    width:100%;
    max-height:450px;
    margin-top:12px;
    object-fit:cover;
    border-radius:14px;
    background:#000;
}

.view-more-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:calc(100% - 30px);
    max-width:420px;
    margin:10px auto 20px;
    padding:13px 20px;
    border:1px solid #168cff;
    border-radius:14px;
    background:linear-gradient(135deg,#071a38,#102f66);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 0 16px rgba(22,140,255,.2);
}

.view-more-btn:disabled{ opacity:.7; cursor:default; }

.vs-note{
    width:100%;
    padding:40px 20px;
    text-align:center;
    color:var(--vs-dim);
}

.vs-private{
    width:100%;
    max-width:500px;
    margin:30px auto;
    padding:35px 20px;
    text-align:center;
    border-radius:22px;
    background:var(--vs-card);
    border:1px solid var(--vs-card-border);
    box-shadow:var(--vs-card-glow);
    color:var(--vs-text);
}

.vs-private .lock{ font-size:55px; margin-bottom:15px; }
.vs-private h2{ margin:0 0 10px; color:var(--vs-text); }
.vs-private p{ color:var(--vs-muted); line-height:1.6; }
.vs-private p.small{ margin-top:12px; color:var(--vs-dim); font-size:13px; }

/* BOTTOM NAVIGATION */
.bottom-nav{
    position:fixed;
    left:50%;
    bottom:calc(10px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:min(96%,620px);
    height:68px;
    padding:5px 8px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:var(--vs-nav-bg);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--vs-card-border);
    border-radius:24px;
    box-shadow:var(--vs-shadow);
    z-index:1000;
}

:root[data-theme="dark"] .bottom-nav{
    border-color:rgba(70,130,255,.55);
    box-shadow:0 0 18px rgba(30,100,255,.3),0 12px 40px rgba(0,0,0,.55);
}

.bottom-nav a{
    position:relative;
    flex:1;
    min-width:0;
    padding:5px 2px;
    color:var(--vs-dim);
    text-decoration:none;
    text-align:center;
    font-size:22px;
    transition:.2s;
}

.bottom-nav a:hover{ color:var(--vs-text); }

.bottom-nav small{
    display:block;
    margin-top:3px;
    font-size:10px;
    font-weight:800;
}

.bottom-nav a.active{ color:var(--vs-purple); }

.bottom-nav a.active::after{
    content:"";
    position:absolute;
    bottom:-5px;
    left:50%;
    transform:translateX(-50%);
    width:30px;
    height:3px;
    border-radius:10px;
    background:linear-gradient(90deg,#3d7bff,#19c8ff);
    box-shadow:0 0 8px #2f7bff;
}

.bottom-nav .coin-link .vs-coin{ display:block; margin:0 auto; }

.bottom-nav a.create-btn{
    flex:0 0 62px;
    width:62px;
    height:62px;
    margin-top:-30px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:4px solid var(--vs-ring-gap,#050b1f);
    background:var(--vs-plus-grad);
    box-shadow:var(--vs-plus-shadow);
    color:#fff;
    font-size:34px;
    font-weight:300;
}

.bottom-nav a.create-btn:active{ transform:scale(.92); }

.vitalstar-plus-locked{
    opacity:.45 !important;
    pointer-events:none !important;
    filter:grayscale(.7) !important;
    cursor:not-allowed !important;
}

.vitalstar-plus-unlocked{
    transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}

/* SMALL PHONES */
@media(max-width:600px){
    .cover-photo{ height:210px; }
    .profile-image-box{ width:125px; height:125px; bottom:-62px; }
    .profile-info{ margin-top:75px; padding:15px 10px; }
    #fullName{ font-size:24px; }
    .stats{ gap:8px; }
    .stats > div{ min-width:84px; padding:10px; }

    .buttons{
        justify-content:center;
        gap:8px;
    }

    .buttons button{
        width:calc(50% - 4px);
        min-height:48px;
        padding:9px 2px;
        font-size:clamp(9px,2.8vw,12px);
    }

    .bottom-nav{ height:64px; border-radius:21px; }

    .bottom-nav a.create-btn{
        flex-basis:56px;
        width:56px;
        height:56px;
        margin-top:-28px;
        font-size:30px;
    }
}

@media(prefers-reduced-motion:reduce){
    .vs-mini-ring::before,
    .vs-mini-ring span,
    .vs-mini-text i{ animation:none; }
}
</style>
</head>

<body>

<div class="profile-page">

    <div class="cover-container">

        <img
            id="coverPhoto"
            src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1200' height='350'%3E%3Crect width='1200' height='350' fill='%230a1634'/%3E%3C/svg%3E"
            class="cover-photo"
            alt="Cover photo"
        >

        <div class="profile-image-box">

            <img
                id="profilePicture"
                src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Crect width='200' height='200' fill='%23151a2d'/%3E%3Ccircle cx='100' cy='78' r='38' fill='%237c35ff'/%3E%3Cpath d='M35 180C42 130 70 112 100 112C130 112 158 130 165 180Z' fill='%2300cfff'/%3E%3C/svg%3E"
                class="profile-picture"
                alt="Profile picture"
            >

        </div>

    </div>

    <div class="profile-info">

        <div id="profileLoading" class="vs-loader-slot"></div>

        <h1 id="fullName">Loading...</h1>

        <p class="username" id="username">@username</p>

        <div class="details">
            <p id="country">🌍 Country</p>
            <p id="dob">🎂 Birthday</p>
            <p id="gender">🚻 Gender</p>
            <p id="rank">🏅 Member</p>
            <p id="lastSeen">🟢 Online</p>
        </div>

        <p id="bio" class="bio">No bio yet.</p>

        <div class="stats">

            <div>
                <h2 id="posts">0</h2>
                <span>Posts</span>
            </div>

            <div>
                <h2 id="followers">0</h2>
                <span>Followers</span>
            </div>

            <div>
                <h2 id="following">0</h2>
                <span>Following</span>
            </div>

        </div>

        <div class="buttons">
            <button id="editProfileBtn">✏ Edit Profile</button>
            <button id="friendBtn" class="friend-add">👥 Add Friend</button>
            <button id="followBtn">➕ Follow</button>
            <button id="messageBtn">💬 Message</button>
        </div>

    </div>

    <div class="posts-section">
        <h2>Posts</h2>
        <div id="gallery"></div>
    </div>

</div>

<nav class="bottom-nav">

    <a href="home.html">
        🏠
        <small>Home</small>
    </a>

    <a href="users.html">
        🔎
        <small>Explore</small>
    </a>

    <a href="create-post.html" class="create-btn" id="createPostBtn" aria-label="Create Post">+</a>

    <a href="wallet.html" class="coin-link">
        <i class="vs-coin big"></i>
        <small>Coins</small>
    </a>

    <a href="profile.html" class="active">
        👤
        <small>Profile</small>
    </a>

</nav>

<script type="module" src="profile.js"></script>
<script type="module" src="presence.js"></script>
<script type="module" src="follow.js"></script>

</body>
</html>
