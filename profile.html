<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Profile</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<header class="cover">
  <img id="coverPhoto" src="https://via.placeholder.com/1200x260" alt="Cover Photo">
</header>

<main class="profile-card">
  <img id="profilePicture" src="https://via.placeholder.com/150" alt="Profile Picture" class="avatar">

  <h1 id="fullName">Loading...</h1>
  <p id="username">@username</p>
  <p id="bio">No bio yet.</p>
  <p id="dob"></p>

  <section class="stats">
    <div><h3 id="posts">0</h3><span>Posts</span></div>
    <div><h3 id="followers">0</h3><span>Followers</span></div>
    <div><h3 id="following">0</h3><span>Following</span></div>
  </section>

  <div class="actions">
    <button id="editProfileBtn">Edit Profile</button>
    <button id="followBtn">Follow</button>
    <button id="messageBtn">Message</button>
  </div>

  <section class="photos">
    <h2>Photos</h2>
    <div id="gallery" class="gallery"></div>
  </section>
</main>

<script type="module" src="profile.js"></script>
</body>
</html>
