<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Profile</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="profile-page">

<div class="cover-container">
<img id="coverPhoto" src="https://via.placeholder.com/1200x350" class="cover-photo">

<div class="profile-image-box">
<img id="profilePicture" src="https://via.placeholder.com/180" class="profile-picture">
</div>
</div>

<div class="profile-info">

<h1 id="fullName">Loading...</h1>

<p class="username" id="username">@username</p>

<div class="details">

<p id="country">🌍 Country</p>

<p id="dob">🎂 Birthday</p>

</div>

<p id="bio" class="bio">
No bio yet.
</p>

<div class="stats">

<div>
<h2 id="posts">0</h2>
<span>Posts</span>
</div>

<div>
<h2 id="followers">0</h2>
<span>Followers</span>
</div>

<div>
<h2 id="following">0</h2>
<span>Following</span>
</div>

</div>

<div class="buttons">

<button id="editProfileBtn">
✏ Edit Profile
</button>

<button id="followBtn">
➕ Follow
</button>

<button id="messageBtn">
💬 Message
</button>

</div>

</div>

<div class="posts-section">

<h2>Posts</h2>

<div id="gallery"></div>

</div>

</div>

<script type="module" src="profile.js"></script>

</body>
</html>
