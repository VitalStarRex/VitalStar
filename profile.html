<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
}

.cover{
    height:220px;
    background:linear-gradient(135deg,#1877f2,#6a11cb);
}

.profile-box{
    max-width:700px;
    margin:-70px auto 20px;
    background:#fff;
    border-radius:15px;
    text-align:center;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.profile-box img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
}

.profile-box h2{
    margin-top:15px;
    color:#222;
}

.username{
    color:#666;
    margin:5px 0;
}

.bio{
    margin:15px 0;
    color:#555;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin:25px 0;
}

.stats div{
    text-align:center;
}

.stats h3{
    color:#1877f2;
}

.btns{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
}

.follow{
    background:#1877f2;
    color:white;
}

.message{
    background:#42b72a;
    color:white;
}

.photos{
    margin-top:30px;
}

.photos h3{
    margin-bottom:15px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.gallery img{
    width:100%;
    border-radius:10px;
    height:120px;
    object-fit:cover;
}
</style>

</head>
<body>

<div class="cover"></div>

<div class="profile-box">

<img src="https://via.placeholder.com/150" alt="Profile">

<h2>Christian Ameh</h2>

<p class="username">@vitalstar</p>

<p class="bio">
💙 Dream Big • Build Bigger • Welcome to my VitalStar profile.
</p>

<div class="stats">
<div>
<h3 id="posts">0</h3>
<p>Posts</p>
</div>

<div>
<h3 id="followers">0</h3>
<p>Followers</p>
</div>

<div>
<h3 id="following">0</h3>
<p>Following</p>
</div>
</div>

<div class="btns">
<button class="follow">Follow</button>
<button class="message">Message</button>
</div>

<div class="photos">
<h3>Photos</h3>

<div class="gallery">
<img src="https://picsum.photos/200?1">
<img src="https://picsum.photos/200?2">
<img src="https://picsum.photos/200?3">
<img src="https://picsum.photos/200?4">
<img src="https://picsum.photos/200?5">
<img src="https://picsum.photos/200?6">
</div>

</div>

</div>
<script type="module" src="profile.js"></script>

</body>
</html>
