<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Profile</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="profile-page">

<div class="cover-container">
<img id="coverPhoto" src="https://via.placeholder.com/1200x350" class="cover-photo">

<div class="profile-image-box">
<img id="profilePicture" src="https://via.placeholder.com/180" class="profile-picture">
</div>
</div>

<div class="profile-info">

<h1 id="fullName">Loading...</h1>

<p class="username" id="username">@username</p>

<div class="details">
<p id="country">🌍 Country</p>
<p id="dob">🎂 Birthday</p>
<p id="gender">🚻 Gender</p>
<p id="rank">🏅 Member</p>
<p id="lastSeen">🟢 Online</p>
</div>

<p id="bio" class="bio">No bio yet.</p>

<div class="stats">
<div><h2 id="posts">0</h2><span>Posts</span></div>
<div><h2 id="followers">0</h2><span>Followers</span></div>
<div><h2 id="following">0</h2><span>Following</span></div>
</div>

<div class="buttons">
<button id="editProfileBtn">✏ Edit Profile</button>
<button id="followBtn">➕ Follow</button>
<button id="messageBtn">💬 Message</button>
</div>

</div>

<div class="posts-section">
<h2>Posts</h2>
<div id="gallery"></div>
</div>

</div>

<!-- Bottom Navigation -->
<div style="
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:#d9d9d9;
border-top:1px solid #bfbfbf;
display:flex;
justify-content:space-evenly;
align-items:center;
z-index:1000;
box-shadow:0 -2px 8px rgba(0,0,0,.15);
">
<a href="home.html" style="text-decoration:none;color:#222;display:flex;flex-direction:column;align-items:center;font-size:30px;font-weight:bold;"><span>🏠</span><span style="font-size:16px;font-weight:900;">Home</span></a>
<a href="users.html" style="text-decoration:none;color:#222;display:flex;flex-direction:column;align-items:center;font-size:30px;font-weight:bold;"><span>👥</span><span style="font-size:16px;font-weight:900;">Friends</span></a>
<a href="create-post.html" style="width:60px;height:60px;background:#1877f2;color:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;text-decoration:none;font-size:36px;font-weight:bold;margin-top:-28px;box-shadow:0 4px 12px rgba(0,0,0,.3);">➕</a>
<a href="general-room.html" style="text-decoration:none;color:#222;display:flex;flex-direction:column;align-items:center;font-size:30px;font-weight:bold;"><span>💬</span><span style="font-size:16px;font-weight:900;">Chat</span></a>
<a href="profile.html" style="text-decoration:none;color:#222;display:flex;flex-direction:column;align-items:center;font-size:30px;font-weight:bold;"><span>👤</span><span style="font-size:16px;font-weight:900;">Profile</span></a>
</div>

<script type="module" src="profile.js"></script>
 

<script type="module" src="presence.js"></script>

<script type="module" src="follow.js"></script>



</body>
</html>
