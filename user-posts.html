<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Posts</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
      color: #111827;
      line-height: 1.5;
    }

    .page {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
    }

    .page-title {
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    #posts {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef0f3;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 14px;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #e5e7eb;
    }

    .author {
      font-weight: 600;
      font-size: 14px;
      color: #111827;
    }

    .username {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }

    .post-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }

    .post-content {
      padding: 0 14px 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      color: #1f2937;
    }

    .post-media {
      width: 100%;
      display: block;
      max-height: 600px;
      object-fit: cover;
      background: #000;
    }

    .post-actions {
      display: flex;
      border-top: 1px solid #eef0f3;
      padding: 6px 10px;
      background: #fafafa;
    }

    .post-actions button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 10px 6px;
      cursor: pointer;
      font-size: 14px;
      color: #374151;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .post-actions button:hover {
      background: #f3f4f6;
    }

    .empty {
      background: #ffffff;
      padding: 32px;
      text-align: center;
      border-radius: 12px;
      color: #6b7280;
      border: 1px solid #eef0f3;
    }

    .loading {
      text-align: center;
      padding: 32px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="page-title">
      Posts
    </div>

    <div id="posts">
      <div class="loading">Loading posts...</div>
    </div>

  </main>

  <script type="module" src="./user-posts.js"></script>

</body>
</html>
