<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalStar Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
}

.cover{
    position:relative;
    width:100%;
    height:250px;
    overflow:hidden;
    background:#1877f2;
}

#coverPhoto{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-box{
    max-width:700px;
    margin:-70px auto 20px;
    background:#fff;
    border-radius:15px;
    text-align:center;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

#profilePicture{
    width:150px;
    height:150px;
    border-radius:50%;
    border:5px solid #fff;
    object-fit:cover;
    background:#ddd;
}

#fullName{
    margin-top:15px;
    color:#222;
}

#username{
    color:#666;
    margin-top:5px;
}

#bio{
    margin:15px 0;
    color:#555;
}

#dob{
    color:#777;
    margin-bottom:15px;
}




.stats{
    display:flex;
    justify-content:space-around;
    margin:25px 0;
}

.stats div{
    text-align:center;
}

.stats h3{
    color:#1877f2;
}

.btns{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
}

.follow{
    background:#1877f2;
    color:white;
}

.message{
    background:#42b72a;
    color:white;
}

.edit{
    background:#555;
    color:white;
}

.photos{
    margin-top:30px;
}

.photos h3{
    margin-bottom:15px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.gallery img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:10px;
}


<script type="module" src="auth-guard.js"></script>

</style>
</head>

<body>
