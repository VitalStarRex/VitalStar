<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:30px;
    width:300px;
    border-radius:15px;
    text-align:center;
}

input{
    width:90%;
    padding:12px;
    margin:10px;
}

button{
    width:95%;
    padding:12px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
}

a{
    color:#667eea;
}
</style>

</head>

<body>

<div class="box">

<h2>Login</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyDIePnptlh5c4q9RSPZJ8pYLAYNswNHgCs",
  authDomain: "mysocialapp-87ea4.firebaseapp.com",
  projectId: "mysocialapp-87ea4",
  storageBucket: "mysocialapp-87ea4.firebasestorage.app",
  messagingSenderId: "164883751409",
  appId: "1:164883751409:web:b7ccfcc42dfc06783fe450",
  measurementId: "G-6L9PV3CRT3"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.login = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;


signInWithEmailAndPassword(auth,email,password)

.then(() => {
alert("Login successful!");
window.location.href="home.html";
})

.catch((error)=>{
alert(error.message);
});

}

</script>

</body>
</html>
