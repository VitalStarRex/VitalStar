<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - VitalStar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f2f5;
}

.container{
    max-width:500px;
    margin:30px auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#1877f2;
}

.profile-section{
    text-align:center;
    margin-bottom:25px;
}

.profile-section img{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #1877f2;
    margin-bottom:10px;
}

.profile-section input{
    display:none;
}

.profile-section label{
    background:#1877f2;
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    display:inline-block;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:vertical;
    min-height:90px;
}

button{
    width:100%;
    padding:14px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#166fe5;
}
</style>

</head>
<body>

<div class="container">

<h1>Edit Profile</h1>

<div class="profile-section">
<img id="profilePreview" src="default-avatar.png">

<input
type="file"
id="profileImage"
accept="image/*">

<label for="profileImage">
Change Profile Picture
</label>
</div>

<form id="editProfileForm">

<div class="form-group">
<label>Full Name</label>
<input
type="text"
id="fullName"
placeholder="Enter your full name">
</div>

<div class="form-group">
<label>Username</label>
<input
type="text"
id="username"
placeholder="Enter username">
</div>

<div class="form-group">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter email">
</div>

<div class="form-group">
<label>Date of Birth</label>
<input
type="date"
id="dob">
</div>

<div class="form-group">
<label>New Password</label>
<input
type="password"
id="password"
placeholder="Leave empty if you don't want to change it">
</div>

<div class="form-group">
<label>Bio</label>
<textarea
id="bio"
placeholder="Tell people about yourself"></textarea>
</div>

<button type="submit">
Save Changes
</button>

</form>

</div>

<script>
const profileImage=document.getElementById("profileImage");
const preview=document.getElementById("profilePreview");

profileImage.addEventListener("change",function(){

const file=this.files[0];

if(file){

preview.src=URL.createObjectURL(file);

}

});

document.getElementById("editProfileForm").addEventListener("submit",function(e){

e.preventDefault();

alert("Profile saved successfully!");

});
</script>


<script type="module" src="edit-profile.js"></script>



</body>
</html>
