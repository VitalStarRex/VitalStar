<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage Posts</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f8}
header{background:#6a1b9a;color:#fff;padding:15px;text-align:center}
#search{width:90%;max-width:700px;margin:15px auto;display:block;padding:10px}
#posts{max-width:900px;margin:auto;padding:10px}
.post{background:#fff;border-radius:10px;padding:12px;margin:12px 0;box-shadow:0 2px 5px rgba(0,0,0,.15)}
.post img{max-width:100%;border-radius:8px}
button{background:#d32f2f;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
</style></head>
<body>
<header><h2>Manage Posts</h2></header>
<input id="search" placeholder="Search posts...">
<div id="posts"></div>
<script type="module" src="manage-posts.js"></script>
</body></html>
